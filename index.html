<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>九九乘法小游戏</title>


<style>

body{

margin:0;
padding:20px;

background:#eef6ff;

font-family:
Arial,
"Microsoft YaHei";

text-align:center;

}


.box{

max-width:420px;

margin:auto;

background:white;

border-radius:20px;

padding:25px;

}


h1{

font-size:30px;

}


.info{

font-size:22px;

line-height:40px;

}


#question{

font-size:45px;

margin:30px;

}



#answer{

height:45px;

font-size:35px;

color:#3478f6;

}



.buttons{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:10px;

}



button{

height:60px;

font-size:28px;

border:0;

border-radius:15px;

background:#3478f6;

color:white;

}



button:active{

transform:scale(0.95);

}



.submit{

background:#28a745;

}


.clear{

background:#ff9800;

}


#message{

height:40px;

font-size:25px;

margin-top:20px;

}


</style>

</head>


<body>


<div class="box">


<h1>
🎮 九九乘法小游戏
</h1>



<div class="info">

⭐ 得分：
<span id="score">
0
</span>

<br>


❤️ 生命：

<span id="life">
❤️❤️❤️
</span>


</div>



<div id="question">

准备开始

</div>



<div>

你的答案：

<span id="answer"></span>

</div>


<br>



<div class="buttons" id="buttons"></div>


<br>


<button class="clear" onclick="clearAnswer()">

清除

</button>


<button class="submit" onclick="submitAnswer()">

提交

</button>


<div id="message"></div>



</div>



<script>


let a,b;

let userAnswer="";

let score=0;

let life=3;



function newQuestion(){


a=Math.floor(Math.random()*9)+1;

b=Math.floor(Math.random()*9)+1;


document.getElementById("question")
.innerHTML=

a+" × "+b+" = ?";


userAnswer="";


document.getElementById("answer")
.innerHTML="";


document.getElementById("message")
.innerHTML="";


createButtons();


}



function createButtons(){


let html="";


for(let i=1;i<=9;i++){


html+=

`

<button onclick="input(${i})">

${i}

</button>

`;

}


html+=

`

<button onclick="input(0)">

0

</button>

`;


document.getElementById("buttons")
.innerHTML=html;


}




function input(num){


if(userAnswer.length<2){


userAnswer+=num;


document.getElementById("answer")
.innerHTML=userAnswer;


}


}



function clearAnswer(){


userAnswer="";


document.getElementById("answer")
.innerHTML="";


}



function submitAnswer(){


if(userAnswer==""){

return;

}


let correct=a*b;


if(Number(userAnswer)==correct){


score+=10;


document.getElementById("message")
.innerHTML=

"⭐ 答对啦";


}else{


life--;


document.getElementById("message")
.innerHTML=

"❌ 正确答案："+correct;


}



document.getElementById("score")
.innerHTML=score;


document.getElementById("life")
.innerHTML=

"❤️".repeat(life);



if(life<=0){


alert(
"游戏结束！得分："+score
);


score=0;

life=3;


}



setTimeout(
newQuestion,
800
);



}



newQuestion();


</script>


</body>

</html>
