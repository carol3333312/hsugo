<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>九九乘法学习</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}



.app{

width:92%;

max-width:450px;

margin:20px auto;

background:#ffffff;

border-radius:20px;

padding:20px;

text-align:center;

}



h1{

font-size:28px;

color:#333;

}



.group{

font-size:20px;

font-weight:bold;

margin:10px;

}




/* 进度条 */

.progress-box{

height:18px;

background:#cccccc;

border-radius:20px;

overflow:hidden;

}


.progress-green{

height:100%;

width:0%;

background:#4caf50;

transition:.4s;

}



.progress-text{

margin:8px;

color:#555;

}




.lesson{

margin:20px 0;

background:#f7f7f7;

padding:20px;

border-radius:15px;

}




.cn{

font-size:40px;

font-weight:bold;

color:#333;

}



.math{

font-size:32px;

margin-top:15px;

color:#333;

}





input{

width:130px;

height:45px;

font-size:25px;

text-align:center;

border:1px solid #999;

border-radius:10px;

}



button{

padding:10px 18px;

margin:8px;

border:0;

border-radius:10px;

background:#666;

color:white;

font-size:16px;

}



.feedback{

height:45px;

font-size:22px;

color:#4caf50;

}



.flower{

font-size:35px;

display:none;

}



</style>


</head>


<body>


<div class="app">


<h1>
九九乘法学习
</h1>



<div id="group" class="group">

第1组：×1乘法

</div>




<div>

学习进度

</div>



<div class="progress-box">


<div id="progress" class="progress-green">

</div>


</div>



<div id="progressText" class="progress-text">

0 / 9

</div>





<div class="lesson">


<div id="cn" class="cn">

一一得一

</div>


<div id="math" class="math">

1 × 1 = 1

</div>


</div>





<input id="answer" placeholder="输入答案">





<div>


<button id="learn">

学习

</button>


<button id="submit">

提交

</button>


<button id="restart">

重新开始

</button>


</div>





<div id="feedback" class="feedback">

</div>


<div id="flower" class="flower">

🌸

</div>




</div>



<script>
// ================================
// 九九乘法学习 V1.0
// 数据结构
// ================================


// 九组乘法

let groups=[];


// 生成 ×1 到 ×9

for(let b=1;b<=9;b++){


let list=[];


for(let a=1;a<=9;a++){


let result=a*b;


list.push({

a:a,

b:b,

answer:result,

text:getChinese(a)+getChinese(b)+getResultText(result),

done:false

});


}



groups.push({

name:"×"+b+"乘法",

questions:list

});


}






// ================================
// 中文转换
// ================================


function getChinese(n){

let arr=[

"零",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九",
"十",
"十一",
"十二",
"十三",
"十四",
"十五",
"十六",
"十七",
"十八"

];


return arr[n];

}




function getResultText(num){


if(num<=10){

return "得"+getChinese(num);

}


return getChinese(num);


}







// ================================
// 当前状态
// ================================


let currentGroup=0;


let currentIndex=0;


// 0 学习
// 1 补口诀
// 2 数字测试

let stage=0;



let correctCount=0;



// ================================
// 获取当前题
// ================================


function currentQuestion(){


return groups[currentGroup]
.questions[currentIndex];


}






// ================================
// 显示题目
// ================================


function render(){


let q=currentQuestion();



document
.getElementById("group")
.innerText=

"第"+
(currentGroup+1)+
"组："+
groups[currentGroup].name;



document
.getElementById("cn")
.innerText=

q.text;



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



updateProgress();


}






// ================================
// 学习按钮
// ================================


document
.getElementById("learn")
.onclick=function(){



let q=currentQuestion();


stage=1;



// 显示补全

document
.getElementById("cn")
.innerText=

q.text.substring(
0,
q.text.length-1
)
+
"__";



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=
"填最后一个字";



document
.getElementById("feedback")
.innerText=
"补全口诀";



speak(q.text);



};
// ================================
// 提交按钮
// ================================


document
.getElementById("submit")
.onclick=function(){


let q=currentQuestion();


let value=

document
.getElementById("answer")
.value
.trim();




// ================================
// 第一阶段：口诀补全
// ================================


if(stage===1){



// 输入最后一个字

if(
value===getChinese(q.answer)
){



stage=2;



document
.getElementById("cn")
.innerText=
q.text;



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = ?";



document
.getElementById("answer")
.value="";


document
.getElementById("answer")
.placeholder=
"输入数字";


document
.getElementById("feedback")
.innerText=
"✓ 口诀正确";



}

else{


document
.getElementById("feedback")
.innerText=
"再想一下";


}


}





// ================================
// 第二阶段：数字测试
// ================================


else if(stage===2){



if(
Number(value)===q.answer
){



q.done=true;


correctCount++;



successReward();



setTimeout(()=>{


nextQuestion();


},1000);



}

else{


document
.getElementById("feedback")
.innerText=
"再试一次";


}



}



};








// ================================
// 答对奖励
// ================================


function successReward(){



//文字

document
.getElementById("feedback")
.innerText=

"🌸 许彦篪，你真棒！";



//小花显示

document
.getElementById("flower")
.style.display=
"block";



//语音

speak(
"许彦篪，你真棒"
);



//提示音

let ctx=
new AudioContext();


let osc=
ctx.createOscillator();


let gain=
ctx.createGain();



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.frequency.value=880;


gain.gain.value=.15;


osc.start();


osc.stop(
ctx.currentTime+0.25
);



updateProgress();


}







// ================================
// 下一题
// ================================


function nextQuestion(){



currentIndex++;



// 当前组完成

if(
currentIndex>=9
){


finishGroup();


return;

}



stage=0;


document
.getElementById("flower")
.style.display=
"none";



document
.getElementById("feedback")
.innerText="";



document
.getElementById("answer")
.placeholder=
"输入答案";



render();



}
// ================================
// 进度条更新
// ================================


function updateProgress(){


let done=

groups[currentGroup]
.questions
.filter(q=>q.done)
.length;



let percent=

(done/9)*100;



document
.getElementById("progress")
.style.width=

percent+"%";



document
.getElementById("progressText")
.innerText=

done+" / 9";


}







// ================================
// 完成一组
// ================================


function finishGroup(){



document
.getElementById("feedback")
.innerText=

"🌸 本组完成！";



speak(
groups[currentGroup].name+"完成了，太棒了"
);




setTimeout(()=>{



currentGroup++;



// 全部完成

if(
currentGroup>=groups.length
){


currentGroup=0;


document
.getElementById("feedback")
.innerText=

"🎉 九九乘法全部完成！";


speak(
"九九乘法全部完成"
);


}



//进入下一组


currentIndex=0;


stage=0;



groups[currentGroup]
.questions
.forEach(q=>{

q.done=false;

});



render();



},1500);



}







// ================================
// 重新开始
// ================================


document
.getElementById("restart")
.onclick=function(){



currentGroup=0;

currentIndex=0;

stage=0;



correctCount=0;



groups.forEach(group=>{


group.questions.forEach(q=>{


q.done=false;


});


});



document
.getElementById("answer")
.value="";


document
.getElementById("feedback")
.innerText="";



document
.getElementById("flower")
.style.display=
"none";



render();



};







// ================================
// 语音
// ================================


function speak(text){



if(!window.speechSynthesis){

return;

}



let u=
new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=0.8;



speechSynthesis.cancel();


speechSynthesis.speak(u);



}







// ================================
// 初始化
// ================================


render();


</script>


</body>

</html>
