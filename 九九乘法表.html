<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>九九乘法学习</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}



.app{

width:92%;

max-width:500px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

}




h1{

font-size:32px;

}



.message{

background:#f5f5f5;

padding:15px;

border-radius:15px;

font-size:20px;

}



.lesson{

font-size:38px;

font-weight:bold;

margin:25px;

}



.progress{

height:25px;

background:#ccc;

border-radius:20px;

overflow:hidden;

}



.green{

height:100%;

width:0%;

background:#4caf50;

transition:.5s;

}



.info{

font-size:20px;

margin:15px;

}



button{

width:90%;

padding:15px;

margin:8px;

border:none;

border-radius:15px;

background:#4caf50;

color:white;

font-size:20px;

}



input{

width:160px;

font-size:28px;

padding:10px;

text-align:center;

border-radius:10px;

border:1px solid #ccc;

}



.result{

font-size:22px;

margin:20px;

min-height:35px;

}



.hide{

display:none;

}



</style>


</head>



<body>


<div class="app">


<h1>
🧮 九九乘法学习
</h1>



<div class="message" id="message">

准备学习九九乘法

</div>



<div class="lesson" id="lesson">

一一得一

</div>




<div>

掌握进度

</div>



<div class="progress">

<div class="green" id="bar">

</div>

</div>



<div class="info">

<span id="count">

0

</span>

/45

&nbsp;&nbsp;

⭐

<span id="stars">

0

</span>

</div>




<button id="learnBtn">

📖 学口诀

</button>



<div id="inputArea" class="hide">


<input id="input">


<button id="submitBtn">

提交

</button>


</div>



<button id="restartBtn">

🔄重新开始

</button>



<div class="result" id="result">

</div>



</div>


<script>
  // ================================
// 九九乘法数据
// ================================


const table=[


["一一得一",1,1,1],
["一二得二",1,2,2],
["一三得三",1,3,3],
["一四得四",1,4,4],
["一五得五",1,5,5],
["一六得六",1,6,6],
["一七得七",1,7,7],
["一八得八",1,8,8],
["一九得九",1,9,9],


["二二得四",2,2,4],
["二三得六",2,3,6],
["二四得八",2,4,8],
["二五一十",2,5,10],
["二六十二",2,6,12],
["二七十四",2,7,14],
["二八十六",2,8,16],
["二九十八",2,9,18],


["三三得九",3,3,9],
["三四十二",3,4,12],
["三五十五",3,5,15],
["三六十八",3,6,18],
["三七二十一",3,7,21],
["三八二十四",3,8,24],
["三九二十七",3,9,27],


["四四十六",4,4,16],
["四五二十",4,5,20],
["四六二十四",4,6,24],
["四七二十八",4,7,28],
["四八三十二",4,8,32],
["四九三十六",4,9,36],


["五五二十五",5,5,25],
["五六三十",5,6,30],
["五七三十五",5,7,35],
["五八四十",5,8,40],
["五九四十五",5,9,45],


["六六三十六",6,6,36],
["六七四十二",6,7,42],
["六八四十八",6,8,48],
["六九五十四",6,9,54],


["七七四十九",7,7,49],
["七八五十六",7,8,56],
["七九六十三",7,9,63],


["八八六十四",8,8,64],
["八九七十二",8,9,72],


["九九八十一",9,9,81]


];






// ================================
// 创建学习任务
// ================================


let lessons=table.map((item,index)=>{


return {


id:index,


text:item[0],


a:item[1],


b:item[2],


answer:item[3],



// 掌握程度

mastery:0,



// 当前状态

// 0 学口诀
// 1 补全
// 2 数字测试
// 3 完成

stage:0,


correct:0,


wrong:0


};


});





// 当前题号

let currentIndex=0;



// 星星

let stars=0;



// 防止重复提交

let locked=false;





// ================================
// 当前题
// ================================


function currentTask(){


return lessons[currentIndex];


}







// ================================
// 设置阶段
// ================================


function setStage(value){


currentTask().stage=value;


}
// ================================
// 语音
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


speechSynthesis.cancel();



let u=new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=0.75;



speechSynthesis.speak(u);


}







// ================================
// 显示当前口诀
// ================================


function showTask(){


let x=currentTask();



document
.getElementById("lesson")
.innerText=x.text;


}







// ================================
// 点击学习口诀
// ================================


document
.getElementById("learnBtn")
.onclick=function(){


let x=currentTask();



// 防止重复点击

if(x.stage!==0){

return;

}



setStage(1);



document
.getElementById("message")
.innerText=

"记住这个口诀";



showTask();



speak(

x.a+
"乘"+
x.b+
"等于"+
x.answer+
"。"+
x.text

);




// 自动进入补全

setTimeout(()=>{


openInput("memory");


},2500);



};







// ================================
// 打开输入框
// ================================


function openInput(type){


let area=

document
.getElementById("inputArea");



area.classList
.remove("hide");



let input=

document
.getElementById("input");



input.value="";



if(type==="memory"){



document
.getElementById("message")
.innerText=

"补全口诀";



input.placeholder=

"输入缺少的字";



}



if(type==="test"){



document
.getElementById("message")
.innerText=

"计算答案";



input.placeholder=

"输入数字";



}



}







// ================================
// 提交按钮
// ================================


document
.getElementById("submitBtn")
.onclick=function(){



if(locked){

return;

}



let x=currentTask();



let value=

document
.getElementById("input")
.value
.trim();





// ================================
// 补全阶段
// ================================


if(x.stage===1){



let missing=

x.text.substring(

x.text.length-1

);





if(value===missing){



setStage(2);



x.mastery+=40;



document
.getElementById("result")
.innerText=

"🎉 口诀正确！";



speak(
"正确"
);



// 立即进入数字测试

openInput("test");



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"再试一次";


}



}






// ================================
// 数字测试阶段
// ================================


else if(x.stage===2){



if(Number(value)===x.answer){



locked=true;



x.correct++;


x.mastery=100;



finishTask();



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"答案错误";


}



}



update();

save();


};
// ================================
// 完成当前任务
// ================================


function finishTask(){


let x=currentTask();



x.mastery=100;


stars+=1;



document
.getElementById("result")
.innerText=

"🎉 掌握成功 ⭐+1";



document
.getElementById("inputArea")
.classList
.add("hide");



update();

save();



// 唯一下一题入口

setTimeout(()=>{


nextTask();


},300);



}







// ================================
// 下一题
// ================================


function nextTask(){



// 当前题号递增

currentIndex++;



// 到最后重新开始

if(currentIndex>=lessons.length){


currentIndex=0;


}




resetTask();


}







// ================================
// 重置新任务
// ================================


function resetTask(){


let x=currentTask();



x.stage=0;



locked=false;



document
.getElementById("message")
.innerText=

"准备学习";


document
.getElementById("result")
.innerText="";



document
.getElementById("input")
.value="";



document
.getElementById("inputArea")
.classList
.add("hide");



showTask();



}








// ================================
// 更新进度
// ================================


function update(){



let mastered=

lessons.filter(x=>{


return x.mastery>=90;


}).length;



let total=0;



lessons.forEach(x=>{


total+=x.mastery;


});



let percent=

Math.round(

total/

lessons.length

);




// 绿色进度条

document
.getElementById("bar")
.style.width=

percent+"%";



document
.getElementById("count")
.innerText=

mastered;



document
.getElementById("stars")
.innerText=

stars;



}








// ================================
// 保存
// ================================


function save(){



localStorage.setItem(

"jiujiu_v7_lessons",

JSON.stringify(lessons)

);



localStorage.setItem(

"jiujiu_v7_stars",

stars

);


}
// ================================
// 读取数据
// ================================


function load(){


try{


let data=

localStorage.getItem(
"jiujiu_v7_lessons"
);



if(data){


lessons=

JSON.parse(data);


}




let starData=

localStorage.getItem(
"jiujiu_v7_stars"
);



if(starData){


stars=

Number(starData);


}



}catch(e){


console.log(
"读取数据失败"
);


}


}








// ================================
// 重新开始
// ================================


document
.getElementById("restartBtn")
.onclick=function(){



let ok=

confirm(
"确定重新开始九九乘法学习吗？"
);



if(!ok){

return;

}



lessons.forEach(x=>{


x.mastery=0;

x.stage=0;

x.correct=0;

x.wrong=0;


});



stars=0;


currentIndex=0;


locked=false;



save();



resetTask();


update();



document
.getElementById("message")
.innerText=

"重新开始学习";


};








// ================================
// 初始化
// ================================


function init(){


load();



currentIndex=0;


locked=false;



showTask();


update();



document
.getElementById("message")
.innerText=

"开始学习九九乘法";


}






// ================================
// 自动保存
// ================================


setInterval(()=>{


save();


},30000);






window.onbeforeunload=function(){


save();


};






// 启动程序

init();



</script>


</body>


</html>
