<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>九九乘法智能老师 V3.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
background:linear-gradient(#e8f7ff,#fff);
font-family:-apple-system,"Microsoft YaHei",sans-serif;
color:#333;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.app{max-width:400px;width:94%;margin:8px auto;padding-bottom:12px}
.card{
background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;
box-shadow:0 3px 12px rgba(0,0,0,.07);text-align:center
}
.title{font-size:18px;font-weight:700}
.sub{font-size:11px;color:#666;margin:1px 0 6px}
.status{display:flex;gap:8px}
.box{flex:1;background:#f5f7fa;border-radius:10px;padding:5px 4px}
.box .label{font-size:11px;color:#888}
.num{font-size:18px;color:#ff9800;font-weight:700;margin-top:1px}
.level{font-size:14px;font-weight:700;margin-bottom:4px}
.progress-bg{height:8px;background:#eee;border-radius:8px;overflow:hidden}
.progress{height:100%;width:0;background:#4caf50;transition:.3s}
.progressText{font-size:11px;color:#666;margin-top:2px}
.kou{
background:#f8f9fa;color:#111;border:1px solid #e0e0e0;
border-radius:10px;padding:8px 12px;font-size:18px;font-weight:700;
letter-spacing:1px;display:inline-block;min-width:140px;margin:4px 0
}
.voice-btn{
background:#e3f2fd;color:#1976d2;border:none;
border-radius:16px;padding:4px 12px;font-size:12px
}
.question{font-size:26px;font-weight:700;padding:6px 0 4px}
input{
width:110px;height:38px;border-radius:10px;border:2px solid #ddd;
font-size:20px;text-align:center;background:#fafafa;outline:none
}
input:focus{border-color:#2196f3;background:#fff}
.keyboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
.key{
background:#eef5ff;border:none;border-radius:10px;height:38px;
font-size:18px;font-weight:600;color:#333
}
.key:active{background:#d0e4ff}
.btn-row{display:flex;gap:6px;margin-top:4px}
.btn{
flex:1;border:none;border-radius:10px;height:36px;font-size:13px;font-weight:600
}
.learn{background:#2196f3;color:#fff}
.submit{background:#4caf50;color:#fff}
.reset{background:#f0f0f0;color:#555}
.message{font-size:15px;height:20px;margin-top:4px;font-weight:600}
.correct{color:#4caf50}
.wrong{color:#ff7043}
</style>
</head>
<body>
<div class="app">

<div class="card">
  <div class="title">🌈 九九乘法智能老师</div>
  <div class="sub">快乐学习 · 闯关成长</div>
  <div class="status">
    <div class="box"><div class="label">⭐ 星星</div><div id="stars" class="num">0</div></div>
    <div class="box"><div class="label">🔥 连胜</div><div id="combo" class="num">0</div></div>
  </div>
</div>

<div class="card">
  <div id="level" class="level"></div>
  <div class="progress-bg"><div id="bar" class="progress"></div></div>
  <div id="progressText" class="progressText"></div>
</div>

<div class="card">
  <div style="font-size:12px;color:#666">📖 口诀记忆</div>
  <div id="kou" class="kou"></div>
  <button id="voice" class="voice-btn">🔊 听口诀</button>
</div>

<div class="card">
  <div id="question" class="question"></div>
  <input id="answer" readonly placeholder="答案" inputmode="none">
  <div class="keyboard">
    <button class="key">1</button><button class="key">2</button><button class="key">3</button>
    <button class="key">4</button><button class="key">5</button><button class="key">6</button>
    <button class="key">7</button><button class="key">8</button><button class="key">9</button>
    <button class="key">0</button><button id="clear" class="key">⌫</button><button class="key" style="visibility:hidden"></button>
  </div>
  <div class="btn-row">
    <button id="learn" class="btn learn">📖 学习</button>
    <button id="submit" class="btn submit">🚀 提交</button>
    <button id="reset" class="btn reset">重开</button>
  </div>
  <div id="message" class="message"></div>
</div>

</div>

<script>
const names = ["一","二","三","四","五","六","七","八","九"];
const kouMap = {
  "1x1":"一一得一","1x2":"一二得二","1x3":"一三得三","1x4":"一四得四",
  "1x5":"一五得五","1x6":"一六得六","1x7":"一七得七","1x8":"一八得八","1x9":"一九得九",
  "2x2":"二二得四","2x3":"二三得六","2x4":"二四得八","2x5":"二五一十",
  "2x6":"二六十二","2x7":"二七十四","2x8":"二八十六","2x9":"二九十八",
  "3x3":"三三得九","3x4":"三四十二","3x5":"三五十五","3x6":"三六十八",
  "3x7":"三七二十一","3x8":"三八二十四","3x9":"三九二十七",
  "4x4":"四四十六","4x5":"四五二十","4x6":"四六二十四","4x7":"四七二十八",
  "4x8":"四八三十二","4x9":"四九三十六",
  "5x5":"五五二十五","5x6":"五六三十","5x7":"五七三十五","5x8":"五八四十","5x9":"五九四十五",
  "6x6":"六六三十六","6x7":"六七四十二","6x8":"六八四十八","6x9":"六九五十四",
  "7x7":"七七四十九","7x8":"七八五十六","7x9":"七九六十三",
  "8x8":"八八六十四","8x9":"八九七十二",
  "9x9":"九九八十一"
};

const groups = [];
for(let b=1;b<=9;b++){
  let arr = [];
  for(let a=1;a<=9;a++){
    let key = Math.min(a,b)+"x"+Math.max(a,b);
    arr.push({a,b,answer:a*b,key,done:false});
  }
  groups.push(arr);
}

let g=0, i=0, stars=0, combo=0;
const answerEl = document.getElementById("answer");
const messageEl = document.getElementById("message");
const starsEl = document.getElementById("stars");
const comboEl = document.getElementById("combo");

function q(){ return groups[g][i]; }

function render(){
  const x = q();
  document.getElementById("level").innerText = "第"+(g+1)+"组："+names[g]+"的乘法";
  document.getElementById("kou").innerText = kouMap[x.key] || (x.a+"×"+x.b+"="+x.answer);
  document.getElementById("question").innerText = x.a+" × "+x.b+" = ?";
  answerEl.value = "";
  const done = groups[g].filter(item=>item.done).length;
  document.getElementById("bar").style.width = (done/9*100)+"%";
  document.getElementById("progressText").innerText = done+"/9 已完成";
  messageEl.innerText = "";
  messageEl.className = "message";
}

document.querySelectorAll(".key").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.id==="clear"){
      answerEl.value = "";
    }else if(answerEl.value.length < 2){
      answerEl.value += btn.innerText;
    }
    answerEl.focus();
  });
});

document.getElementById("submit").addEventListener("click",()=>{
  const x = q();
  if(answerEl.value === "") return;
  if(Number(answerEl.value) === x.answer){
    x.done = true;
    stars++;
    combo++;
    starsEl.innerText = stars;
    comboEl.innerText = combo;
    messageEl.innerText = "⭐ 太棒啦！";
    messageEl.className = "message correct";
    playSound("correct");
    setTimeout(()=>{
      i++;
      if(i>=9){ i=0; g=(g+1)%9; }
      render();
    },700);
  }else{
    combo = 0;
    comboEl.innerText = 0;
    messageEl.innerText = "😊 再想一下";
    messageEl.className = "message wrong";
    playSound("wrong");
  }
});

document.getElementById("learn").addEventListener("click",()=>{
  const text = document.getElementById("kou").innerText;
  messageEl.innerText = "记住："+text;
  messageEl.className = "message";
  speak(text);
});

document.getElementById("voice").addEventListener("click",()=>{
  speak(document.getElementById("kou").innerText);
});

document.getElementById("reset").addEventListener("click",()=>{
  g=0; i=0; stars=0; combo=0;
  groups.forEach(arr=>arr.forEach(item=>item.done=false));
  starsEl.innerText = 0;
  comboEl.innerText = 0;
  render();
});

function speak(t){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "zh-CN";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}

function playSound(type){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if(type==="correct"){
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.25);
    }else{
      osc.frequency.value = 220;
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.3);
    }
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
    setTimeout(()=>ctx.close(),400);
  }catch(e){}
}

answerEl.addEventListener("click",()=>answerEl.focus());
render();
</script>
</body>
</html>
