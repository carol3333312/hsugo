<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>九九乘法学习</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#ffffff;

font-family:"Microsoft YaHei",sans-serif;

color:#333;

}



.app{

width:92%;
max-width:450px;

margin:20px auto;

padding:20px;

border:1px solid #ddd;

border-radius:16px;

text-align:center;

}



h1{

font-size:28px;

}



.group-title{

font-size:20px;

margin:10px;

font-weight:bold;

}



.progress-bg{

height:18px;

background:#ddd;

border-radius:10px;

overflow:hidden;

}



.progress-green{

height:100%;

width:0%;

background:#4caf50;

transition:.3s;

}



.progress-text{

margin:8px;

color:#666;

}



.card{

background:#fafafa;

padding:20px;

border-radius:15px;

margin:20px 0;

}



.cn{

font-size:38px;

font-weight:bold;

}



.math{

font-size:30px;

margin-top:15px;

}



input{

width:130px;

height:45px;

font-size:24px;

text-align:center;

border:1px solid #999;

border-radius:8px;

}



button{

border:0;

border-radius:8px;

padding:10px 18px;

margin:5px;

font-size:16px;

}



#learn,

#submit{

background:#4caf50;

color:white;

}



#restart{

background:#ddd;

color:#555;

}



.feedback{

margin-top:15px;

font-size:22px;

color:#4caf50;

}



.flower{

font-size:36px;

}



</style>

</head>


<body>


<div class="app">


<h1>
九九乘法学习
</h1>


<div id="groupTitle" class="group-title">

第1组

</div>



<div>
学习进度
</div>


<div class="progress-bg">

<div id="progress" class="progress-green">

</div>

</div>



<div id="progressText" class="progress-text">

0 / 9

</div>




<div class="card">


<div id="cn" class="cn">

一一得一

</div>


<div id="math" class="math">

1 × 1 = 1

</div>


</div>




<input id="answer" placeholder="输入答案">



<div>


<button id="learn">
学习
</button>


<button id="submit">
提交
</button>


<button id="restart">
重新开始
</button>


</div>



<div id="feedback" class="feedback">

</div>



<div id="flower" class="flower">

</div>


</div>


<script>
// ================================
// 九九乘法数据
// ================================


let groups=[];


// 中文数字

const nums=[

"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九",
"十",
"十一",
"十二",
"十三",
"十四",
"十五",
"十六",
"十七",
"十八",
"十九",
"二十",
"二十一",
"二十二",
"二十三",
"二十四",
"二十五",
"二十六",
"二十七",
"二十八",
"二十九",
"三十",
"三十一",
"三十二",
"三十三",
"三十四",
"三十五",
"三十六",
"三十七",
"三十八",
"三十九",
"四十",
"四十一",
"四十二",
"四十三",
"四十四",
"四十五",
"四十六",
"四十七",
"四十八",
"四十九",
"五十",
"五十一",
"五十二",
"五十三",
"五十四",
"五十五",
"五十六",
"五十七",
"五十八",
"五十九",
"六十",
"六十一",
"六十二",
"六十三",
"六十四",
"六十五",
"六十六",
"六十七",
"六十八",
"六十九",
"七十",
"七十一",
"七十二",
"七十三",
"七十四",
"七十五",
"七十六",
"七十七",
"七十八",
"七十九",
"八十",
"八十一"

];






// 生成9组

// 第1组:
// 1×1
// 2×1
// ...
// 9×1


for(let b=1;b<=9;b++){


let list=[];


for(let a=1;a<=9;a++){


let result=a*b;


list.push({

a:a,

b:b,

answer:result,

done:false

});


}



groups.push({

name:"第"+b+"组",

list:list

});


}








// ================================
// 中文口诀
// ================================


function makeKouJue(q){


let left=

nums[q.a]+
nums[q.b];



if(q.answer<=10){


return left+
"得"+
nums[q.answer];


}


return left+
nums[q.answer];



}








// ================================
// 当前状态
// ================================


let groupIndex=0;


let questionIndex=0;


// 0 初始
// 1 补口诀
// 2 数字测试

let stage=0;



function getCurrent(){


return groups[groupIndex]
.list[questionIndex];


}


// ================================
// 显示当前题
// ================================


function render(){


let q=getCurrent();



document
.getElementById("groupTitle")
.innerText=

groups[groupIndex].name+
"："+
q.a+
"×"+
q.b;



document
.getElementById("cn")
.innerText=

makeKouJue(q);



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



updateProgress();


}






// ================================
// 学习按钮
// ================================


document
.getElementById("learn")
.onclick=function(){



let q=getCurrent();


stage=1;



let text=

makeKouJue(q);



document
.getElementById("cn")
.innerText=

text.substring(
0,
text.length-1
)
+
"__";



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=

"填最后一个字";



document
.getElementById("feedback")
.innerText=

"补全口诀";


};






// ================================
// 提交按钮
// ================================


document
.getElementById("submit")
.onclick=function(){


let q=getCurrent();


let value=

document
.getElementById("answer")
.value
.trim();





// 口诀阶段

if(stage===1){



if(
value===nums[q.answer]
){


stage=2;



document
.getElementById("cn")
.innerText=

makeKouJue(q);



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = ?";



document
.getElementById("answer")
.value="";


document
.getElementById("answer")
.placeholder=

"输入数字";



document
.getElementById("feedback")
.innerText=

"✓ 口诀正确";


}

else{


document
.getElementById("feedback")
.innerText=

"再想一下";


}



}






// 数字阶段


else if(stage===2){



if(
Number(value)===q.answer
){



q.done=true;



document
.getElementById("feedback")
.innerText=

"✓ 正确\n许彦篪，你真棒！";



document
.getElementById("flower")
.innerText=

"🌸";



updateProgress();



setTimeout(()=>{


nextQuestion();


},800);



}

else{


document
.getElementById("feedback")
.innerText=

"再试一次";


}



}


};
// ================================
// 更新组内进度
// ================================


function updateProgress(){


let done=

groups[groupIndex]
.list
.filter(q=>q.done)
.length;



let percent=

(done/9)*100;



document
.getElementById("progress")
.style.width=

percent+"%";



document
.getElementById("progressText")
.innerText=

done+
" / 9";



}








// ================================
// 下一题
// ================================


function nextQuestion(){



questionIndex++;


stage=0;



// 当前组完成

if(
questionIndex>=9
){



setTimeout(()=>{


alert(
groups[groupIndex].name+
"完成"
);



groupIndex++;



// 九组全部完成

if(
groupIndex>=groups.length
){


groupIndex=0;


alert(
"九九乘法全部完成"
);


}




questionIndex=0;



groups[groupIndex]
.list
.forEach(q=>{

q.done=false;

});



render();



},500);



return;


}





document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=

"输入答案";



document
.getElementById("feedback")
.innerText="";



document
.getElementById("flower")
.innerText="";



render();



}







// ================================
// 重新开始
// ================================


document
.getElementById("restart")
.onclick=function(){



groupIndex=0;

questionIndex=0;

stage=0;



groups.forEach(group=>{


group.list.forEach(q=>{


q.done=false;


});


});



document
.getElementById("answer")
.value="";



document
.getElementById("feedback")
.innerText="";


document
.getElementById("flower")
.innerText="";



render();



};








// ================================
// 初始化
// ================================


render();
</script>

</body>

</html>
