<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小悟课堂 V4 九九乘法</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}


.app{

width:92%;

max-width:500px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



h1{

font-size:32px;

}



.teacher{

background:#f5f5f5;

padding:15px;

border-radius:15px;

font-size:20px;

line-height:1.6;

}



.lesson{

font-size:34px;

font-weight:bold;

margin:25px 0;

}



.progress{

height:25px;

background:#ccc;

border-radius:20px;

overflow:hidden;

margin:15px 0;

}



.green{

height:100%;

background:#4caf50;

width:0%;

transition:.5s;

}



.info{

font-size:20px;

margin:15px;

}



button{

width:90%;

padding:14px;

margin:8px;

border:0;

border-radius:15px;

background:#4caf50;

color:white;

font-size:20px;

}



input{

width:150px;

padding:10px;

font-size:28px;

text-align:center;

border-radius:10px;

border:1px solid #ccc;

}



.result{

font-size:22px;

min-height:35px;

margin:20px;

}


.hide{

display:none;

}


</style>


</head>


<body>


<div class="app">


<h1>🧠 小悟课堂</h1>


<div class="teacher" id="teacher">

准备开始学习

</div>



<div class="lesson" id="lesson">

一一得一

</div>




<div>

口诀掌握进度

</div>


<div class="progress">

<div class="green" id="progress">

</div>

</div>


<div id="percent">

0%

</div>



<div class="info">

⭐ <span id="stars">0</span>

</div>



<div>

已掌握：

<span id="count">

0

</span>

/45

</div>





<button id="learn">

📖 学口诀

</button>



<div id="memoryBox" class="hide">


<input id="memoryInput" placeholder="补全口诀">


<button id="memoryBtn">

🧠 确认补全

</button>


</div>





<div id="testBox" class="hide">


<h2 id="question">

</h2>


<input id="answer" type="number" placeholder="答案">


<button id="testBtn">

✏️ 提交答案

</button>


</div>





<div class="result" id="result">

</div>



</div>


<script>
// ================================
// 九九乘法数据
// ================================


const table=[

["一一得一",1,1,1],
["一二得二",1,2,2],
["一三得三",1,3,3],
["一四得四",1,4,4],
["一五得五",1,5,5],
["一六得六",1,6,6],
["一七得七",1,7,7],
["一八得八",1,8,8],
["一九得九",1,9,9],

["二二得四",2,2,4],
["二三得六",2,3,6],
["二四得八",2,4,8],
["二五一十",2,5,10],
["二六十二",2,6,12],
["二七十四",2,7,14],
["二八十六",2,8,16],
["二九十八",2,9,18],

["三三得九",3,3,9],
["三四十二",3,4,12],
["三五十五",3,5,15],
["三六十八",3,6,18],
["三七二十一",3,7,21],
["三八二十四",3,8,24],
["三九二十七",3,9,27],

["四四十六",4,4,16],
["四五二十",4,5,20],
["四六二十四",4,6,24],
["四七二十八",4,7,28],
["四八三十二",4,8,32],
["四九三十六",4,9,36],

["五五二十五",5,5,25],
["五六三十",5,6,30],
["五七三十五",5,7,35],
["五八四十",5,8,40],
["五九四十五",5,9,45],

["六六三十六",6,6,36],
["六七四十二",6,7,42],
["六八四十八",6,8,48],
["六九五十四",6,9,54],

["七七四十九",7,7,49],
["七八五十六",7,8,56],
["七九六十三",7,9,63],

["八八六十四",8,8,64],
["八九七十二",8,9,72],

["九九八十一",9,9,81]

];




// ================================
// 学习对象
// ================================


let lessons=table.map((x,i)=>({


id:i,


text:x[0],


a:x[1],


b:x[2],


answer:x[3],



// 掌握度

mastery:0,



// 当前学习阶段

// 0 未学习
// 1 已学习
// 2 已补全
// 3 已测试

stage:0,



correct:0,


wrong:0,



streak:0,



review:0


}));




// 当前题目

let current=0;



// 当前阶段

let stage=0;



// 星星

let stars=0;



// 错题池

let wrongQueue=[];






// ================================
// 数据保存
// ================================


function save(){


localStorage.setItem(

"xw_v4_lessons",

JSON.stringify(lessons)

);



localStorage.setItem(

"xw_v4_stars",

stars

);



localStorage.setItem(

"xw_v4_wrong",

JSON.stringify(wrongQueue)

);


}







// ================================
// 数据读取
// ================================


function load(){


try{


let a=

localStorage.getItem(
"xw_v4_lessons"
);



if(a){

lessons=JSON.parse(a);

}




let b=

localStorage.getItem(
"xw_v4_stars"
);



if(b){

stars=Number(b);

}




let c=

localStorage.getItem(
"xw_v4_wrong"
);



if(c){

wrongQueue=JSON.parse(c);

}



}catch(e){


console.log("读取失败");


}



}



load();
// ================================
// 语音系统
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


speechSynthesis.cancel();



let u=
new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=0.75;


u.pitch=1.1;



speechSynthesis.speak(u);



}






// ================================
// 当前口诀
// ================================


function item(){


return lessons[current];


}







// ================================
// 显示当前口诀
// ================================


function showLesson(){


let x=item();


document
.getElementById("lesson")
.innerText=x.text;


}








// ================================
// 学口诀
// ================================


document
.getElementById("learn")
.onclick=function(){


let x=item();


stage=1;


x.stage=1;



showLesson();



speak(

x.a+
"乘"+
x.b+
"等于"+
x.answer+
"。"+
x.text

);



document
.getElementById("teacher")
.innerText=

"记住口诀："+x.text;




// 自动进入补全阶段

setTimeout(()=>{


openMemory();


},3000);



};







// ================================
// 打开补全
// ================================


function openMemory(){



stage=1;



document
.getElementById("memoryBox")
.classList
.remove("hide");



document
.getElementById("testBox")
.classList
.add("hide");



let x=item();



let blank=

x.text.substring(

0,

x.text.length-2

);



document
.getElementById("memoryInput")
.value="";



document
.getElementById("memoryInput")
.placeholder=

blank+"？";



}







// ================================
// 补全口诀
// ================================


document
.getElementById("memoryBtn")
.onclick=function(){


let x=item();



let blank=

x.text.substring(

0,

x.text.length-2

);



let input=

document
.getElementById("memoryInput")
.value
.trim();



if(input===""){


return;

}




if(blank+input===x.text){



x.mastery+=20;


if(x.mastery>100){

x.mastery=100;

}



x.stage=2;


stage=2;



document
.getElementById("result")
.innerText=

"🎉 背诵正确！";



speak(

"正确。"+
x.text

);





// 自动进入测试

setTimeout(()=>{


openTest();



},500);





}

else{



x.wrong++;


x.streak=0;



document
.getElementById("result")
.innerText=

"再想一下";


speak(

"再听一次"

);



}




save();


update();



};







// ================================
// 打开测试
// ================================


function openTest(){


document
.getElementById("memoryBox")
.classList
.add("hide");



document
.getElementById("testBox")
.classList
.remove("hide");



let x=item();



document
.getElementById("question")
.innerText=

x.a+
" × "+
x.b+
" = ?";



document
.getElementById("answer")
.value="";


}
// ================================
// 测试提交
// ================================


document
.getElementById("testBtn")
.onclick=function(){


let x=item();



let answer=

Number(
document
.getElementById("answer")
.value
);



if(answer===x.answer){



successTest(x);



}

else{


failTest(x);



}




save();

update();



};







// ================================
// 测试正确
// ================================


function successTest(x){



x.correct++;


x.streak++;


x.stage=3;



// 增加掌握度


x.mastery+=30;



if(x.mastery>100){

x.mastery=100;

}




// 奖励


stars+=2;



document
.getElementById("stars")
.innerText=

stars;



document
.getElementById("result")
.innerText=

"🎉 答对了！⭐+2";



speak(

"回答正确"

);





// 完成当前口诀

finishLesson();



}







// ================================
// 测试错误
// ================================


function failTest(x){



x.wrong++;


x.streak=0;



x.mastery-=5;



if(x.mastery<0){

x.mastery=0;

}




// 加入错题池


if(!wrongQueue.includes(x.id)){


wrongQueue.push(x.id);


}




document
.getElementById("result")
.innerText=

"再试一次："+x.text;



speak(

"再想一想"

);



}







// ================================
// 完成当前口诀
// 自动下一题
// ================================


function finishLesson(){



let x=item();



if(x.mastery>=90){


stars+=3;


document
.getElementById("result")
.innerText=

"🌟 完全掌握！+3星";


}



// 隐藏当前区域


document
.getElementById("testBox")
.classList
.add("hide");



document
.getElementById("memoryBox")
.classList
.add("hide");




// 自动下一题


setTimeout(()=>{


nextLesson();


showLesson();



},500);



}







// ================================
// 下一题选择
// ================================


function nextLesson(){



// 优先错题


if(wrongQueue.length>0){


current=

wrongQueue.shift();


return;


}



// 正常顺序


current++;



if(current>=lessons.length){


current=0;


}



}







// ================================
// 进度计算
// ================================


function update(){



let total=0;


let count=0;



lessons.forEach(x=>{


total+=x.mastery;



if(x.mastery>=90){


count++;


}



});



let percent=

Math.round(

total/(lessons.length)

);



document
.getElementById("progress")
.style.width=

percent+"%";



document
.getElementById("percent")
.innerText=

percent+"%";



document
.getElementById("count")
.innerText=

count;



document
.getElementById("stars")
.innerText=

stars;



}


// ================================
// 艾宾浩斯复习
// ================================


function setReview(x){


let now=Date.now();



if(x.mastery<40){


x.review=now;


}

else if(x.mastery<70){


x.review=

now+

86400000;


}

else if(x.mastery<90){


x.review=

now+

86400000*3;


}

else{


x.review=

now+

86400000*7;


}


}







// ================================
// 获取复习口诀
// ================================


function getReview(){


let now=Date.now();



return lessons.filter(x=>{


return x.review<=now;


});


}







// ================================
// 每日提示
// ================================


function dailyMessage(){


let list=getReview();



if(list.length>0){


document
.getElementById("teacher")
.innerText=

"今天加强"+
list.length+
"个口诀";


}

else{


document
.getElementById("teacher")
.innerText=

"开始新的口诀学习";


}


}








// ================================
// 初始化
// ================================


function init(){



let review=getReview();



if(review.length>0){


current=review[0].id;


}



showLesson();


update();


dailyMessage();



}







// ================================
// 自动保存
// ================================


setInterval(()=>{


save();


},30000);







window.onbeforeunload=function(){


save();


};






// 启动

init();



</script>


</body>


</html>
