<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小悟课堂 V3.2 九九乘法</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}


.app{

width:92%;

max-width:500px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



h1{

font-size:32px;

}



.teacher{

background:#f5f5f5;

padding:15px;

border-radius:15px;

font-size:20px;

line-height:1.6;

}



.lesson{

font-size:32px;

font-weight:bold;

margin:20px;

color:#333;

}



.progress-box{

margin-top:20px;

}



.progress{

height:25px;

background:#ccc;

border-radius:20px;

overflow:hidden;

}



.green{

height:100%;

width:0%;

background:#4caf50;

transition:.5s;

}



.info{

font-size:20px;

margin:15px;

}



.star{

font-size:26px;

}



button{

width:90%;

padding:14px;

margin:8px;

border:0;

border-radius:15px;

background:#4caf50;

color:white;

font-size:20px;

}



button:active{

transform:scale(.96);

}



input{

width:140px;

font-size:28px;

padding:10px;

text-align:center;

border-radius:10px;

border:1px solid #ccc;

}



.hide{

display:none;

}



.result{

font-size:22px;

margin:20px;

min-height:30px;

}



.level{

font-size:18px;

color:#555;

}


</style>


</head>


<body>


<div class="app">


<h1>🧠 小悟课堂</h1>


<div class="teacher" id="teacher">

今天学习九九乘法口诀

</div>


<div class="lesson" id="lesson">

准备开始

</div>



<div class="progress-box">

<div>
口诀掌握进度
</div>


<div class="progress">

<div class="green" id="progress">

</div>

</div>


<div id="percent">

0%

</div>


</div>



<div class="star">

⭐ <span id="stars">0</span>

</div>



<div class="level">

等级：

<span id="level">

数学小苗

</span>

</div>



<button id="learn">

📖 学习口诀

</button>


<button id="listen">

🔊 听老师读

</button>


<button id="memory">

🧠 补全口诀

</button>


<button id="test">

✏️ 开始测试

</button>



<div id="box" class="hide">


<h2 id="question"></h2>


<input id="answer"
type="number"
placeholder="答案">


<button id="submit">

提交

</button>


</div>



<div class="result" id="result">

</div>


</div>



<script>
  // ================================
// 九九乘法数据
// ================================

const table=[

["一一得一",1,1,1],
["一二得二",1,2,2],
["一三得三",1,3,3],
["一四得四",1,4,4],
["一五得五",1,5,5],
["一六得六",1,6,6],
["一七得七",1,7,7],
["一八得八",1,8,8],
["一九得九",1,9,9],

["二二得四",2,2,4],
["二三得六",2,3,6],
["二四得八",2,4,8],
["二五一十",2,5,10],
["二六十二",2,6,12],
["二七十四",2,7,14],
["二八十六",2,8,16],
["二九十八",2,9,18],

["三三得九",3,3,9],
["三四十二",3,4,12],
["三五十五",3,5,15],
["三六十八",3,6,18],
["三七二十一",3,7,21],
["三八二十四",3,8,24],
["三九二十七",3,9,27],

["四四十六",4,4,16],
["四五二十",4,5,20],
["四六二十四",4,6,24],
["四七二十八",4,7,28],
["四八三十二",4,8,32],
["四九三十六",4,9,36],

["五五二十五",5,5,25],
["五六三十",5,6,30],
["五七三十五",5,7,35],
["五八四十",5,8,40],
["五九四十五",5,9,45],

["六六三十六",6,6,36],
["六七四十二",6,7,42],
["六八四十八",6,8,48],
["六九五十四",6,9,54],

["七七四十九",7,7,49],
["七八五十六",7,8,56],
["七九六十三",7,9,63],

["八八六十四",8,8,64],
["八九七十二",8,9,72],

["九九八十一",9,9,81]

];



// ================================
// 学习数据
// ================================


let lessons=table.map((x,i)=>({

id:i,

text:x[0],

a:x[1],

b:x[2],

answer:x[3],

mastery:0,

streak:0,

correct:0,

wrong:0,

review:0,

reward:false

}));



let stars=0;

let current=0;


// 错题池

let wrongQueue=[];




// ================================
// 保存
// ================================


function save(){


localStorage.setItem(

"xiaowu_v32_lessons",

JSON.stringify(lessons)

);



localStorage.setItem(

"xiaowu_v32_stars",

stars

);



localStorage.setItem(

"xiaowu_v32_wrong",

JSON.stringify(wrongQueue)

);


}





// ================================
// 读取
// ================================


function load(){


try{


let a=

localStorage.getItem(
"xiaowu_v32_lessons"
);


if(a){

lessons=JSON.parse(a);

}



let b=

localStorage.getItem(
"xiaowu_v32_stars"
);



if(b){

stars=Number(b);

}




let c=

localStorage.getItem(
"xiaowu_v32_wrong"
);



if(c){

wrongQueue=JSON.parse(c);

}



}catch(e){


console.log(
"数据读取失败"
);


}


}



load();
// ================================
// 语音老师
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


speechSynthesis.cancel();


let u=
new SpeechSynthesisUtterance(text);


u.lang="zh-CN";


u.rate=0.75;


u.pitch=1.1;



speechSynthesis.speak(u);


}





// ================================
// 当前口诀
// ================================


function item(){

return lessons[current];

}




// ================================
// 显示当前口诀
// ================================


function showLesson(){


let x=item();


document
.getElementById("lesson")
.innerText=x.text;


}






// ================================
// 学习口诀
// 自动进入下一题
// ================================


document
.getElementById("learn")
.onclick=function(){


let x=item();


showLesson();



speak(

"今天学习"+
x.a+
"乘"+
x.b+
"等于"+
x.answer+
"。"+
x.text

);



// 朗读结束后自动下一条

setTimeout(()=>{


nextLesson();


showLesson();


},3500);



};








// ================================
// 听老师读
// ================================


document
.getElementById("listen")
.onclick=function(){


let x=item();


speak(x.text);


};






// ================================
// 补全口诀
// 输入答案后自动判断
// ================================


document
.getElementById("memory")
.onclick=function(){



let x=item();



let hideText=

x.text.substring(
0,
x.text.length-2
);



document
.getElementById("lesson")
.innerText=

hideText+"__";



let answer=

prompt(
"请补全口诀："+hideText
);



if(answer===null){

showLesson();

return;

}



let full=

hideText+answer;




if(full===x.text){



x.mastery+=10;


if(x.mastery>100){

x.mastery=100;

}



x.correct++;



document
.getElementById("result")
.innerText=

"🎉 背对了！"+
x.text;



speak(

"回答正确。"+
x.text

);



setReview(x);


save();


update();



setTimeout(()=>{


nextLesson();


showLesson();


},1500);



}

else{



document
.getElementById("result")
.innerText=

"再试一次："+x.text;



speak(

"再听一次"

);



}



};
// ================================
// 开始测试
// ================================


document
.getElementById("test")
.onclick=function(){


document
.getElementById("box")
.classList
.remove("hide");


showQuestion();


};






function showQuestion(){


let x=item();


document
.getElementById("question")
.innerText=

x.a+
" × "+
x.b+
" = ?";


document
.getElementById("answer")
.value="";


}







// ================================
// 提交答案
// ================================


document
.getElementById("submit")
.onclick=function(){


let x=item();


let answer=

Number(
document
.getElementById("answer")
.value
);




if(answer===x.answer){


correct(x);


}

else{


wrong(x);


}



save();


update();



setTimeout(()=>{


nextLesson();


showLesson();


},1500);



};







// ================================
// 答对
// ================================


function correct(x){



x.correct++;

x.streak++;



// 连续正确增加掌握度

if(x.streak===1){


x.mastery+=5;


}

else if(x.streak===2){


x.mastery+=8;


}

else{


x.mastery+=15;


}



if(x.mastery>100){


x.mastery=100;


}





// 达到掌握奖励

if(x.mastery>=90 && !x.reward){


stars+=3;


x.reward=true;


document
.getElementById("result")
.innerText=

"🎉 掌握口诀！⭐+3";


}

else{


document
.getElementById("result")
.innerText=

"⭐⭐ 很棒！"+
x.text;


}



setReview(x);



speak(

"回答正确。"+
x.text

);



}







// ================================
// 答错
// ================================


function wrong(x){


x.wrong++;


x.streak=0;



x.mastery-=5;



if(x.mastery<0){

x.mastery=0;

}




// 加入错题池

if(!wrongQueue.includes(x.id)){


wrongQueue.push(x.id);


}



document
.getElementById("result")
.innerText=

"需要加强："+x.text;



speak(

"再听一次。"+
x.text

);



setReview(x);


}







// ================================
// 艾宾浩斯复习
// ================================


function setReview(x){


let now=

Date.now();



if(x.mastery<40){


x.review=now;


}

else if(x.mastery<70){


x.review=

now+

86400000;


}

else if(x.mastery<90){


x.review=

now+

86400000*3;


}

else{


x.review=

now+

86400000*7;


}


}






// ================================
// 获取复习列表
// ================================


function getReviewList(){


let now=

Date.now();



return lessons.filter(x=>{


return x.review<=now;


});


}
// ================================
// 下一题选择
// ================================


function nextLesson(){


// 优先错题

if(wrongQueue.length>0){


let id=

wrongQueue.shift();



current=id;


showLesson();


return;


}





// 艾宾浩斯复习


let review=

getReviewList();



if(review.length>0){


current=

review[0].id;


showLesson();


return;


}




// 正常顺序


current++;



if(current>=lessons.length){


current=0;


}



showLesson();


}







// ================================
// 掌握进度
// ================================


function getProgress(){


let total=0;



lessons.forEach(x=>{


total+=x.mastery;


});



return Math.round(

total/

lessons.length

);


}







// ================================
// 等级
// ================================


function getLevel(){


if(stars<50){


return "数学小苗";


}



if(stars<200){


return "口诀学徒";


}



if(stars<500){


return "乘法高手";


}



return "数学达人";


}







// ================================
// 更新页面
// ================================


function update(){



let p=getProgress();



document
.getElementById("progress")
.style.width=

p+"%";



document
.getElementById("percent")
.innerText=

p+"%";



document
.getElementById("stars")
.innerText=

stars;



document
.getElementById("level")
.innerText=

getLevel();



}







// ================================
// 今日提示
// ================================


function dailyMessage(){


let review=

getReviewList();



if(review.length>0){



document
.getElementById("teacher")
.innerText=

"今天先复习"+
review.length+
"个薄弱口诀";


}

else{


document
.getElementById("teacher")
.innerText=

"开始学习新的口诀吧！";


}



}







// ================================
// 自动保存
// ================================


setInterval(()=>{


save();


},30000);







// ================================
// 初始化
// ================================


function init(){



let review=

getReviewList();



if(review.length>0){


current=

review[0].id;


}

else{


current=0;


}



showLesson();


update();


dailyMessage();


}




window.onbeforeunload=function(){


save();


};




// 启动

init();



</script>


</body>


</html>
