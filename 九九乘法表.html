<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>九九乘法学习</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#ffffff;

font-family:"Microsoft YaHei",sans-serif;

color:#333;

}



.app{

width:92%;

max-width:450px;

margin:20px auto;

padding:20px;

background:#ffffff;

border:1px solid #ddd;

border-radius:16px;

text-align:center;

}



h1{

font-size:28px;

margin-bottom:20px;

}




.title{

font-size:18px;

color:#666;

margin:10px;

}




/* 进度 */

.progress-box{

height:16px;

background:#ddd;

border-radius:10px;

overflow:hidden;

}



.progress-green{

height:100%;

width:0%;

background:#4caf50;

transition:.3s;

}



.progress-text{

font-size:15px;

color:#666;

margin:8px;

}






.lesson{

margin:25px 0;

padding:20px;

border-radius:15px;

background:#fafafa;

}




.cn{

font-size:38px;

font-weight:bold;

}



.math{

font-size:30px;

margin-top:15px;

}





input{

width:130px;

height:45px;

font-size:24px;

text-align:center;

border:1px solid #aaa;

border-radius:8px;

}





button{

background:#666;

color:white;

border:0;

border-radius:8px;

padding:10px 16px;

margin:6px;

font-size:16px;

}



.feedback{

height:35px;

margin-top:10px;

color:#4caf50;

font-size:22px;

}



</style>

</head>



<body>


<div class="app">


<h1>
九九乘法学习
</h1>


<div id="questionTitle" class="title">

第1题

</div>



<div class="title">

学习进度

</div>


<div class="progress-box">

<div id="progress" class="progress-green">

</div>

</div>


<div id="progressText" class="progress-text">

0 / 81

</div>





<div class="lesson">


<div id="cn" class="cn">

一一得一

</div>


<div id="math" class="math">

1 × 1 = 1

</div>


</div>




<input id="answer" placeholder="输入答案">



<div>

<button id="learn">
学习
</button>


<button id="submit">
提交
</button>


<button id="restart">
重新开始
</button>


</div>




<div id="feedback" class="feedback">

</div>


</div>


<script>// ================================
// 九九乘法数据
// ================================


let questions=[];


// 中文数字

const chinese=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];




// 生成81题
// 顺序：
// 1×1
// 2×1
// ...
// 9×1
// 1×2
// ...

for(let b=1;b<=9;b++){

    for(let a=1;a<=9;a++){

        questions.push({

            a:a,

            b:b,

            answer:a*b,

            done:false

        });

    }

}





// ================================
// 当前状态
// ================================


let currentIndex=0;


// 0 查看
// 1 口诀补全
// 2 数字测试

let stage=0;






// ================================
// 中文口诀生成
// ================================


function getChinese(num){


return chinese[num];


}



function getKouJue(q){


let result=q.answer;


if(result<=10){

return (
getChinese(q.a)+
getChinese(q.b)+
"得"+
getChinese(result)
);

}


// 十以上结果

return (
getChinese(q.a)+
getChinese(q.b)+
getChinese(result)
);



}





// 当前题

function currentQuestion(){

return questions[currentIndex];

}







// ================================
// 显示题目
// ================================


function render(){



let q=currentQuestion();



document
.getElementById("questionTitle")
.innerText=

"第"+
(currentIndex+1)+
"题";



document
.getElementById("cn")
.innerText=

getKouJue(q);



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



updateProgress();



}







// ================================
// 点击学习
// ================================


document
.getElementById("learn")
.onclick=function(){



let q=currentQuestion();


stage=1;



document
.getElementById("cn")
.innerText=

getKouJue(q)
.substring(
0,
getKouJue(q).length-1
)
+
"__";



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.answer;



document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=

"补最后一字";



document
.getElementById("feedback")
.innerText=

"补全口诀";



};
// ================================
// 提交按钮
// ================================


document
.getElementById("submit")
.onclick=function(){


let q=currentQuestion();


let value=

document
.getElementById("answer")
.value
.trim();




// ================================
// 阶段1：口诀补全
// ================================


if(stage===1){



let last=

getChinese(q.answer);



if(value===last){



stage=2;



document
.getElementById("cn")
.innerText=

getKouJue(q);



document
.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = ?";



document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=

"输入数字";



document
.getElementById("feedback")
.innerText=

"✓ 口诀正确";


}

else{


document
.getElementById("feedback")
.innerText=

"再想一下";


}



}







// ================================
// 阶段2：数字测试
// ================================


else if(stage===2){



if(
Number(value)===q.answer
){



q.done=true;



document
.getElementById("feedback")
.innerText=

"✓ 正确";



updateProgress();



setTimeout(()=>{


nextQuestion();



},700);



}

else{


document
.getElementById("feedback")
.innerText=

"再试一次";


}



}



};








// ================================
// 更新进度
// ================================


function updateProgress(){



let done=

questions.filter(q=>q.done)
.length;



let percent=

(done/81)*100;



document
.getElementById("progress")
.style.width=

percent+"%";



document
.getElementById("progressText")
.innerText=

done+
" / 81";


}







// ================================
// 下一题
// ================================


function nextQuestion(){



currentIndex++;


stage=0;



if(currentIndex>=questions.length){


currentIndex=0;


document
.getElementById("feedback")
.innerText=

"✓ 全部完成";


return;

}




document
.getElementById("answer")
.value="";



document
.getElementById("answer")
.placeholder=

"输入答案";



document
.getElementById("feedback")
.innerText="";



render();



}





// ================================
// 重新开始
// ================================


document
.getElementById("restart")
.onclick=function(){



currentIndex=0;


stage=0;



questions.forEach(q=>{

q.done=false;

});



document
.getElementById("answer")
.value="";



document
.getElementById("feedback")
.innerText="";



render();


};






// 初始化

render();
  </script>

</body>

</html>
