<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>九九乘法学习</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
font-family:"Microsoft YaHei",sans-serif;
background:linear-gradient(#72d8ff,#e8fbff);
}


.app{
width:94%;
max-width:520px;
margin:20px auto;
background:rgba(255,255,255,.92);
border-radius:30px;
padding:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,150,255,.25);
}


h1{
color:#1565c0;
font-size:30px;
}


.hero{
background:#fff3cd;
padding:12px;
border-radius:20px;
color:#ff6f00;
font-size:18px;
}


.group{
margin:15px;
font-size:20px;
font-weight:bold;
color:#673ab7;
}


.lesson{
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}


.chinese{
font-size:42px;
font-weight:bold;
color:#ff5252;
}


.math{
font-size:32px;
margin-top:15px;
color:#1565c0;
}


.progress-title{
margin-top:15px;
}


.progress{
height:25px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}


.energy{
height:100%;
width:0%;
background:linear-gradient(90deg,#4caf50,#8bc34a);
transition:.5s;
}


.info{
font-size:20px;
margin:15px;
}


button{
padding:9px 18px;
margin:5px;
border:0;
border-radius:15px;
font-size:16px;
background:#2196f3;
color:white;
}


#submitBtn{
background:#4caf50;
}


#restartBtn{
background:#ff9800;
}


input{
width:140px;
font-size:26px;
padding:8px;
border-radius:10px;
border:2px solid #90caf9;
text-align:center;
}


.feedback{
font-size:24px;
min-height:40px;
margin-top:15px;
color:#ff9800;
font-weight:bold;
}


.hide{
display:none;
}


.star{
color:#ffc107;
}


</style>

</head>


<body>

<div class="app">


<h1>
🧮 九九乘法学习
</h1>


<div class="hero">
🚀 数学小英雄训练基地
</div>


<div class="group" id="group">
第一关：1的乘法
</div>


<div class="lesson">

<div class="chinese" id="chinese">
一一得一
</div>

<div class="math" id="math">
1 × 1 = 1
</div>

</div>


<div class="progress-title">
⚡ 能量进度
</div>


<div class="progress">

<div class="energy" id="energy"></div>

</div>


<div class="info">

<span id="progressText">
0 / 9
</span>

&nbsp;&nbsp;

<span class="star">
⭐<span id="stars">0</span>
</span>

</div>


<div id="actionArea">

<button id="learnBtn">
📖学习
</button>

</div>


<div id="inputArea" class="hide">

<input id="inputBox">

<button id="submitBtn">
提交
</button>

</div>


<button id="restartBtn">
🔄重来
</button>


<div class="feedback" id="feedback"></div>


</div>


<script>
  // ================================
// 九九乘法学习 V8.2
// 数据结构
// ================================


const groups = [];


// 创建1-9乘法分组

for(let n=1;n<=9;n++){

let list=[];


for(let i=1;i<=9;i++){

let result=n*i;


list.push({

a:n,

b:i,

answer:result,


text:
numberToChinese(n)+
numberToChinese(i)+
getResultText(result),


stage:0,

mastery:0,

correct:0,

wrong:0

});


}


groups.push({

name:n+"的乘法",

number:n,

lessons:list,

complete:false

});


}




// ================================
// 中文转换
// ================================


function numberToChinese(num){

const map=[

"零",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九",
"十"

];

return map[num];

}




function getResultText(num){


if(num<=10){

return "得"+numberToChinese(num);

}


return numberToChinese(num);

}





// ================================
// 当前进度
// ================================


let currentGroup=0;

let currentLesson=0;


let stars=0;



// 防止重复提交

let locked=false;





// ================================
// 获取当前题
// ================================


function getCurrent(){


return groups[currentGroup]
.lessons[currentLesson];


}







// ================================
// 显示当前内容
// ================================


function render(){


let item=getCurrent();



document
.getElementById("group")
.innerText=

"第"+
(currentGroup+1)+
"关："+

groups[currentGroup].name;



document
.getElementById("chinese")
.innerText=

item.text;



document
.getElementById("math")
.innerText=

item.a+
" × "+
item.b+
" = "+
item.answer;



updateProgress();



}







// ================================
// 语音奖励
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


let u=
new SpeechSynthesisUtterance(text);


u.lang="zh-CN";


u.rate=.8;


speechSynthesis.cancel();


speechSynthesis.speak(u);


}







// ================================
// 音效
// ================================


function beep(type){


let ctx=
new AudioContext();


let osc=
ctx.createOscillator();


let gain=
ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type==="good"){


osc.frequency.value=800;


}else{


osc.frequency.value=1200;


}



gain.gain.value=.15;



osc.start();


osc.stop(
ctx.currentTime+0.15
);


}


// ================================
// 学习按钮
// ================================


document
.getElementById("learnBtn")
.onclick=function(){


let item=getCurrent();


if(item.stage!==0){

return;

}



item.stage=1;



document
.getElementById("feedback")
.innerText=

"记住口诀哦！";



speak(

item.a+
"乘"+
item.b+
"等于"+
item.answer+
"，"+
item.text

);



// 进入口诀补全

setTimeout(()=>{


openInput("memory");


},2000);



};







// ================================
// 打开输入
// ================================


function openInput(type){



let area=

document
.getElementById("inputArea");


area.classList
.remove("hide");



let input=

document
.getElementById("inputBox");



input.value="";



if(type==="memory"){



input.placeholder=

"补全口诀";


}



if(type==="number"){



input.placeholder=

"输入数字";


}



}







// ================================
// 提交按钮
// ================================


document
.getElementById("submitBtn")
.onclick=function(){



if(locked){

return;

}



let item=getCurrent();


let value=

document
.getElementById("inputBox")
.value
.trim();





// ================================
// 口诀补全阶段
// ================================


if(item.stage===1){



let last=

item.text.substring(

item.text.length-1

);



// 例如：一一____
// 输入：得一

if(
value==="得"+numberToChinese(item.answer)
||
value===last
){



item.stage=2;



item.mastery+=40;



beep("good");



document
.getElementById("feedback")
.innerText=

"🎉 口诀记住啦！";



speak(
"太棒了"
);



// 自动进入数字测试

setTimeout(()=>{


document
.getElementById("math")
.innerText=

item.a+
" × "+
item.b+
" = ?";



openInput("number");


},500);



}

else{


item.wrong++;


document
.getElementById("feedback")
.innerText=

"再想一下";



}



}







// ================================
// 数字测试阶段
// ================================


else if(item.stage===2){



if(
Number(value)===item.answer
){



locked=true;



item.stage=3;


item.mastery=100;


item.correct++;



stars++;



beep("good");


document
.getElementById("feedback")
.innerText=

"🎊 答对啦！ ⭐+1";



speak(
"答对啦"
);



setTimeout(()=>{


completeLesson();


},800);



}

else{


item.wrong++;


document
.getElementById("feedback")
.innerText=

"答案不对，再试试";



}



}



updateProgress();



};
// ================================
// 完成当前题目
// ================================


function completeLesson(){


let item=getCurrent();


// 隐藏输入

document
.getElementById("inputArea")
.classList
.add("hide");



// 恢复算式显示

document
.getElementById("math")
.innerText=

item.a+
" × "+
item.b+
" = "+
item.answer;




// 判断当前组是否完成

checkGroupComplete();



}




// ================================
// 下一题
// ================================


function nextLesson(){



currentLesson++;



// 当前组结束

if(
currentLesson>=
groups[currentGroup].lessons.length
){



groups[currentGroup].complete=true;



groupFinish();



return;

}




resetState();



}







// ================================
// 组完成
// ================================


function groupFinish(){



stars+=5;



beep("good");



document
.getElementById("feedback")
.innerText=

"🎉 第"+
(currentGroup+1)+
"关完成！ ⭐+5";



speak(
"这一关完成了，太棒了"
);




setTimeout(()=>{


currentGroup++;


currentLesson=0;



// 全部完成

if(
currentGroup>=groups.length
){



currentGroup=0;


document
.getElementById("feedback")
.innerText=

"🏆 全部九九乘法完成！";


speak(
"恭喜你完成全部九九乘法"
);


}




resetState();



},1500);



}







// ================================
// 检查组完成
// ================================


function checkGroupComplete(){


let list=

groups[currentGroup]
.lessons;



let done=

list.every(x=>{


return x.mastery>=90;


});



if(done){


groupFinish();


}
else{


setTimeout(()=>{


nextLesson();


},800);



}



}







// ================================
// 重置状态
// ================================


function resetState(){



let item=getCurrent();



item.stage=0;



locked=false;



document
.getElementById("inputArea")
.classList
.add("hide");



document
.getElementById("learnBtn")
.classList
.remove("hide");



document
.getElementById("math")
.innerText=

item.a+
" × "+
item.b+
" = "+
item.answer;



document
.getElementById("feedback")
.innerText="";



render();



}







// ================================
// 进度更新
// ================================


function updateProgress(){



let group=

groups[currentGroup];



let count=

group.lessons.filter(x=>{


return x.mastery>=90;


}).length;



let percent=

count/group.lessons.length*100;



document
.getElementById("energy")
.style.width=

percent+"%";



document
.getElementById("progressText")
.innerText=

count+
" / 9";



document
.getElementById("stars")
.innerText=

stars;



}
// ================================
// 重新开始
// ================================


document
.getElementById("restartBtn")
.onclick=function(){



let ok=

confirm(
"确定重新开始九九乘法学习吗？"
);



if(!ok){

return;

}



groups.forEach(group=>{


group.complete=false;



group.lessons.forEach(item=>{


item.stage=0;

item.mastery=0;

item.correct=0;

item.wrong=0;


});


});



currentGroup=0;

currentLesson=0;

stars=0;

locked=false;



save();



resetState();



document
.getElementById("feedback")
.innerText=

"🚀 重新开始训练";



};








// ================================
// 本地保存
// ================================


function save(){


localStorage.setItem(

"jiujiu_v82_groups",

JSON.stringify(groups)

);



localStorage.setItem(

"jiujiu_v82_stars",

stars

);



localStorage.setItem(

"jiujiu_v82_group",

currentGroup

);



localStorage.setItem(

"jiujiu_v82_lesson",

currentLesson

);



}






// ================================
// 读取数据
// ================================


function load(){



try{


let data=

localStorage.getItem(
"jiujiu_v82_groups"
);



if(data){


let old=

JSON.parse(data);



old.forEach((g,index)=>{


if(groups[index]){


g.lessons.forEach((item,i)=>{


if(groups[index].lessons[i]){


groups[index].lessons[i]=item;


}


});


groups[index].complete=g.complete;


}



});


}



let s=

localStorage.getItem(
"jiujiu_v82_stars"
);



if(s){

stars=Number(s);

}




let cg=

localStorage.getItem(
"jiujiu_v82_group"
);



let cl=

localStorage.getItem(
"jiujiu_v82_lesson"
);



if(cg){

currentGroup=Number(cg);

}


if(cl){

currentLesson=Number(cl);

}



}catch(e){


console.log(
"读取失败"
);


}



}







// ================================
// 自动保存
// ================================


setInterval(()=>{


save();


},30000);






window.onbeforeunload=function(){


save();


};






// ================================
// 初始化
// ================================


load();


render();

updateProgress();
</script>

</body>

</html>
