<script>

const names=[
"一","二","三","四","五",
"六","七","八","九"
];


const kouMap={

"1x1":"一一得一",
"1x2":"一二得二",
"1x3":"一三得三",
"1x4":"一四得四",
"1x5":"一五得五",
"1x6":"一六得六",
"1x7":"一七得七",
"1x8":"一八得八",
"1x9":"一九得九",

"2x2":"二二得四",
"2x3":"二三得六",
"2x4":"二四得八",
"2x5":"二五一十",
"2x6":"二六十二",
"2x7":"二七十四",
"2x8":"二八十六",
"2x9":"二九十八",

"3x3":"三三得九",
"3x4":"三四十二",
"3x5":"三五十五",
"3x6":"三六十八",
"3x7":"三七二十一",
"3x8":"三八二十四",
"3x9":"三九二十七",

"4x4":"四四十六",
"4x5":"四五二十",
"4x6":"四六二十四",
"4x7":"四七二十八",
"4x8":"四八三十二",
"4x9":"四九三十六",

"5x5":"五五二十五",
"5x6":"五六三十",
"5x7":"五七三十五",
"5x8":"五八四十",
"5x9":"五九四十五",

"6x6":"六六三十六",
"6x7":"六七四十二",
"6x8":"六八四十八",
"6x9":"六九五十四",

"7x7":"七七四十九",
"7x8":"七八五十六",
"7x9":"七九六十三",

"8x8":"八八六十四",
"8x9":"八九七十二",

"9x9":"九九八十一"

};



let questions=[];


for(let a=1;a<=9;a++){

for(let b=a;b<=9;b++){

questions.push({

a:a,
b:b,
answer:a*b,
key:a+"x"+b,
wrong:0

});

}

}


// 随机排序
questions.sort(()=>Math.random()-0.5);



let index=0;

let stars=
Number(localStorage.getItem("stars")||0);

let combo=0;


let current=null;



const answer=document.getElementById("answer");

const msg=document.getElementById("msg");



function save(){

localStorage.setItem(
"stars",
stars
);

}



function level(){

let r=document.getElementById("rank");

if(stars<20)
r.innerText="🌱 小芽阶段";

else if(stars<50)
r.innerText="🌳 小树阶段";

else if(stars<100)
r.innerText="🌲 森林阶段";

else
r.innerText="🏆 数学小达人";

}



function loadQuestion(){


if(index>=questions.length){

questions.sort(
(a,b)=>b.wrong-a.wrong
);

index=0;

}


current=questions[index];


document.getElementById("level")
.innerText=
"第"+current.a+"组强化练习";


document.getElementById("kou")
.innerText=
kouMap[current.key];


document.getElementById("question")
.innerText=
current.a+
" × "+
current.b+
" = ?";


answer.value="";


document.getElementById("bar")
.style.width=
(index/questions.length*100)+"%";


document.getElementById("progressText")
.innerText=
index+
"/"+questions.length;



msg.innerText="";


}



function sound(type){

try{

let Ctx=
window.AudioContext||
window.webkitAudioContext;


let ctx=new Ctx();

let o=
ctx.createOscillator();

let g=
ctx.createGain();


o.connect(g);
g.connect(ctx.destination);


if(type=="ok"){

o.frequency.value=880;

}else{

o.frequency.value=220;

}


g.gain.value=.15;


o.start();


o.stop(
ctx.currentTime+.2
);


}catch(e){}

}



function speak(text){

if(
window.speechSynthesis
){

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(text);


u.lang="zh-CN";

u.rate=.8;


speechSynthesis.speak(u);

}

}




// 数字按钮

document
.querySelectorAll(".key")
.forEach(btn=>{


btn.onclick=function(){


let t=this.innerText;


if(t=="⌫"){

answer.value=
answer.value.slice(0,-1);


return;

}



if(t=="清"){

answer.value="";

return;

}



if(answer.value.length<2){

answer.value+=t;

}


}


});




// 提交


document
.getElementById("submit")
.onclick=function(){


let user=
Number(answer.value);


if(!answer.value)
return;



if(user===current.answer){


stars++;

combo++;

save();


document.getElementById("stars")
.innerText=stars;


document.getElementById("combo")
.innerText=combo;


msg.innerText=
"🎉 太棒了 +1星";


msg.className="msg good";


sound("ok");


current.wrong=0;


setTimeout(()=>{

index++;

loadQuestion();


},600);



}else{


combo=0;


document.getElementById("combo")
.innerText=0;


current.wrong++;


msg.innerText=
"😊 再想想："+kouMap[current.key];


msg.className="msg bad";


sound("no");


}

level();


};




// 学习按钮

document
.getElementById("learn")
.onclick=function(){


let text=
kouMap[current.key];


msg.innerText=
"记住："+text;


speak(text);


};



// 口诀语音

document
.getElementById("voice")
.onclick=function(){

speak(
kouMap[current.key]
);

};




// 重置

document
.getElementById("reset")
.onclick=function(){


localStorage.clear();


stars=0;

combo=0;


document.getElementById("stars")
.innerText=0;


document.getElementById("combo")
.innerText=0;


loadQuestion();


};



// 初始化


document.getElementById("stars")
.innerText=stars;


loadQuestion();


</script>
</body>
</html>
