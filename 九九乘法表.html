<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>小悟课堂 V6</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}


.app{

width:92%;

max-width:500px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

}



h1{

font-size:32px;

}



.message{

background:#f5f5f5;

padding:15px;

border-radius:15px;

font-size:20px;

}



.lesson{

font-size:38px;

font-weight:bold;

margin:25px;

}



.progress{

height:25px;

background:#ccc;

border-radius:20px;

overflow:hidden;

}



.green{

height:100%;

width:0%;

background:#4caf50;

transition:.5s;

}



.info{

font-size:20px;

margin:15px;

}



button{

width:90%;

padding:15px;

margin:8px;

border:none;

border-radius:15px;

background:#4caf50;

color:white;

font-size:20px;

}



button:active{

transform:scale(.97);

}



input{

width:160px;

font-size:28px;

padding:10px;

text-align:center;

border-radius:10px;

border:1px solid #ccc;

}



.result{

font-size:22px;

margin:20px;

min-height:35px;

}



.hide{

display:none;

}


</style>


</head>



<body>


<div class="app">


<h1>
🧠 小悟课堂
</h1>



<div class="message" id="message">

准备学习九九乘法

</div>



<div class="lesson" id="lesson">

一一得一

</div>



<div>

口诀掌握进度

</div>


<div class="progress">

<div class="green" id="bar">

</div>

</div>



<div class="info">

<span id="progressText">
0 / 45
</span>

&nbsp;&nbsp;

⭐

<span id="stars">
0
</span>

</div>





<div id="actionArea">


<button id="mainBtn">

📖 学口诀

</button>


</div>





<div id="inputArea" class="hide">


<input id="input">


<button id="submitBtn">

提交

</button>


</div>





<button id="restartBtn">

🔄重新开始

</button>




<div class="result" id="result">

</div>



</div>


<script>
  // ================================
// 九九乘法数据
// ================================


const table=[

["一一得一",1,1,1],
["一二得二",1,2,2],
["一三得三",1,3,3],
["一四得四",1,4,4],
["一五得五",1,5,5],
["一六得六",1,6,6],
["一七得七",1,7,7],
["一八得八",1,8,8],
["一九得九",1,9,9],

["二二得四",2,2,4],
["二三得六",2,3,6],
["二四得八",2,4,8],
["二五一十",2,5,10],
["二六十二",2,6,12],
["二七十四",2,7,14],
["二八十六",2,8,16],
["二九十八",2,9,18],

["三三得九",3,3,9],
["三四十二",3,4,12],
["三五十五",3,5,15],
["三六十八",3,6,18],
["三七二十一",3,7,21],
["三八二十四",3,8,24],
["三九二十七",3,9,27],

["四四十六",4,4,16],
["四五二十",4,5,20],
["四六二十四",4,6,24],
["四七二十八",4,7,28],
["四八三十二",4,8,32],
["四九三十六",4,9,36],

["五五二十五",5,5,25],
["五六三十",5,6,30],
["五七三十五",5,7,35],
["五八四十",5,8,40],
["五九四十五",5,9,45],

["六六三十六",6,6,36],
["六七四十二",6,7,42],
["六八四十八",6,8,48],
["六九五十四",6,9,54],

["七七四十九",7,7,49],
["七八五十六",7,8,56],
["七九六十三",7,9,63],

["八八六十四",8,8,64],
["八九七十二",8,9,72],

["九九八十一",9,9,81]

];





// ================================
// 学习任务对象
// ================================


let lessons=

table.map((x,i)=>{


return {

id:i,


text:x[0],


a:x[1],


b:x[2],


answer:x[3],



// 掌握度

mastery:0,



// 0 学习口诀
// 1 补全口诀
// 2 数字测试
// 3 完成

stage:0,



correct:0,


wrong:0,


lastTime:0


};


});







// ================================
// 全局状态
// ================================


let current=0;


let stars=0;



// 当前任务

function getTask(){

return lessons[current];

}





// ================================
// 阶段控制
// ================================


function setStage(stage){


getTask().stage=stage;


}







// ================================
// 掌握数量
// ================================


function getMasterCount(){


return lessons.filter(x=>{


return x.mastery>=90;


}).length;


}
// ================================
// 语音模块
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


speechSynthesis.cancel();


let u=

new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=0.75;



speechSynthesis.speak(u);



}







// ================================
// 显示口诀
// ================================


function showLesson(){


let x=getTask();



document
.getElementById("lesson")
.innerText=x.text;


}







// ================================
// 学口诀
// ================================


document
.getElementById("mainBtn")
.onclick=function(){


let x=getTask();



// 只允许学习阶段点击

if(x.stage!==0){

return;

}



setStage(1);



document
.getElementById("message")
.innerText=

"记住口诀";


showLesson();



speak(

x.a+
"乘"+
x.b+
"等于"+
x.answer+
"。"+
x.text

);



// 学习完成后自动进入补全


setTimeout(()=>{


openInput("memory");


},2500);



};







// ================================
// 输入模式
// ================================


function openInput(mode){


let area=

document
.getElementById("inputArea");



area.classList
.remove("hide");



let input=

document
.getElementById("input");



input.value="";



if(mode==="memory"){



document
.getElementById("message")
.innerText=

"补全口诀";


input.placeholder=

"输入缺少部分";



}



if(mode==="test"){



document
.getElementById("message")
.innerText=

"计算答案";


input.placeholder=

"输入数字";


}



}







// ================================
// 提交按钮
// ================================


document
.getElementById("submitBtn")
.onclick=function(){


let x=getTask();


let value=

document
.getElementById("input")
.value
.trim();





// ================================
// 补全阶段
// ================================


if(x.stage===1){



let answerPart=

x.text.substring(

x.text.length-1

);





if(

value===answerPart ||

value===x.text.substring(2)

){



x.mastery+=30;


setStage(2);



document
.getElementById("result")
.innerText=

"🎉 口诀记住了";



speak(
"正确"
);



// 立即进入数字测试

openInput("test");



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"再想一下";


}



}







// ================================
// 数字测试阶段
// ================================


else if(x.stage===2){



if(Number(value)===x.answer){



x.correct++;


x.mastery+=70;



if(x.mastery>100){

x.mastery=100;

}



finishLesson();



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"答案错误";


}



}



save();

update();


};
// ================================
// 完成当前口诀
// ================================


function finishLesson(){


let x=getTask();



// 标记完成

x.mastery=100;


x.lastTime=Date.now();



stars+=2;



document
.getElementById("result")
.innerText=

"🎉 掌握成功 ⭐+2";



speak(
"太棒了"
);



// 隐藏输入区域

document
.getElementById("inputArea")
.classList
.add("hide");



// 更新

update();

save();




// 唯一下一题入口

setTimeout(()=>{


nextTask();



},300);



}







// ================================
// 下一任务选择
// ================================


function nextTask(){



// 优先错误口诀

let wrong=

lessons.filter(x=>{


return x.wrong>0 && x.mastery<90;


});



if(wrong.length>0){


current=wrong[0].id;


resetTask();


return;


}






// 其次未掌握口诀

let unfinished=

lessons.filter(x=>{


return x.mastery<90;


});



if(unfinished.length>0){


current=unfinished[0].id;


resetTask();


return;


}





// 全部完成

current=0;


resetTask();


}







// ================================
// 重置任务状态
// ================================


function resetTask(){


let x=getTask();



x.stage=0;



document
.getElementById("message")
.innerText=

"准备学习";


document
.getElementById("result")
.innerText="";



document
.getElementById("mainBtn")
.classList
.remove("hide");



document
.getElementById("mainBtn")
.innerText=

"📖 学口诀";



showLesson();



}







// ================================
// 更新进度
// ================================


function update(){



let total=0;



lessons.forEach(x=>{


total+=x.mastery;


});



let percent=

Math.round(

total/lessons.length

);





// 绿色进度条


document
.getElementById("bar")
.style.width=

percent+"%";




document
.getElementById("progressText")
.innerText=

getMasterCount()
+
" / 45";



document
.getElementById("stars")
.innerText=

stars;



}







// ================================
// 保存
// ================================


function save(){



localStorage.setItem(

"xw_v6_lessons",

JSON.stringify(lessons)

);



localStorage.setItem(

"xw_v6_stars",

stars

);


}
// ================================
// 读取数据
// ================================


function load(){


try{


let data=

localStorage.getItem(
"xw_v6_lessons"
);



if(data){


lessons=

JSON.parse(data);


}



let starData=

localStorage.getItem(
"xw_v6_stars"
);



if(starData){


stars=

Number(starData);


}



}catch(e){


console.log(
"数据读取失败"
);


}


}







// ================================
// 重新开始
// ================================


document
.getElementById("restartBtn")
.onclick=function(){



let ok=

confirm(
"确定重新开始吗？"
);



if(!ok){

return;

}




lessons.forEach(x=>{


x.mastery=0;

x.stage=0;

x.correct=0;

x.wrong=0;

x.lastTime=0;


});



stars=0;


current=0;



save();


resetTask();


update();



document
.getElementById("message")
.innerText=

"重新开始九九乘法";



};







// ================================
// 初始化
// ================================


function init(){


load();



current=0;



showLesson();



update();



document
.getElementById("message")
.innerText=

"准备学习九九乘法";



}






// ================================
// 自动保存
// ================================


setInterval(()=>{


save();


},30000);






window.onbeforeunload=function(){


save();


};






// 启动

init();



</script>


</body>


</html>
