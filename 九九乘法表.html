<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>九九乘法学习闯关</title>


<style>

body{
    margin:0;
    padding:20px;
    background:#eaf4ff;
    font-family:"Microsoft YaHei",Arial;
    text-align:center;
}


.box{

    max-width:430px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 5px 20px #ccc;

}


h1{

    font-size:30px;

}


.level{

    font-size:22px;
    color:#3478f6;
    margin:10px;

}



.progress{

    font-size:18px;
    margin:15px;

}



.question{

    font-size:45px;
    font-weight:bold;
    margin:30px;

}



.answer{

    font-size:35px;
    color:#3478f6;

}



.buttons{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

}



button{

    height:60px;
    border:0;
    border-radius:15px;
    font-size:28px;
    background:#3478f6;
    color:white;

}



button:active{

    transform:scale(0.95);

}



.control{

    margin-top:20px;

}



.clear{

    background:#ff9800;

}



.submit{

    background:#28a745;

}



.message{

    height:45px;
    font-size:25px;
    margin-top:20px;

}



.star{

    font-size:35px;
    margin:10px;

}



.reset{

    background:#777;
    font-size:18px;
    height:45px;
    margin-top:10px;

}



.tip{

    color:#666;
    font-size:16px;

}


</style>


</head>


<body>


<div class="box">


<h1>
🎮 九九乘法学习
</h1>



<div class="level" id="level">

第1组：1的口诀

</div>



<div class="progress" id="progress">

学习进度

</div>



<div class="question" id="question">

1 × 1 = ?

</div>



<div>

答案：

<span class="answer" id="answer">

</span>

</div>



<br>


<div class="buttons" id="buttons">

</div>



<div class="control">


<button class="clear" onclick="clearAnswer()">

清除

</button>



<button class="submit" onclick="submitAnswer()">

提交

</button>


</div>



<div class="message" id="message">

</div>



<div class="star" id="stars">

⭐⭐⭐

</div>



<div class="tip">

答对获得星星 ⭐

</div>



<button class="reset" onclick="resetGame()">

重新开始

</button>


</div>


<script>


// ===== 游戏数据 =====


let group =
Number(localStorage.getItem("group")) || 1;


let index =
Number(localStorage.getItem("index")) || 1;


let userAnswer="";


let stars =
Number(localStorage.getItem("stars")) || 0;


let correctAnswer=0;



// 创建数字按钮


function createButtons(){


let html="";


for(let i=1;i<=9;i++){


html += `

<button onclick="inputNumber(${i})">

${i}

</button>

`;

}


html += `

<button onclick="inputNumber(0)">

0

</button>

`;


document.getElementById("buttons").innerHTML=html;


}




// 出题

function newQuestion(){


document.getElementById("level").innerHTML=

"第 "+group+" 组："+group+" 的口诀";


document.getElementById("question").innerHTML=

group+" × "+index+" = ?";


correctAnswer=

group*index;


userAnswer="";


document.getElementById("answer").innerHTML="";


document.getElementById("message").innerHTML="";


showProgress();


createButtons();


document.getElementById("stars").innerHTML=

"⭐".repeat(Math.min(stars,10));


}



// 输入答案

function inputNumber(num){


if(userAnswer.length<2){


userAnswer += num;


document.getElementById("answer").innerHTML=

userAnswer;


}


}



// 清除答案

function clearAnswer(){


userAnswer="";


document.getElementById("answer").innerHTML="";


}



// 提交答案

function submitAnswer(){



if(userAnswer===""){

return;

}



if(Number(userAnswer)===correctAnswer){



playGoodSound();



stars++;



document.getElementById("message").innerHTML=

"🎉 答对啦！";


document.getElementById("stars").innerHTML=

"⭐".repeat(Math.min(stars,10));



setTimeout(nextQuestion,700);



}else{



playErrorSound();



document.getElementById("message").innerHTML=

"❌ 再想想哦";


}


}




// 下一题

function nextQuestion(){



index++;



// 完成当前口诀

if(index>9){


group++;


index=1;



playWinSound();



if(group>9){


document.getElementById("message").innerHTML=

"🏆 恭喜完成全部九九乘法！";


localStorage.clear();


return;


}



}



saveProgress();


newQuestion();


}




// 保存学习进度


function saveProgress(){


localStorage.setItem(

"group",

group

);


localStorage.setItem(

"index",

index

);


localStorage.setItem(

"stars",

stars

);


}




// 显示进度

function showProgress(){


let done=index-1;


let text="";


for(let i=1;i<=9;i++){


if(i<=done){

text+="✅";

}else{

text+="⬜";

}


}


document.getElementById("progress").innerHTML=

"进度："+text;


}



// 普通答对声音

function playGoodSound(){


let ctx=
new(window.AudioContext||window.webkitAudioContext)();



let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.connect(gain);


gain.connect(ctx.destination);



osc.frequency.value=880;


gain.gain.value=0.15;



osc.start();


osc.stop(

ctx.currentTime+0.15

);


}



// 错误声音

function playErrorSound(){


let ctx=
new(window.AudioContext||window.webkitAudioContext)();



let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.connect(gain);


gain.connect(ctx.destination);



osc.frequency.value=220;


gain.gain.value=0.15;



osc.start();


osc.stop(

ctx.currentTime+0.2

);


}

// 完成一组奖励声音

function playWinSound(){


let ctx=
new(window.AudioContext||window.webkitAudioContext)();



let notes=[600,800,1000];


notes.forEach(function(note,i){


let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.connect(gain);


gain.connect(ctx.destination);



osc.frequency.value=note;


gain.gain.value=0.15;



osc.start(

ctx.currentTime+i*0.15

);



osc.stop(

ctx.currentTime+i*0.15+0.15

);


});


}



// 重新开始

function resetGame(){


if(confirm("确定重新开始学习吗？")){


localStorage.clear();


group=1;


index=1;


stars=0;


newQuestion();


}


}



// 启动游戏

newQuestion();



</script>


</body>


</html>
