<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>九九乘法智能老师 V5</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

body{
height:100vh;
overflow:hidden;
font-family:-apple-system,"Microsoft YaHei",sans-serif;
background:linear-gradient(#dff5ff,#ffffff);
}

.app{
height:100vh;
width:94%;
max-width:390px;
margin:auto;
display:flex;
flex-direction:column;
justify-content:center;
gap:8px;
}


.card{
background:#fff;
border-radius:18px;
padding:10px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
text-align:center;
}


.title{
font-size:20px;
font-weight:800;
}

.sub{
font-size:12px;
color:#777;
}


.status{
display:flex;
gap:8px;
margin-top:8px;
}


.box{
flex:1;
background:#f5f7fa;
border-radius:12px;
padding:6px;
}


.label{
font-size:12px;
color:#888;
}


.num{
font-size:22px;
font-weight:bold;
color:#ff9800;
}


.rank{
font-size:13px;
color:#555;
margin-top:5px;
}



.level{
font-size:16px;
font-weight:bold;
}


.progress{
height:8px;
background:#eee;
border-radius:10px;
overflow:hidden;
}


.bar{
height:100%;
width:0;
background:#4caf50;
transition:.3s;
}



.kou{
font-size:22px;
font-weight:bold;
color:#222;
background:#fafafa;
border-radius:12px;
padding:8px;
margin:5px;
}



.small{
border:0;
background:#e3f2fd;
color:#1976d2;
border-radius:20px;
padding:6px 15px;
}



.question{
font-size:32px;
font-weight:bold;
margin:6px;
}


.answer{
width:120px;
height:42px;
border:2px solid #ddd;
border-radius:12px;
font-size:24px;
text-align:center;
background:#fafafa;
}



.keyboard{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:8px;
}


.key{
height:42px;
border:0;
border-radius:12px;
font-size:20px;
font-weight:bold;
background:#edf5ff;
}



.key:active{
background:#c9ddff;
transform:scale(.95);
}



.row{
display:flex;
gap:7px;
margin-top:8px;
}


.btn{
flex:1;
height:40px;
border:0;
border-radius:12px;
font-weight:bold;
}


.learn{
background:#2196f3;
color:white;
}


.submit{
background:#4caf50;
color:white;
}


.reset{
background:#eee;
}



.msg{
height:22px;
font-weight:bold;
font-size:16px;
}


.good{
color:#4caf50;
}


.bad{
color:#ff7043;
}

</style>
</head>

<body>


<div class="app">


<div class="card">

<div class="title">
🌈 九九乘法智能老师
</div>

<div class="sub">
快乐学习 · 闯关成长
</div>


<div class="status">

<div class="box">
<div class="label">⭐ 星星</div>
<div id="stars" class="num">0</div>
</div>


<div class="box">
<div class="label">🔥 连胜</div>
<div id="combo" class="num">0</div>
</div>

</div>


<div id="rank" class="rank">
🌱 小芽阶段
</div>


</div>



<div class="card">

<div id="level" class="level">
第一关
</div>


<div class="progress">

<div id="bar" class="bar"></div>

</div>

<div id="progressText">
0/9
</div>


</div>




<div class="card">

<div style="font-size:12px">
📖口诀
</div>

<div id="kou" class="kou">
一一得一
</div>


<button id="voice" class="small">
🔊 听口诀
</button>

</div>




<div class="card">


<div id="question" class="question">
1 × 1 = ?
</div>


<input id="answer"
class="answer"
readonly
placeholder="答案">



<div class="keyboard">

<button class="key">1</button>
<button class="key">2</button>
<button class="key">3</button>

<button class="key">4</button>
<button class="key">5</button>
<button class="key">6</button>

<button class="key">7</button>
<button class="key">8</button>
<button class="key">9</button>

<button class="key">0</button>

<button id="del" class="key">
⌫
</button>

<button id="clear" class="key">
清
</button>


</div>



<div class="row">

<button id="learn" class="btn learn">
📖学习
</button>


<button id="submit" class="btn submit">
🚀提交
</button>


<button id="reset" class="btn reset">
重开
</button>

</div>


<div id="msg" class="msg"></div>


</div>


</div>
<script>

const kou={
"1x1":"一一得一","1x2":"一二得二","1x3":"一三得三",
"1x4":"一四得四","1x5":"一五得五","1x6":"一六得六",
"1x7":"一七得七","1x8":"一八得八","1x9":"一九得九",

"2x2":"二二得四","2x3":"二三得六","2x4":"二四得八",
"2x5":"二五一十","2x6":"二六十二","2x7":"二七十四",
"2x8":"二八十六","2x9":"二九十八",

"3x3":"三三得九","3x4":"三四十二",
"3x5":"三五十五","3x6":"三六十八",
"3x7":"三七二十一","3x8":"三八二十四",
"3x9":"三九二十七",

"4x4":"四四十六","4x5":"四五二十",
"4x6":"四六二十四","4x7":"四七二十八",
"4x8":"四八三十二","4x9":"四九三十六",

"5x5":"五五二十五","5x6":"五六三十",
"5x7":"五七三十五","5x8":"五八四十",
"5x9":"五九四十五",

"6x6":"六六三十六","6x7":"六七四十二",
"6x8":"六八四十八","6x9":"六九五十四",

"7x7":"七七四十九","7x8":"七八五十六",
"7x9":"七九六十三",

"8x8":"八八六十四","8x9":"八九七十二",

"9x9":"九九八十一"
};



let questions=[];


// 生成题库
for(let a=1;a<=9;a++){

 for(let b=a;b<=9;b++){

  questions.push({
   a:a,
   b:b,
   answer:a*b,
   key:a+"x"+b,
   error:0,
   done:false
  });

 }

}



let index=0;

let combo=0;

let stars=
Number(localStorage.getItem("stars")||0);



const answer=document.getElementById("answer");
const msg=document.getElementById("msg");



document.getElementById("stars").innerText=stars;



function save(){

localStorage.setItem(
"stars",
stars
);

}



function updateRank(){

let r=document.getElementById("rank");


if(stars<20){

r.innerText="🌱 小芽阶段";

}

else if(stars<50){

r.innerText="🌿 小苗阶段";

}

else if(stars<100){

r.innerText="🌳 小树阶段";

}

else{

r.innerText="🏆 数学达人";

}

}




function current(){

return questions[index];

}




function show(){


let q=current();


document.getElementById("level")
.innerText=
"第 "+q.a+" 关："+q.a+"的乘法";


document.getElementById("kou")
.innerText=
kou[q.key];


document.getElementById("question")
.innerText=
q.a+" × "+q.b+" = ?";


answer.value="";


let count=
questions.filter(
x=>x.a===q.a&&x.done
).length;



document.getElementById("bar")
.style.width=
(count/9*100)+"%";


document.getElementById("progressText")
.innerText=
count+"/9 完成";


msg.innerText="";


}



function play(type){

try{


let Audio=
window.AudioContext||
window.webkitAudioContext;


let ctx=new Audio();



let osc=ctx.createOscillator();

let gain=ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type==="ok"){

osc.frequency.value=880;

}

else{

osc.frequency.value=220;

}


gain.gain.value=.15;


osc.start();


osc.stop(
ctx.currentTime+0.2
);


}catch(e){}

}




// 通关音乐

function levelSound(){


try{


let Audio=
window.AudioContext||
window.webkitAudioContext;


let ctx=new Audio();


let notes=[
523,659,784,1046
];


notes.forEach((n,i)=>{


let o=ctx.createOscillator();

let g=ctx.createGain();


o.frequency.value=n;


o.connect(g);

g.connect(ctx.destination);


let t=
ctx.currentTime+i*0.15;


g.gain.setValueAtTime(
0.2,t
);


g.gain.exponentialRampToValueAtTime(
0.01,
t+0.4
);


o.start(t);

o.stop(t+0.45);



});


}catch(e){}


}




function speak(text){

if(window.speechSynthesis){

speechSynthesis.cancel();


let u=
new SpeechSynthesisUtterance(text);


u.lang="zh-CN";

u.rate=.8;


speechSynthesis.speak(u);


}

}





// 数字键

document
.querySelectorAll(".key")
.forEach(btn=>{


btn.onclick=function(){


let t=this.innerText;


if(t==="⌫"){

answer.value=
answer.value.slice(0,-1);

return;

}


if(t==="清"){

answer.value="";

return;

}


if(answer.value.length<2){

answer.value+=t;

}



}


});





// 提交


document
.getElementById("submit")
.onclick=function(){


let q=current();


if(answer.value==="")
return;



if(Number(answer.value)===q.answer){


q.done=true;

q.error=0;


stars++;

combo++;


document.getElementById("stars")
.innerText=stars;


document.getElementById("combo")
.innerText=combo;


save();

updateRank();


msg.innerText=
"🎉 答对啦！";


msg.className="msg good";


play("ok");



// 判断一组完成

let group=
questions.filter(
x=>x.a===q.a
);


let finish=
group.every(
x=>x.done
);



if(finish){


setTimeout(()=>{


levelSound();


msg.innerText=
"🏆 恭喜！"+q.a+"的乘法通关！";


index++;

show();


},600);


}

else{


setTimeout(()=>{

index++;

show();

},500);


}



}

else{


combo=0;

document.getElementById("combo")
.innerText=0;


q.error++;


msg.innerText=
"😊 再想想："+kou[q.key];


msg.className="msg bad";


play("bad");


}



};



// 学习按钮

document
.getElementById("learn")
.onclick=function(){


let q=current();


let text=
q.a+"×"+q.b+
" 等于 "+
q.answer+
"，口诀是 "+
kou[q.key];


msg.innerText=
"📖 "+text;


speak(
kou[q.key]
);


};




// 听口诀

document
.getElementById("voice")
.onclick=function(){


let q=current();

speak(
kou[q.key]
);


};





// 重置

document
.getElementById("reset")
.onclick=function(){


if(confirm("确定重新开始吗？")){


stars=0;

combo=0;


localStorage.clear();



questions.forEach(q=>{

q.done=false;

q.error=0;

});


document.getElementById("stars")
.innerText=0;


document.getElementById("combo")
.innerText=0;


index=0;


updateRank();

show();


}


};




// 错题强化排序

function strengthen(){


questions.sort(function(a,b){


return b.error-a.error;


});


}




// 每次加载前强化一次

let oldShow=show;


show=function(){


strengthen();


oldShow();


};




// 初始化


updateRank();

show();



</script>

</body>
</html>
