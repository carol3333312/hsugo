<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>九九乘法学习</title>

<style>

body{

margin:0;
font-family:"Microsoft YaHei";
background:linear-gradient(#79d8ff,#ffffff);
text-align:center;

}


.box{

width:90%;
max-width:420px;
margin:30px auto;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 5px 20px #aaa;

}


h1{

color:#1565c0;

}


.card{

background:#f4fbff;
padding:20px;
border-radius:20px;

}


.cn{

font-size:42px;
font-weight:bold;
color:#ff5252;

}


.math{

font-size:32px;
color:#1565c0;
margin-top:15px;

}


button{

padding:10px 20px;
border:0;
border-radius:12px;
background:#42a5f5;
color:white;
font-size:18px;
margin:8px;

}


.submit{

background:#4caf50;

}


input{

width:120px;
font-size:28px;
padding:8px;
text-align:center;

}


.msg{

font-size:24px;
color:#ff9800;
height:40px;

}


</style>

</head>


<body>


<div class="box">


<h1>
🧮 九九乘法学习
</h1>


<div class="card">


<div id="cn" class="cn">

一一得一

</div>


<div id="math" class="math">

1 × 1 = 1

</div>


</div>


<br>


<button id="learn">

📖学习

</button>


<br>


<input id="answer" placeholder="输入答案">


<button id="submit" class="submit">

提交

</button>


<div id="msg" class="msg">

</div>


</div>



<script>


let questions=[


{
cn:"一一得一",
a:1,
b:1,
result:1
},


{
cn:"一二得二",
a:1,
b:2,
result:2
},


{
cn:"一三得三",
a:1,
b:3,
result:3
}


];



let index=0;


//0未学习
//1补口诀
//2数字测试

let stage=0;



function current(){

return questions[index];

}



function show(){


let q=current();


document.getElementById("cn")
.innerText=q.cn;


document.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.result;


}



function number(n){

let arr=[
"零",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];


return arr[n];

}




function speak(t){

let u=
new SpeechSynthesisUtterance(t);

u.lang="zh-CN";

speechSynthesis.speak(u);

}




// 学习按钮


document
.getElementById("learn")
.onclick=function(){


let q=current();


stage=1;



document.getElementById("cn")
.innerText=

q.cn.substring(
0,
q.cn.length-1
)
+
"__";



document.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = "+
q.result;



document.getElementById("answer")
.value="";


document.getElementById("answer")
.placeholder=
"填最后一个字";


document.getElementById("msg")
.innerText=
"补全口诀";



speak(
q.cn
);


};





// 提交按钮


document
.getElementById("submit")
.onclick=function(){


let q=current();


let value=
document
.getElementById("answer")
.value
.trim();




//补全阶段

if(stage===1){



if(value===number(q.result)){



stage=2;



document.getElementById("cn")
.innerText=q.cn;



document.getElementById("math")
.innerText=

q.a+
" × "+
q.b+
" = ?";



document.getElementById("answer")
.value="";


document.getElementById("answer")
.placeholder=
"输入数字";


document.getElementById("msg")
.innerText=
"数字测试";


}

else{


document.getElementById("msg")
.innerText=
"再想一下";


}


}





//数字阶段


else if(stage===2){


if(
Number(value)===q.result
){


document.getElementById("msg")
.innerText=
"🎉答对啦！";


setTimeout(()=>{


index++;


if(index>=questions.length){

index=0;

}


stage=0;


show();


document.getElementById("answer")
.value="";


document.getElementById("answer")
.placeholder=
"输入答案";


document.getElementById("msg")
.innerText="";


},800);



}

else{


document.getElementById("msg")
.innerText=
"答案不正确";


}


}


};



show();


</script>


</body>

</html>
