<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>九九乘法智能老师 V7</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}


body{

height:100vh;

overflow:hidden;

font-family:-apple-system,
"SF Pro Display",
"Microsoft YaHei",
sans-serif;

background:
linear-gradient(180deg,#eaf8ff,#ffffff);

display:flex;

align-items:center;

justify-content:center;

}



.app{

width:94%;

max-width:390px;

height:calc(100vh - 20px);

max-height:680px;

background:#fff;

border-radius:26px;

padding:14px;

box-shadow:
0 10px 35px rgba(0,0,0,.08);

display:flex;

flex-direction:column;

justify-content:space-between;

}



/* 顶部 */

.header{

text-align:center;

}


.title{

font-size:21px;

font-weight:800;

color:#222;

}


.subtitle{

font-size:12px;

color:#888;

margin-top:2px;

}



.status{

display:flex;

justify-content:center;

gap:12px;

margin-top:8px;

}


.status span{

background:#f6f8fb;

border-radius:14px;

padding:5px 12px;

font-size:14px;

font-weight:600;

}





/* 进度 */

.progress-area{

text-align:center;

}


.level{

font-size:15px;

font-weight:700;

}



.progress{

height:7px;

background:#eee;

border-radius:10px;

overflow:hidden;

margin:5px 15px;

}



.bar{

height:100%;

width:0;

background:#4caf50;

transition:.3s;

}





/* 口诀 */

.memory{

text-align:center;

}



.label{

font-size:12px;

color:#999;

}



.kou-row{

display:flex;

justify-content:center;

align-items:center;

gap:8px;

}



.kou{

font-size:21px;

font-weight:700;

color:#222;

padding:4px 10px;

background:#f7f9fb;

border-radius:12px;

}



.voice{

border:0;

background:#e3f2fd;

color:#1976d2;

border-radius:20px;

padding:5px 10px;

}





/* 题目 */

.question-area{

text-align:center;

}



.question{

font-size:34px;

font-weight:800;

margin:5px;

}



.answer{

width:110px;

height:40px;

border-radius:12px;

border:2px solid #ddd;

font-size:24px;

text-align:center;

background:#fafafa;

}






/* 数字键 */

.keyboard{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:6px;

}



.key{

height:38px;

border:0;

border-radius:12px;

background:#f0f6ff;

font-size:19px;

font-weight:700;

}



.key:active{

transform:scale(.94);

}





/* 操作按钮 */


.actions{

display:flex;

gap:7px;

}



.btn{

flex:1;

height:38px;

border:0;

border-radius:12px;

font-weight:700;

}



.learn{

background:#2196f3;

color:white;

}


.submit{

background:#4caf50;

color:white;

}


.reset{

background:#eee;

}




.message{

height:22px;

text-align:center;

font-size:15px;

font-weight:bold;

}



.good{

color:#4caf50;

}


.bad{

color:#ff7043;

}



</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="title">
🌈 九九乘法智能老师
</div>

<div class="subtitle">
快乐学习 · 闯关成长
</div>


<div class="status">

<span>
⭐ <b id="stars">0</b>
</span>

<span>
🔥 <b id="combo">0</b>
</span>

<span id="rank">
🌱
</span>


</div>

</div>





<div class="progress-area">


<div id="level" class="level">
第一关：一的乘法
</div>


<div class="progress">

<div id="bar" class="bar"></div>

</div>


<div id="progressText"
style="font-size:12px;color:#888">
0/9
</div>


</div>





<div class="memory">

<div class="label">
📖口诀
</div>


<div class="kou-row">

<div id="kou"
class="kou">
一一得一
</div>


<button id="voice"
class="voice">
🔊
</button>


</div>

</div>





<div class="question-area">


<div id="question"
class="question">
1 × 1 = ?
</div>


<input id="answer"
class="answer"
readonly
placeholder="答案">


</div>





<div class="keyboard">


<button class="key">1</button>

<button class="key">2</button>

<button class="key">3</button>


<button class="key">4</button>

<button class="key">5</button>

<button class="key">6</button>


<button class="key">7</button>

<button class="key">8</button>

<button class="key">9</button>


<button class="key">0</button>

<button id="del"
class="key">
⌫
</button>

<button id="clear"
class="key">
清
</button>


</div>





<div class="actions">


<button id="learn"
class="btn learn">
📖学习
</button>


<button id="submit"
class="btn submit">
提交
</button>


<button id="reset"
class="btn reset">
重开
</button>


</div>



<div id="message"
class="message">
</div>



</div>

<script>

const kou={
"1x1":"一一得一",
"1x2":"一二得二",
"1x3":"一三得三",
"1x4":"一四得四",
"1x5":"一五得五",
"1x6":"一六得六",
"1x7":"一七得七",
"1x8":"一八得八",
"1x9":"一九得九",

"2x2":"二二得四",
"2x3":"二三得六",
"2x4":"二四得八",
"2x5":"二五一十",
"2x6":"二六十二",
"2x7":"二七十四",
"2x8":"二八十六",
"2x9":"二九十八",

"3x3":"三三得九",
"3x4":"三四十二",
"3x5":"三五十五",
"3x6":"三六十八",
"3x7":"三七二十一",
"3x8":"三八二十四",
"3x9":"三九二十七",

"4x4":"四四十六",
"4x5":"四五二十",
"4x6":"四六二十四",
"4x7":"四七二十八",
"4x8":"四八三十二",
"4x9":"四九三十六",

"5x5":"五五二十五",
"5x6":"五六三十",
"5x7":"五七三十五",
"5x8":"五八四十",
"5x9":"五九四十五",

"6x6":"六六三十六",
"6x7":"六七四十二",
"6x8":"六八四十八",
"6x9":"六九五十四",

"7x7":"七七四十九",
"7x8":"七八五十六",
"7x9":"七九六十三",

"8x8":"八八六十四",
"8x9":"八九七十二",

"9x9":"九九八十一"
};



// 创建题库
let questions=[];


for(let a=1;a<=9;a++){

    for(let b=a;b<=9;b++){

        questions.push({

            a:a,
            b:b,
            answer:a*b,
            key:a+"x"+b,
            error:0,
            done:false

        });

    }

}



let group=1;

let index=0;

let stars=
Number(localStorage.getItem("stars")||0);

let combo=0;



const answer=
document.getElementById("answer");


const message=
document.getElementById("message");





document.getElementById("stars")
.innerText=stars;




// 保存

function save(){

localStorage.setItem(
"stars",
stars
);

}



// 等级

function updateRank(){

let r=document.getElementById("rank");


if(stars<20){

r.innerText="🌱";

}
else if(stars<50){

r.innerText="🌿";

}
else if(stars<100){

r.innerText="🌳";

}
else{

r.innerText="🏆";

}

}





// 当前题

function current(){


let list=
questions.filter(
q=>q.a===group
);



return list[index%list.length];


}







// 显示

function render(){


let q=current();



document.getElementById("level")
.innerText=
"第"+group+"组："+group+"的乘法";



document.getElementById("kou")
.innerText=
kou[q.key];



document.getElementById("question")
.innerText=
q.a+" × "+q.b+" = ?";



answer.value="";



let done=
questions.filter(
x=>x.a===group&&x.done
).length;



document.getElementById("bar")
.style.width=
(done/9*100)+"%";


document.getElementById("progressText")
.innerText=
done+"/9";


message.innerText="";



}





// 声音

function sound(type){


try{


let Audio=
window.AudioContext||
window.webkitAudioContext;


let ctx=new Audio();



let osc=
ctx.createOscillator();


let gain=
ctx.createGain();



osc.connect(gain);

gain.connect(
ctx.destination
);



osc.frequency.value=
type==="ok"?880:220;


gain.gain.value=.15;


osc.start();


osc.stop(
ctx.currentTime+.25
);



}catch(e){}



}




// 通关声音

function passSound(){


try{


let Audio=
window.AudioContext||
window.webkitAudioContext;


let ctx=new Audio();



let notes=[
523,659,784,1046
];


notes.forEach((n,i)=>{


let osc=
ctx.createOscillator();


let gain=
ctx.createGain();


osc.frequency.value=n;


osc.connect(gain);

gain.connect(
ctx.destination
);



let time=
ctx.currentTime+i*0.15;


gain.gain.setValueAtTime(
0.18,
time
);


gain.gain.exponentialRampToValueAtTime(
0.01,
time+0.4
);



osc.start(time);

osc.stop(time+0.45);



});


}catch(e){}



}





// 语音

function speak(text){


if(window.speechSynthesis){


speechSynthesis.cancel();


let u=
new SpeechSynthesisUtterance(text);


u.lang="zh-CN";

u.rate=.8;


speechSynthesis.speak(u);


}

}



// 数字键盘

document
.querySelectorAll(".key")
.forEach(btn=>{


btn.onclick=function(){


let value=this.innerText;



if(value==="⌫"){


answer.value=
answer.value.slice(0,-1);


return;


}



if(value==="清"){


answer.value="";


return;


}



if(answer.value.length<2){


answer.value+=value;


}



};


});








// 提交答案


document
.getElementById("submit")
.onclick=function(){


let q=current();



if(answer.value==="")
return;



if(Number(answer.value)===q.answer){


q.done=true;

q.error=0;


stars++;

combo++;


document.getElementById("stars")
.innerText=stars;


document.getElementById("combo")
.innerText=combo;


save();

updateRank();



message.innerText=
"🎉 答对啦！";


message.className=
"message good";


sound("ok");



// 检查这一组是否完成

let groupList=
questions.filter(
x=>x.a===group
);



let finished=
groupList.every(
x=>x.done
);



if(finished){


setTimeout(()=>{


passSound();


message.innerText=
"🏆 "+group+"的乘法通关！";



setTimeout(()=>{


group++;


index=0;



if(group>9){


message.innerText=
"🎊 全部口诀完成！";


group=1;


questions.forEach(q=>{

q.done=false;

});


}



render();



},1200);



},400);



}

else{


setTimeout(()=>{


index++;

render();


},500);


}




}
else{


combo=0;


document.getElementById("combo")
.innerText=0;



q.error++;



message.innerText=
"😊 再想想\n"+
kou[q.key];


message.className=
"message bad";


sound("bad");



}



};







// 学习

document
.getElementById("learn")
.onclick=function(){


let q=current();


message.innerText=
"📖 "+q.a+"×"+q.b+
"="+q.answer+
"  "+kou[q.key];



speak(
kou[q.key]
);



};






// 听口诀

document
.getElementById("voice")
.onclick=function(){


let q=current();


speak(
kou[q.key]
);



};







// 重置


document
.getElementById("reset")
.onclick=function(){



stars=0;

combo=0;

group=1;

index=0;


localStorage.clear();



questions.forEach(q=>{


q.done=false;

q.error=0;


});



document.getElementById("stars")
.innerText=0;


document.getElementById("combo")
.innerText=0;


updateRank();


render();



};








// 错题强化

function strengthen(){


questions.sort(function(a,b){



if(b.error!==a.error){


return b.error-a.error;


}



// 保证口诀顺序

return(
a.a*10+a.b
)
-
(
b.a*10+b.b
);



});


}





// 初始化


updateRank();


strengthen();


render();



</script>


</body>

</html>
