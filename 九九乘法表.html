<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>小悟课堂V5</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#eeeeee;

font-family:"Microsoft YaHei",sans-serif;

}



.app{

width:92%;

max-width:500px;

margin:20px auto;

background:white;

padding:25px;

border-radius:25px;

text-align:center;

}



h1{

font-size:32px;

}



.teacher{

background:#f5f5f5;

padding:15px;

border-radius:15px;

font-size:20px;

}



.lesson{

font-size:36px;

font-weight:bold;

margin:25px;

}



.progress{

height:25px;

background:#ccc;

border-radius:20px;

overflow:hidden;

}



.green{

height:100%;

width:0%;

background:#4caf50;

transition:.5s;

}



.info{

margin:15px;

font-size:20px;

}



button{

width:90%;

padding:15px;

margin:8px;

border:0;

border-radius:15px;

background:#4caf50;

color:white;

font-size:20px;

}



input{

width:160px;

font-size:28px;

padding:10px;

text-align:center;

border-radius:10px;

border:1px solid #ccc;

}



.hide{

display:none;

}



.result{

font-size:22px;

margin:20px;

}



</style>


</head>



<body>


<div class="app">


<h1>
🧠 小悟课堂
</h1>


<div class="teacher" id="message">

准备学习

</div>



<div class="lesson" id="lesson">

一一得一

</div>




<div>

口诀掌握进度

</div>


<div class="progress">

<div class="green" id="bar">

</div>

</div>



<div class="info">

<span id="progressText">

0/45

</span>


&nbsp;&nbsp;


⭐

<span id="stars">

0

</span>


</div>





<div id="action">


<button id="mainBtn">

📖 学口诀

</button>


</div>




<div id="inputBox" class="hide">


<input id="answerInput">


<button id="submitBtn">

提交

</button>


</div>



<button id="restart">

🔄重新开始

</button>




<div class="result" id="result">

</div>


</div>


<script>
  // ================================
// 九九乘法数据
// ================================


const table=[

["一一得一",1,1,1],
["一二得二",1,2,2],
["一三得三",1,3,3],
["一四得四",1,4,4],
["一五得五",1,5,5],
["一六得六",1,6,6],
["一七得七",1,7,7],
["一八得八",1,8,8],
["一九得九",1,9,9],


["二二得四",2,2,4],
["二三得六",2,3,6],
["二四得八",2,4,8],
["二五一十",2,5,10],
["二六十二",2,6,12],
["二七十四",2,7,14],
["二八十六",2,8,16],
["二九十八",2,9,18],


["三三得九",3,3,9],
["三四十二",3,4,12],
["三五十五",3,5,15],
["三六十八",3,6,18],
["三七二十一",3,7,21],
["三八二十四",3,8,24],
["三九二十七",3,9,27],


["四四十六",4,4,16],
["四五二十",4,5,20],
["四六二十四",4,6,24],
["四七二十八",4,7,28],
["四八三十二",4,8,32],
["四九三十六",4,9,36],


["五五二十五",5,5,25],
["五六三十",5,6,30],
["五七三十五",5,7,35],
["五八四十",5,8,40],
["五九四十五",5,9,45],


["六六三十六",6,6,36],
["六七四十二",6,7,42],
["六八四十八",6,8,48],
["六九五十四",6,9,54],


["七七四十九",7,7,49],
["七八五十六",7,8,56],
["七九六十三",7,9,63],


["八八六十四",8,8,64],
["八九七十二",8,9,72],


["九九八十一",9,9,81]

];




// ================================
// 学习对象
// ================================


let lessons=

table.map((x,i)=>{


return {


id:i,


text:x[0],


a:x[1],


b:x[2],


answer:x[3],



// 掌握度

mastery:0,



// 当前阶段

// 0 学习
// 1 补全
// 2 测试
// 3 完成

stage:0,



correct:0,


wrong:0,


lastTime:0


};


});






// 当前口诀编号

let current=0;



// 当前星星

let stars=0;



// 错题队列

let wrongQueue=[];





// ================================
// 当前任务
// ================================


function currentLesson(){


return lessons[current];


}






// ================================
// 设置阶段
// ================================


function setStage(value){


currentLesson().stage=value;


}





// ================================
// 掌握数量
// ================================


function masteredCount(){


return lessons.filter(x=>{


return x.mastery>=90;


}).length;


}
// ================================
// 语音模块
// ================================


function speak(text){


if(!window.speechSynthesis){

return;

}


speechSynthesis.cancel();


let u=

new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=0.75;



speechSynthesis.speak(u);


}







// ================================
// 显示当前口诀
// ================================


function showLesson(){


let x=currentLesson();



document
.getElementById("lesson")
.innerText=x.text;



}







// ================================
// 主按钮控制
// ================================


document
.getElementById("mainBtn")
.onclick=function(){



let x=currentLesson();



// 阶段0：学习

if(x.stage===0){


setStage(1);



document
.getElementById("message")
.innerText=

"认真记住口诀";


showLesson();



speak(

x.a+
"乘"+
x.b+
"等于"+
x.answer+
"。"+
x.text

);



// 自动进入补全

setTimeout(()=>{


openInput("memory");


},2500);



}


};








// ================================
// 打开输入区域
// ================================


function openInput(type){



let inputBox=

document
.getElementById("inputBox");



inputBox.classList
.remove("hide");



let input=

document
.getElementById("answerInput");



input.value="";





if(type==="memory"){



document
.getElementById("message")
.innerText=

"补全口诀";



input.placeholder=

"请输入缺少的口诀";



}



if(type==="test"){



document
.getElementById("message")
.innerText=

"计算答案";



input.placeholder=

"请输入答案";



}



}









// ================================
// 提交按钮
// ================================


document
.getElementById("submitBtn")
.onclick=function(){



let x=currentLesson();



let value=

document
.getElementById("answerInput")
.value
.trim();



// 阶段1：补全

if(x.stage===1){



let blank=

x.text.substring(

0,

x.text.length-2

);



if(blank+value===x.text){



x.mastery+=30;


setStage(2);



document
.getElementById("result")
.innerText=

"🎉 口诀记住了！";



speak(
"正确"
);



// 自动进入测试

setTimeout(()=>{


openInput("test");


},300);



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"再试一次";


}



}





// 阶段2：测试


else if(x.stage===2){



if(Number(value)===x.answer){



x.mastery+=50;


x.correct++;


setStage(3);



finishLesson();



}

else{


x.wrong++;


document
.getElementById("result")
.innerText=

"答案不正确";


}



}



save();


update();



};
// ================================
// 完成当前口诀
// ================================


function finishLesson(){


let x=currentLesson();



x.mastery=100;



stars+=2;



document
.getElementById("result")
.innerText=

"🎉 掌握成功 ⭐+2";



speak(
"太棒了"
);



// 保存学习时间

x.lastTime=Date.now();



// 隐藏输入

document
.getElementById("inputBox")
.classList
.add("hide");




// 更新界面

update();

save();




// 自动下一题

setTimeout(()=>{


nextLesson();


resetLesson();


},500);



}







// ================================
// 选择下一题
// ================================


function nextLesson(){



// 第一优先：错误题


let weak=

lessons.filter(x=>{


return x.wrong>0 && x.mastery<90;


});



if(weak.length>0){


current=weak[0].id;


return;


}






// 第二：未完成口诀


let unlearn=

lessons.filter(x=>{


return x.mastery<90;


});



if(unlearn.length>0){


current=unlearn[0].id;


return;


}





// 全部完成

current=0;



}







// ================================
// 重置当前状态
// ================================


function resetLesson(){


let x=currentLesson();



x.stage=0;



document
.getElementById("message")
.innerText=

"准备学习";



document
.getElementById("result")
.innerText="";



document
.getElementById("mainBtn")
.innerText=

"📖 学口诀";



showLesson();



}








// ================================
// 更新进度
// ================================


function update(){



let total=0;



lessons.forEach(x=>{


total+=x.mastery;


});



let percent=

Math.round(

total/(lessons.length)

);



document
.getElementById("bar")
.style.width=

percent+"%";



document
.getElementById("progressText")
.innerText=

masteredCount()
+
"/45";



document
.getElementById("stars")
.innerText=

stars;



}








// ================================
// 保存
// ================================


function save(){



localStorage.setItem(

"xw_v5_lessons",

JSON.stringify(lessons)

);



localStorage.setItem(

"xw_v5_stars",

stars

);



localStorage.setItem(

"xw_v5_wrong",

JSON.stringify(wrongQueue)

);


}
// ================================
// 读取数据
// ================================


function load(){


try{


let a=

localStorage.getItem(
"xw_v5_lessons"
);



if(a){

lessons=

JSON.parse(a);

}




let b=

localStorage.getItem(
"xw_v5_stars"
);



if(b){

stars=

Number(b);

}




let c=

localStorage.getItem(
"xw_v5_wrong"
);



if(c){

wrongQueue=

JSON.parse(c);

}



}catch(e){


console.log(
"数据恢复失败"
);


}



}






// ================================
// 重新开始
// ================================


document
.getElementById("restart")
.onclick=function(){



let ok=

confirm(
"确定重新开始学习吗？"
);



if(!ok){

return;

}




lessons.forEach(x=>{


x.mastery=0;

x.stage=0;

x.correct=0;

x.wrong=0;

x.lastTime=0;


});



stars=0;


wrongQueue=[];


current=0;



save();


resetLesson();


update();



document
.getElementById("message")
.innerText=

"重新开始学习";



};







// ================================
// 初始化
// ================================


function init(){



load();



current=0;



showLesson();


update();



document
.getElementById("message")
.innerText=

"准备学习九九乘法";



}







// 自动保存保护

setInterval(()=>{


save();


},30000);





window.onbeforeunload=function(){


save();


};





// 启动

init();



</script>


</body>


</html>
