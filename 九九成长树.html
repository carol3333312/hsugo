<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>九九成长树 V3.4</title>


<style>

*{
box-sizing:border-box;
}


html,body{

margin:0;

height:100%;

overflow:hidden;

font-family:"Microsoft YaHei",sans-serif;

}



body{

background:
linear-gradient(
#9edcff,
#fff3b0,
#b9e8a0
);

}



.app{

height:100dvh;

max-width:390px;

margin:auto;

padding:8px;

padding-bottom:
env(safe-area-inset-bottom);

}



.world{

height:100%;

background:
rgba(255,255,255,.45);

border-radius:25px;

padding:10px;

overflow:hidden;

display:flex;

flex-direction:column;

}





.top{

display:flex;

justify-content:space-between;

font-size:16px;

font-weight:bold;

}




.scene{

height:190px;

position:relative;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}




.sun{

position:absolute;

right:20px;

top:5px;

font-size:35px;

}



.moon{

display:none;

position:absolute;

right:20px;

top:5px;

font-size:35px;

}





.tree{

width:150px;

height:170px;

}



.tree svg{

width:100%;

height:100%;

transition:.5s;

transform-origin:center bottom;

}




/* 树成长 */

.tree.seed svg{

transform:scale(.45);

}



.tree.small svg{

transform:scale(.7);

}



.tree.big svg{

transform:scale(1);

}




/* 树摇 */

.tree.grow svg{

animation:

treeSway 1s ease;

}




@keyframes treeSway{


0%{

transform:rotate(0);

}


25%{

transform:rotate(-3deg);

}


50%{

transform:rotate(2deg);

}


75%{

transform:rotate(-1deg);

}


100%{

transform:rotate(0);

}


}





#leaf{

transform-origin:center bottom;

}



.tree.wind #leaf{

animation:

leafSway 3s infinite ease-in-out;

}




@keyframes leafSway{


50%{

transform:rotate(3deg);

}


}





#fruitSvg{

display:none;

}



.tree.fruit #fruitSvg{

display:block;

}





.fruits{

position:absolute;

width:150px;

height:120px;

top:20px;

}



.fruits.swing{

animation:

fruitSwing 1s;

}



@keyframes fruitSwing{


50%{

transform:rotate(3deg);

}


}




.water{

position:absolute;

top:15px;

font-size:28px;

animation:

waterDrop 1s forwards;

}



@keyframes waterDrop{


to{

transform:translateY(100px);

opacity:0;

}


}




.score{

text-align:center;

}



.progress{

height:10px;

background:#ffffffaa;

border-radius:20px;

overflow:hidden;

}



.bar{

height:100%;

width:0;

background:#43a047;

}





.kou{

font-size:32px;

font-weight:bold;

text-align:center;

}





.question{

font-size:32px;

font-weight:bold;

text-align:center;

} input{

display:block;

width:110px;

height:42px;

margin:3px auto;

font-size:25px;

text-align:center;

border-radius:12px;

border:1px solid #aaa;

}



.keys{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:5px;

}



button{

border:0;

border-radius:25px;

font-size:16px;

height:38px;

}



button:active{

transform:scale(.95);

}



.key{

background:white;

}



.start{

width:100%;

height:40px;

background:white;

margin-top:4px;

}



.actionBox{

display:flex;

gap:15px;

margin-top:12px;

}



.submit,
.restart{

flex:1;

height:50px;

font-size:17px;

}



.submit{

background:#43a047;

color:white;

}



.restart{

background:white;

}




.msg{

height:20px;

text-align:center;

color:#388e3c;

}

</style>

</head>



<body>


<div class="app">

<div class="world">


<div class="top">

<div>
🌱 九九成长树
</div>

<div id="chapter"></div>

</div>



<div class="scene" id="scene">


<div class="sun" id="sun">
☀️
</div>


<div class="moon" id="moon">
🌙
</div>



<div class="tree seed wind grow" id="tree">


<svg viewBox="0 0 200 220">


<!-- 树干 -->

<path

d="M100 210 Q95 150 100 100"

stroke="#8b5a2b"

stroke-width="18"

fill="none"

/>



<!-- 树枝 -->

<path

d="M100 130 L60 90"

stroke="#8b5a2b"

stroke-width="8"

/>


<path

d="M100 120 L140 80"

stroke="#8b5a2b"

stroke-width="8"

/>



<!-- 叶冠 -->

<g id="leaf">


<circle

cx="70"

cy="80"

r="45"

fill="#4caf50"

/>


<circle

cx="125"

cy="70"

r="50"

fill="#66bb6a"

/>


<circle

cx="100"

cy="40"

r="38"

fill="#81c784"

/>


</g>



<!-- 果实 -->

<g id="fruitSvg">


<circle

cx="70"

cy="80"

r="8"

fill="red"

/>


<circle

cx="135"

cy="90"

r="8"

fill="red"

/>


<circle

cx="105"

cy="55"

r="8"

fill="red"

/>


</g>



</svg>


</div>



<div class="fruits" id="fruits"></div>


</div>





<div class="score">

⭐成长值

<span id="score">

0

</span>

</div>



<div id="progressText"></div>



<div class="progress">

<div id="bar"></div>

</div>




<div style="text-align:center">

📖口诀

</div>




<div id="kou" class="kou"></div>




<button class="start" onclick="startVoice()">

🌱开始学习

</button>




<div id="question" class="question"></div>




<input id="answer" readonly>




<div class="keys">


<button class="key" onclick="add(1)">1</button>

<button class="key" onclick="add(2)">2</button>

<button class="key" onclick="add(3)">3</button>


<button class="key" onclick="add(4)">4</button>

<button class="key" onclick="add(5)">5</button>

<button class="key" onclick="add(6)">6</button>


<button class="key" onclick="add(7)">7</button>

<button class="key" onclick="add(8)">8</button>

<button class="key" onclick="add(9)">9</button>


<button class="key" onclick="add(0)">0</button>

<button class="key" onclick="delA()">⌫</button>


</div>



<div class="actionBox">


<button class="submit" onclick="check()">

✅提交答案

</button>


<button class="restart" onclick="restart()">

🔄重新开始

</button>


</div>



<div id="msg" class="msg"></div>


</div>

</div>



<script>

const nums=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];


let group=1;

let index=1;

let done=0;

let score=0;

let fruit=0;


let autoVoice=false;

let audioCtx=null;




const tree=
document.getElementById("tree");


const scene=
document.getElementById("scene");


const fruits=
document.getElementById("fruits");


const answer=
document.getElementById("answer");






function cnNum(n){


if(n<=9){

return nums[n];

}


if(n===10){

return "十";

}


if(n<20){

return "十"+nums[n%10];

}


if(n%10===0){

return nums[n/10]+"十";

}


return nums[Math.floor(n/10)]
+"十"
+nums[n%10];

}




function kouText(a,b){


let r=a*b;


if(r<10){

return nums[a]+nums[b]+"得"+nums[r];

}


return nums[a]+nums[b]+cnNum(r);


}





function render(){


document.getElementById("chapter")
.innerHTML=
"第"+group+"组："+nums[group]+"的乘法村";



document.getElementById("kou")
.innerHTML=
kouText(group,index);



document.getElementById("question")
.innerHTML=
group+" × "+index+" = ?";



document.getElementById("progressText")
.innerHTML=
"第"+group+"组 "+done+"/9";



document.getElementById("bar")
.style.width=
(done/9*100)+"%";



document.getElementById("score")
.innerHTML=
score;



updateTree();


}






function updateTree(){


tree.classList.remove(
"seed",
"small",
"big",
"fruit"
);



if(score<30){


tree.classList.add("seed");


}


else if(score<80){


tree.classList.add("small");


}


else if(score<160){


tree.classList.add("big");


}


else{


tree.classList.add("fruit");


}



}





function startVoice(){


autoVoice=true;


voice();


}






function voice(){


let u=
new SpeechSynthesisUtterance(
kouText(group,index)
);



u.lang="zh-CN";

u.rate=.8;


speechSynthesis.cancel();


speechSynthesis.speak(u);


}







function playSound(type){


if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}



let osc=
audioCtx.createOscillator();


let gain=
audioCtx.createGain();


osc.connect(gain);

gain.connect(audioCtx.destination);



if(type==="ok"){

osc.frequency.value=900;

}

else if(type==="win"){

osc.frequency.value=1300;

}

else{

osc.frequency.value=300;

}



gain.gain.value=.08;


osc.start();


osc.stop(
audioCtx.currentTime+.2
);


}







function growEffect(){


tree.classList.remove("grow");


void tree.offsetWidth;


tree.classList.add("grow");



let water=
document.createElement("div");


water.className="water";


water.innerHTML="💧";


scene.appendChild(water);



setTimeout(()=>{

water.remove();

},1000);


}







function add(n){


if(answer.value.length<2){

answer.value+=n;

}


}




function delA(){


answer.value=
answer.value.slice(0,-1);

}







function check(){



let user=
Number(answer.value);



if(user===group*index){


score+=10;

done++;


playSound("ok");


growEffect();



document.getElementById("msg")
.innerHTML=
"🌱 小树喝到水啦";




if(done>=9){


playSound("win");


celebrate();



document.getElementById("msg")
.innerHTML=
"🎉 通关啦！";



group++;

done=0;

index=1;


if(group>9){

group=1;

}


}

else{


index++;

}





if(autoVoice){


setTimeout(()=>{

voice();

},500);


}




}



else{


playSound("bad");



if(fruit>0){

fruit--;

}



document.getElementById("msg")
.innerHTML=
"🍎果实掉落，再看看口诀";


}



answer.value="";


render();


}






function celebrate(){


for(let i=0;i<12;i++){


let f=
document.createElement("div");


f.innerHTML="🌸";


f.style.position="absolute";

f.style.left=
Math.random()*300+"px";


f.style.top="0";


f.style.animation=
"drop 2s";


scene.appendChild(f);



setTimeout(()=>{

f.remove();

},2000);


}


}






function restart(){


group=1;

index=1;

done=0;

score=0;

fruit=0;


render();


}





render();

</script>

</body>

</html>
