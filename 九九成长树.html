<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>九九成长猎豹 V5.2</title>


<style>

*{
box-sizing:border-box;
}


html,body{

margin:0;

padding:0;

height:100%;

overflow:hidden;

font-family:"Microsoft YaHei",sans-serif;

}



body{

background:linear-gradient(
#8edcff,
#e8ffd0
);

}



.app{

height:100dvh;

max-width:390px;

margin:auto;

padding:8px;

}



.game{

height:100%;

background:rgba(255,255,255,.5);

border-radius:25px;

padding:10px;

overflow:hidden;

}




.header{

display:flex;

justify-content:space-between;

font-weight:bold;

font-size:16px;

}



.race{

height:190px;

margin-top:8px;

border-radius:20px;

overflow:hidden;

position:relative;

background:linear-gradient(
#8ad8ff,
#d7f5a0
);

}




.track{

position:absolute;

bottom:22px;

width:100%;

height:12px;

background:#a87945;

}




.finish{

position:absolute;

right:15px;

bottom:35px;

font-size:35px;

}




.wind{

position:absolute;

left:-60px;

top:70px;

font-size:25px;

opacity:0;

}



.wind.active{

opacity:.8;

animation:windMove 1s linear infinite;

}



@keyframes windMove{


from{

transform:translateX(0);

}

to{

transform:translateX(420px);

}

}




.cheetah{

position:absolute;

left:20px;

bottom:28px;

width:150px;

transform-origin:center;

}




.cheetah.running{

animation:bodyRun .25s infinite;

}



@keyframes bodyRun{


50%{

transform:translateY(-7px);

}


}





.leg1{

transform-origin:top;

}



.leg2{

transform-origin:top;

}



.running .leg1{

animation:legRun .25s infinite alternate;

}



.running .leg2{

animation:legRun .25s infinite alternate-reverse;

}




@keyframes legRun{


from{

transform:rotate(15deg);

}


to{

transform:rotate(-20deg);

}


}




.running .tail{

animation:tailRun .5s infinite;

transform-origin:left;

}



@keyframes tailRun{


50%{

transform:rotate(18deg);

}

}





.speedBox{

text-align:center;

font-weight:bold;

font-size:18px;

margin:5px;

}


</style>

</head>


<body>


<div class="app">


<div class="game">


<div class="header">

<div>
🐆 九九成长猎豹
</div>


<div id="level">

Lv1 小猎豹

</div>


</div>



<div class="race">



<div id="wind" class="wind">

💨💨

</div>




<div id="cheetah" class="cheetah">


<svg viewBox="0 0 300 150">


<!-- 身体 -->

<ellipse 
cx="140"
cy="75"
rx="75"
ry="35"
fill="#d89b35"/>



<!-- 斑纹 -->

<circle cx="110" cy="60" r="5"/>
<circle cx="145" cy="50" r="5"/>
<circle cx="175" cy="80" r="5"/>
<circle cx="125" cy="90" r="5"/>



<!-- 头 -->

<circle 
cx="225"
cy="60"
r="30"
fill="#d89b35"/>



<!-- 眼睛 -->

<circle
cx="235"
cy="55"
r="5"
fill="black"/>



<!-- 耳朵 -->

<circle
cx="215"
cy="35"
r="9"
fill="#9c641e"/>



<!-- 尾巴 -->

<path
class="tail"
d="M75 75 Q20 35 5 70"
stroke="#d89b35"
stroke-width="12"
fill="none"/>



<!-- 前腿 -->

<line
class="leg1"
x1="180"
y1="95"
x2="215"
y2="130"
stroke="#d89b35"
stroke-width="12"/>



<!-- 后腿 -->

<line
class="leg2"
x1="100"
y1="95"
x2="65"
y2="130"
stroke="#d89b35"
stroke-width="12"/>



</svg>


</div>



<div class="finish">
🏁
</div>


<div class="track"></div>


</div>

<div class="speedBox">

速度：
<span id="speed">20</span>

&nbsp;&nbsp;

🔥连击：
<span id="streak">0</span>

</div>




<div style="text-align:center">

📖口诀

</div>



<div id="kou" style="
text-align:center;
font-size:32px;
font-weight:bold;
">

一一得一

</div>



<div style="
height:10px;
background:#ffffffaa;
border-radius:20px;
overflow:hidden;
">

<div id="bar" style="
height:100%;
width:0%;
background:#43a047;
">

</div>

</div>




<div id="progressText">

第1组 0/9

</div>





<button id="startVoice">

🌱 开始学习

</button>






<div id="question" class="question">

1 × 1 = ?

</div>




<input id="answer" readonly>





<div class="keys">


<button onclick="add(1)">
1
</button>


<button onclick="add(2)">
2
</button>


<button onclick="add(3)">
3
</button>



<button onclick="add(4)">
4
</button>


<button onclick="add(5)">
5
</button>


<button onclick="add(6)">
6
</button>



<button onclick="add(7)">
7
</button>


<button onclick="add(8)">
8
</button>


<button onclick="add(9)">
9
</button>



<button onclick="add(0)">
0
</button>


<button onclick="delA()">
⌫
</button>


</div>





<button id="submit">

✅ 提交答案

</button>



<div class="buttonGap"></div>



<button id="restart">

🔄 重新开始

</button>




<div id="msg">

</div>





<style>


.question{

text-align:center;

font-size:32px;

font-weight:bold;

margin-top:5px;

}



.keys{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:6px;

margin-top:8px;

}



.keys button{

height:38px;

border:0;

background:white;

border-radius:14px;

font-size:18px;

}



button{

width:100%;

height:45px;

border:0;

border-radius:15px;

font-size:18px;

}



button:active{

transform:scale(.95);

}




#startVoice{

background:#fff;

margin-top:5px;

}



#submit{

height:52px;

background:#43a047;

color:white;

font-size:19px;

margin-top:12px;

}



.buttonGap{

height:18px;

}



#restart{

background:white;

}



#msg{

height:22px;

text-align:center;

color:#388e3c;

margin-top:5px;

}



input{

display:block;

width:110px;

height:45px;

margin:5px auto;

border-radius:12px;

border:1px solid #aaa;

font-size:25px;

text-align:center;

}



</style>




<script>

// =====================
// 九九成长猎豹 V5.2
// 核心逻辑
// =====================


const nums=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];



let group=1;

let index=1;

let done=0;


let speed=20;

let streak=0;

let distance=0;


let voiceEnable=false;



const cheetah=
document.getElementById("cheetah");


const wind=
document.getElementById("wind");





function cnNum(n){


if(n<=9){

return nums[n];

}


if(n===10){

return "十";

}


if(n<20){

return "十"+nums[n%10];

}


if(n%10===0){

return nums[n/10]+"十";

}


return nums[Math.floor(n/10)]
+"十"
+nums[n%10];

}




function kouText(a,b){


let result=a*b;


if(result<10){

return nums[a]+nums[b]+"得"+nums[result];

}


return nums[a]+nums[b]+cnNum(result);


}







function render(){


document.getElementById("kou")
.innerHTML=
kouText(group,index);



document.getElementById("question")
.innerHTML=
group+" × "+index+" = ?";



document.getElementById("progressText")
.innerHTML=
"第"+group+"组 "+done+"/9";



document.getElementById("bar")
.style.width=
(done/9*100)+"%";



document.getElementById("speed")
.innerHTML=
speed;



document.getElementById("streak")
.innerHTML=
streak;


}






// 猎豹运动

function updateRun(){



if(speed>25){

cheetah.classList.add("running");

wind.classList.add("active");


}else{


cheetah.classList.remove("running");

wind.classList.remove("active");


}




distance += speed/40;



if(distance>180){

distance=0;

}




cheetah.style.transform=
"translateX("+distance+"px)";


}





setInterval(updateRun,40);







// 数字输入


function add(num){


document.getElementById("answer")
.value += num;


}




function delA(){


let input=
document.getElementById("answer");


input.value=
input.value.slice(0,-1);


}






// 声音

function beep(type){



if(!voiceEnable){

return;

}



let ctx=
new(window.AudioContext||
window.webkitAudioContext)();



let osc=
ctx.createOscillator();


let gain=
ctx.createGain();



osc.connect(gain);

gain.connect(ctx.destination);



if(type==="ok"){

osc.frequency.value=880;

}


if(type==="bad"){

osc.frequency.value=300;

}


if(type==="win"){

osc.frequency.value=1200;

}



gain.gain.value=.08;


osc.start();


osc.stop(
ctx.currentTime+.15
);


}

// =====================
// 答题核心
// =====================


function check(){


let userAnswer=
Number(
document.getElementById("answer").value
);



if(
userAnswer === group*index
){


streak++;


speed += 8;



if(speed>100){

speed=100;

}



done++;



beep("ok");



document.getElementById("msg")
.innerHTML=
"🐆 答对啦！猎豹加速";





// 一组完成

if(done>=9){



beep("win");



document.getElementById("msg")
.innerHTML=
"🏁 冲过终点！👏";



speed+=15;


if(speed>100){

speed=100;

}



group++;


done=0;


index=1;



if(group>9){

group=1;

}




}

else{


index++;


}




// 自动朗读下一题

if(voiceEnable){


setTimeout(function(){

voice();


},500);


}



}

else{


streak=0;


speed-=15;



if(speed<10){

speed=10;

}



beep("bad");



document.getElementById("msg")
.innerHTML=
"🐆 停下来想一想";



}



document.getElementById("answer")
.value="";



render();


}







// =====================
// 口诀语音
// =====================


function voice(){


let text=
kouText(group,index);



let u=
new SpeechSynthesisUtterance(text);



u.lang="zh-CN";


u.rate=.8;


speechSynthesis.cancel();


speechSynthesis.speak(u);



}







// =====================
// 第一次点击开启声音
// =====================


document
.getElementById("startVoice")
.onclick=function(){


voiceEnable=true;


voice();



};








// =====================
// 按钮事件
// =====================


document
.getElementById("submit")
.onclick=function(){


check();


};






document
.getElementById("restart")
.onclick=function(){



let ok=
confirm(
"确定重新开始吗？"
);



if(ok){


group=1;

index=1;

done=0;


speed=20;

streak=0;

distance=0;



cheetah.style.transform=
"translateX(0px)";



render();


}



};






// 初始化

render();


</script>


</body>

</html>
