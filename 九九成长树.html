<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>九九成长猎豹 V5.1</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

overflow:hidden;

font-family:"Microsoft YaHei",sans-serif;

background:linear-gradient(#8bd8ff,#eaffc8);

}



.app{

height:100dvh;

max-width:390px;

margin:auto;

padding:8px;

}



.panel{

height:100%;

background:rgba(255,255,255,.5);

border-radius:25px;

padding:12px;

overflow:hidden;

}




.header{

display:flex;

justify-content:space-between;

font-weight:bold;

}



.race{

height:190px;

position:relative;

overflow:hidden;

background:linear-gradient(#7ed2ff,#d9f5a5);

border-radius:20px;

margin-top:8px;

}



.ground{

position:absolute;

bottom:20px;

height:12px;

width:100%;

background:#b58a52;

}




.finish{

position:absolute;

right:20px;

bottom:30px;

font-size:35px;

}




.wind{

position:absolute;

left:-50px;

top:80px;

font-size:25px;

opacity:0;

}



.wind.active{

opacity:.8;

animation:windMove 1s linear infinite;

}



@keyframes windMove{


from{

transform:translateX(0);

}


to{

transform:translateX(400px);

}


}




.cheetah{

position:absolute;

left:20px;

bottom:30px;

width:140px;

transform-origin:center;

transition:transform .3s;

}




.cheetah.run{

animation:bounce .25s infinite;

}



@keyframes bounce{


50%{

margin-bottom:8px;

}


}




.leg{

transform-origin:top;

}



.cheetah.run .leg1{

animation:legA .25s infinite alternate;

}



.cheetah.run .leg2{

animation:legA .25s infinite alternate-reverse;

}




@keyframes legA{


from{

transform:rotate(15deg);

}

to{

transform:rotate(-20deg);

}


}




.cheetah.run .tail{

animation:tailA .4s infinite;

transform-origin:left;

}



@keyframes tailA{


50%{

transform:rotate(15deg);

}


}



.speedBox{

text-align:center;

font-size:18px;

font-weight:bold;

margin:5px;

}



</style>

</head>


<body>


<div class="app">


<div class="panel">


<div class="header">

<div>
🐆 九九成长猎豹
</div>


<div>
Lv1 小猎豹
</div>


</div>



<div class="race">


<div id="wind" class="wind">

💨💨

</div>



<div id="cheetah" class="cheetah">


<svg viewBox="0 0 300 150">


<!--身体-->

<ellipse cx="140"
cy="75"
rx="75"
ry="35"
fill="#d99b32"/>



<!--斑纹-->

<circle cx="110" cy="60" r="5"/>
<circle cx="145" cy="50" r="5"/>
<circle cx="170" cy="80" r="5"/>
<circle cx="120" cy="90" r="5"/>



<!--头-->

<circle cx="220"
cy="60"
r="30"
fill="#d99b32"/>



<!--耳朵-->

<circle cx="210"
cy="35"
r="9"
fill="#a86d20"/>



<!--尾巴-->

<path class="tail"
d="M75 75 Q20 35 5 70"
stroke="#d99b32"
stroke-width="10"
fill="none"/>



<!--腿-->

<line class="leg leg1"
x1="180"
y1="95"
x2="210"
y2="130"
stroke="#d99b32"
stroke-width="12"/>


<line class="leg leg2"
x1="100"
y1="95"
x2="70"
y2="130"
stroke="#d99b32"
stroke-width="12"/>


</svg>


</div>



<div class="finish">
🏁
</div>



<div class="ground">

</div>


</div>
<div class="speedBox">

速度：
<span id="speed">20</span>

&nbsp;&nbsp;

🔥连击：
<span id="streak">0</span>

</div>



<div style="text-align:center;font-size:16px">

📖口诀

</div>



<div id="kou" style="
text-align:center;
font-size:32px;
font-weight:bold;
">

一一得一

</div>



<div style="
height:10px;
background:#ffffffaa;
border-radius:20px;
overflow:hidden;
">

<div id="bar" style="
height:100%;
width:0%;
background:#43a047;
">

</div>

</div>



<div id="progressText">

第1组 0/9

</div>




<button id="startVoice">

🌱开始学习

</button>





<div id="question" style="
text-align:center;
font-size:32px;
font-weight:bold;
margin-top:5px;
">

1 × 1 = ?

</div>




<input id="answer" readonly>




<div class="keys">


<button onclick="add(1)">1</button>

<button onclick="add(2)">2</button>

<button onclick="add(3)">3</button>


<button onclick="add(4)">4</button>

<button onclick="add(5)">5</button>

<button onclick="add(6)">6</button>


<button onclick="add(7)">7</button>

<button onclick="add(8)">8</button>

<button onclick="add(9)">9</button>


<button onclick="add(0)">0</button>

<button onclick="delA()">⌫</button>


</div>




<button id="submit">

✅提交答案

</button>




<button id="restart">

🔄重新开始

</button>




<div id="msg">

</div>




</div>

</div>





<style>


button{

width:100%;

height:45px;

border:0;

border-radius:14px;

font-size:18px;

margin-top:6px;

}



button:active{

transform:scale(.95);

}



.keys{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:6px;

margin-top:8px;

}



.keys button{

height:38px;

background:white;

}



#submit{

height:52px;

background:#43a047;

color:white;

margin-top:12px;

}



#restart{

margin-top:20px;

background:#fff;

}



input{

display:block;

width:110px;

height:45px;

margin:5px auto;

border-radius:12px;

border:1px solid #aaa;

font-size:25px;

text-align:center;

}



#msg{

height:22px;

text-align:center;

color:#388e3c;

}



</style>



<script>
  const nums=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];


let group=1;
let index=1;
let done=0;


let speed=20;

let streak=0;

let distance=0;

let voiceEnable=false;



const cheetah=
document.getElementById("cheetah");


const wind=
document.getElementById("wind");



function cnNum(n){


if(n<=9){

return nums[n];

}


if(n==10){

return "十";

}


if(n<20){

return "十"+nums[n%10];

}


if(n%10==0){

return nums[n/10]+"十";

}


return nums[Math.floor(n/10)]
+"十"
+nums[n%10];


}



function kouText(a,b){


let r=a*b;


if(r<10){

return nums[a]+nums[b]+"得"+nums[r];

}


return nums[a]+nums[b]+cnNum(r);

}




function render(){


document.getElementById("kou")
.innerHTML=
kouText(group,index);



document.getElementById("question")
.innerHTML=
group+" × "+index+" = ?";



document.getElementById("progressText")
.innerHTML=
"第"+group+"组 "+done+"/9";



document.getElementById("bar")
.style.width=
(done/9*100)+"%";



document.getElementById("speed")
.innerHTML=
speed;



document.getElementById("streak")
.innerHTML=
streak;


}






function run(){


if(speed>25){

cheetah.classList.add("run");

wind.classList.add("active");


}

else{


cheetah.classList.remove("run");

wind.classList.remove("active");


}



distance+=speed/30;



if(distance>190){

distance=20;

}



cheetah.style.left=
(20+distance)+"px";



}



setInterval(run,40);






function add(n){

document.getElementById("answer")
.value+=n;

}



function delA(){

let a=
document.getElementById("answer");


a.value=
a.value.slice(0,-1);

}





function beep(type){


let ctx=
new(window.AudioContext||
window.webkitAudioContext)();


let osc=
ctx.createOscillator();


let gain=
ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type==="ok"){

osc.frequency.value=880;

}

else if(type==="win"){

osc.frequency.value=1200;

}

else{

osc.frequency.value=300;

}


gain.gain.value=.08;


osc.start();


osc.stop(
ctx.currentTime+.15
);


}






function check(){



let answer=

Number(
document.getElementById("answer").value
);



if(answer===group*index){



streak++;


speed+=8;



if(speed>90){

speed=90;

}



beep("ok");



document.getElementById("msg")
.innerHTML=
"🐆答对啦！猎豹加速";



done++;



if(done>=9){


beep("win");


document.getElementById("msg")
.innerHTML=
"🏁冲过终点！太棒啦！";


speed+=15;


group++;

done=0;

index=1;


if(group>9){

group=1;

}


}

else{


index++;

}



if(voiceEnable){

setTimeout(()=>{

voice();

},400);

}



}

else{



streak=0;


speed-=15;


if(speed<10){

speed=10;

}



beep("bad");



document.getElementById("msg")
.innerHTML=
"🐆停下来想一想";


}



document.getElementById("answer")
.value="";


render();


}






function voice(){


let u=
new SpeechSynthesisUtterance(
kouText(group,index)
);


u.lang="zh-CN";


u.rate=.8;


speechSynthesis.cancel();


speechSynthesis.speak(u);


}






document
.getElementById("startVoice")
.onclick=function(){


voiceEnable=true;


voice();


};






document
.getElementById("submit")
.onclick=function(){

check();

};






document
.getElementById("restart")
.onclick=function(){


group=1;

index=1;

done=0;

speed=20;

streak=0;

distance=0;


render();


};






render();



</script>


</body>

</html>
