<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>九九成长森林 V5.0</title>

<style>

/* =========================
   基础
========================= */

*{
box-sizing:border-box;
}

html,
body{
margin:0;
height:100%;
overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
}

body{
background:#10213b;
}

.app{
height:100dvh;
max-width:430px;
margin:auto;
padding:8px;
padding-bottom:env(safe-area-inset-bottom);
}

.world{
height:100%;
background:rgba(255,255,255,.14);
border-radius:26px;
padding:10px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 8px 30px #0005;
}


/* =========================
   顶部
========================= */

.top{
display:flex;
justify-content:space-between;
font-size:15px;
font-weight:bold;
color:#17301d;
}


/* =========================
   场景
========================= */

.scene{
height:220px;
position:relative;
overflow:hidden;
border-radius:20px;

background:
linear-gradient(
#8bd8ff 0%,
#dff5ff 62%,
#9bd875 63%,
#63ad4f 100%
);

transition:background 2s;
}

.sky{
position:absolute;
inset:0;
overflow:hidden;
}


/* 太阳 */

.sun{
position:absolute;
font-size:42px;
right:18px;
top:7px;
transition:all 2s;
}


/* 月亮 */

.moon{
position:absolute;
font-size:42px;
right:18px;
top:7px;

opacity:0;

transform:translateY(20px);

transition:all 2s;
}


/* =========================
   星星
========================= */

.star{
position:absolute;
color:#fff;
font-size:14px;
opacity:0;
transition:opacity 2s;
}

.star1{
right:65px;
top:25px;
}

.star2{
right:102px;
top:48px;
}

.star3{
right:135px;
top:27px;
}


/* =========================
   云
========================= */

.cloud{
position:absolute;
font-size:31px;
opacity:.72;

animation:
cloudMove 18s linear infinite;
}

.c1{
left:-55px;
top:28px;
}

.c2{
left:45%;
top:65px;

animation-duration:24s;
}

@keyframes cloudMove{

to{
transform:translateX(480px);
}

}


/* =========================
   草地
========================= */

.ground{
position:absolute;
bottom:0;

width:100%;
height:62px;

background:#68ae4f;

border-radius:
50% 50% 0 0 /
25% 25% 0 0;
}


/* =========================
   森林
========================= */

.forest{
position:absolute;

left:0;
right:0;
bottom:22px;

height:150px;

z-index:2;
}


/* =========================
   单棵树
========================= */

.tree{
position:absolute;

bottom:0;

width:72px;
height:105px;

transform-origin:center bottom;

transition:
transform 1s ease;
}


/* 9棵树的位置 */

.t1{
left:2%;
}

.t2{
left:12%;
}

.t3{
left:23%;
}

.t4{
left:34%;
}

.t5{
left:46%;
}

.t6{
left:58%;
}

.t7{
left:69%;
}

.t8{
left:80%;
}

.t9{
left:90%;
}


/* =========================
   树木成长阶段
========================= */

.tree.seed{
transform:
scale(.15)
translateY(65px);
}

.tree.s1{
transform:
scale(.28)
translateY(35px);
}

.tree.s2{
transform:
scale(.42)
translateY(20px);
}

.tree.s3{
transform:
scale(.57)
translateY(8px);
}

.tree.s4{
transform:
scale(.72);
}

.tree.s5{
transform:
scale(.88);
}

.tree.forestTree{
transform:
scale(1);
}


/* =========================
   叶子随风
========================= */

.leaves{
transform-origin:center bottom;

animation:
leafWind 4s ease-in-out infinite;
}

@keyframes leafWind{

50%{
transform:
rotate(2deg)
translateX(1px);
}

}


/* =========================
   浇水后树木摇摆
========================= */

.tree.watered{
animation:
treeWater .8s ease;
}

@keyframes treeWater{

30%{
transform:
var(--grow)
rotate(-4deg);
}

65%{
transform:
var(--grow)
rotate(3deg);
}

}


/* =========================
   水滴
========================= */

.wdrop{
position:absolute;

z-index:7;

font-size:24px;

top:28px;

animation:
drop .8s forwards;
}

@keyframes drop{

to{
transform:
translateY(120px);

opacity:0;
}

}


/* =========================
   兔子
========================= */

.rabbit{
position:absolute;

z-index:6;

bottom:37px;

left:-45px;

font-size:31px;

display:none;
}

.rabbit.run{
display:block;

animation:
rabbitRun 3.8s linear forwards;
}

@keyframes rabbitRun{

0%{
left:-45px;
transform:scaleX(1);
}

48%{
left:48%;
transform:scaleX(1);
}

52%{
left:52%;
transform:scaleX(-1);
}

100%{
left:110%;
transform:scaleX(-1);
}

}


/* =========================
   野狗
========================= */

.dog{
position:absolute;

z-index:6;

bottom:35px;

left:-55px;

font-size:30px;

display:none;
}

.dog.run{
display:block;

animation:
dogRun 3.1s linear forwards;
}

@keyframes dogRun{

0%{
left:-55px;
}

55%{
left:40%;
}

100%{
left:110%;
}

}


/* =========================
   动物提示
========================= */

.msgAnimal{
position:absolute;

z-index:8;

left:50%;
top:82px;

transform:
translateX(-50%);

font-size:12px;

background:#ffffffbb;

padding:4px 8px;

border-radius:10px;

opacity:0;
}

.msgAnimal.show{

animation:
pop .8s forwards;
}

@keyframes pop{

20%{
opacity:1;

transform:
translateX(-50%)
translateY(-5px);
}

100%{
opacity:0;

transform:
translateX(-50%)
translateY(-18px);
}

}


/* =========================
   成长值
========================= */

.score{
text-align:center;

margin-top:3px;

font-size:14px;
}


/* =========================
   进度条
========================= */

.progress{
height:9px;

background:#ffffffaa;

border-radius:20px;

overflow:hidden;

margin:
3px 0 2px;
}

.bar{
height:100%;

width:0;

background:#43a047;

transition:
width .35s;
}

.progressText{
text-align:center;

font-size:12px;
}


/* =========================
   考试模式
========================= */

.examMode{
text-align:center;

font-size:11px;

color:#666;

margin-bottom:1px;
}


/* =========================
   口诀
========================= */

.kou{
font-size:25px;

font-weight:bold;

text-align:center;

min-height:33px;

color:#17301d;
}


/* =========================
   题目
========================= */

.question{
font-size:35px;

font-weight:bold;

text-align:center;

min-height:46px;

margin-top:2px;

color:#13251a;
}


/* =========================
   答案输入框
========================= */

input{
display:block;

width:125px;

height:44px;

margin:
0 auto 4px;

font-size:27px;

text-align:center;

border-radius:12px;

border:
1px solid #aaa;

background:#fff;
}


/* =========================
   数字键盘
========================= */

.keys{
display:grid;

grid-template-columns:
repeat(3,1fr);

gap:5px;
}

button{
border:0;

border-radius:22px;

font-size:16px;

height:37px;

box-shadow:
0 2px 4px #0002;
}

button:active{
transform:scale(.95);
}

.key{
background:#fff;
}


/* =========================
   操作按钮
========================= */

.actionBox{
display:flex;

gap:8px;

margin-top:7px;

align-items:stretch;
}


/* 重新开始 */

.submit{
flex:1.65;

height:48px;

font-size:18px;

background:#43a047;

color:#fff;

font-weight:bold;
}


/* 提交 */

.restart{
flex:.7;

height:48px;

font-size:14px;

background:#fff;

color:#666;
}


/* =========================
   提示
========================= */

.msg{
height:19px;

text-align:center;

color:#388e3c;

font-size:13px;
}


/* =========================
   夜晚
========================= */

.night .scene{

background:
linear-gradient(
#17294b 0%,
#293c62 62%,
#385b38 63%,
#25482c 100%
);
}

.night .ground{
background:#31562f;
}

.night .sun{
opacity:0;

transform:
translateY(25px);
}

.night .moon{
opacity:1;

transform:
translateY(0);
}

.night .star{
opacity:1;
}

.night .top,
.night .kou,
.night .question{
color:#fff;
}

.night .examMode,
.night .progressText{
color:#ddd;
}


/* =========================
   夕阳
========================= */

.dusk .scene{

background:
linear-gradient(
#f28d6a 0%,
#f6c17d 50%,
#8d9f67 63%,
#557642 100%
);
}

.dusk .sun{
top:66px;

right:35px;
}

.dusk .cloud{
opacity:.35;
}

.dusk .moon{
opacity:0;
}

</style>
</head>


<body>

<div class="app">

<div
class="world"
id="world"
>


<!-- =========================
     顶部
========================= -->

<div class="top">

<div>
🌱 九九成长森林
</div>

<div id="chapter"></div>

</div>


<!-- =========================
     场景
========================= -->

<div
class="scene"
id="scene"
>


<div class="sky">


<!-- 太阳 -->

<div
class="sun"
id="sun"
>
☀️
</div>


<!-- 月亮 -->

<div class="moon">
🌙
</div>


<!-- 星星 -->

<div class="star star1">
★
</div>

<div class="star star2">
★
</div>

<div class="star star3">
★
</div>


<!-- 云 -->

<div class="cloud c1">
☁️
</div>

<div class="cloud c2">
☁️
</div>


</div>


<!-- 森林 -->

<div
class="forest"
id="forest">
</div>


<!-- 草地 -->

<div class="ground">
</div>


<!-- 兔子 -->

<div
class="rabbit"
id="rabbit">
🐇
</div>


<!-- 野狗 -->

<div
class="dog"
id="dog">
🐕
</div>


<!-- 动物提示 -->

<div
class="msgAnimal"
id="msgAnimal">
</div>


</div>


<!-- =========================
     成长值
========================= -->

<div class="score">

⭐成长值

<span id="score">
0
</span>

</div>


<!-- =========================
     本组进度
========================= -->

<div
class="progressText"
id="progressText">
</div>


<div class="progress">

<div
class="bar"
id="bar">
</div>

</div>


<!-- =========================
     考试模式
========================= -->

<div class="examMode">

📖 按组复习 · 顺序出题 · 每组 9 题

</div>


<!-- =========================
     口诀
========================= -->

<div
class="kou"
id="kou">
</div>


<!-- =========================
     题目
========================= -->

<div
class="question"
id="question">
</div>


<!-- =========================
     答案
========================= -->

<input
id="answer"
inputmode="numeric"
readonly
>


<!-- =========================
     数字键盘
========================= -->

<div class="keys">

<button
class="key"
onclick="add(1)"
>
1
</button>

<button
class="key"
onclick="add(2)"
>
2
</button>

<button
class="key"
onclick="add(3)"
>
3
</button>


<button
class="key"
onclick="add(4)"
>
4
</button>

<button
class="key"
onclick="add(5)"
>
5
</button>

<button
class="key"
onclick="add(6)"
>
6
</button>


<button
class="key"
onclick="add(7)"
>
7
</button>

<button
class="key"
onclick="add(8)"
>
8
</button>

<button
class="key"
onclick="add(9)"
>
9
</button>


<button
class="key"
onclick="add(0)"
>
0
</button>

<button
class="key"
onclick="delA()"
>
⌫
</button>

<button
class="key"
onclick="clearA()"
>
C
</button>

</div>


<!-- =========================
     操作按钮
========================= -->

<div class="actionBox">

<button
class="restart"
onclick="restart()"
>
🔄重新开始
</button>

<button
class="submit"
onclick="check()"
>
✅提交答案
</button>

</div>


<!-- =========================
     提示
========================= -->

<div
id="msg"
class="msg">
</div>


</div>

</div>


<script>

/* =========================
   九九乘法基础数据
========================= */

const nums=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];


let group=1;

let index=1;

let done=0;

let score=0;

let audioCtx=null;

let locked=false;


const world=
document.getElementById("world");

const scene=
document.getElementById("scene");

const forest=
document.getElementById("forest");

const answer=
document.getElementById("answer");


/* =========================
   创建树
========================= */

function treeSVG(){

return `

<svg viewBox="0 0 100 145">

<path
d="M50 140 Q47 105 50 72"
stroke="#71431f"
stroke-width="9"
fill="none"
stroke-linecap="round"
/>


<path
d="M50 100 L27 75
M50 91 L73 66
M50 78 L39 57
M51 76 L62 51"
stroke="#71431f"
stroke-width="4"
fill="none"
stroke-linecap="round"
/>


<g class="leaves">

<circle
cx="30"
cy="72"
r="23"
fill="#3b9145"
/>

<circle
cx="67"
cy="65"
r="27"
fill="#55aa59"
/>

<circle
cx="49"
cy="45"
r="25"
fill="#75c16c"
/>

<circle
cx="51"
cy="78"
r="25"
fill="#4da554"
/>

</g>

</svg>

`;

}


/* =========================
   创建九棵树
========================= */

function makeForest(){

forest.innerHTML="";


for(
let i=0;
i<9;
i++
){

let t=
document.createElement("div");

t.className=
"tree seed t"
+
(i+1);

t.innerHTML=
treeSVG();

forest.appendChild(t);

}

}


/* =========================
   中文数字
========================= */

function cnNum(n){

if(n<=9)
return nums[n];

if(n===10)
return "十";

if(n<20)
return "十"
+
nums[n%10];

if(n%10===0)
return nums[n/10]
+
"十";

return nums[
Math.floor(n/10)
]
+
"十"
+
nums[n%10];

}


/* =========================
   口诀
========================= */

function kouText(a,b){

let r=
a*b;

return nums[a]
+
nums[b]
+
(
r<10
?
"得"
:
""
)
+
cnNum(r);

}


/* =========================
   时间阶段
========================= */

function timePhase(){

let p=
(group-1)*9
+
done;


/*
  前18题：
  白天
*/

if(
p<18
){

world.classList.remove(
"dusk",
"night"
);

}


/*
  18～44题：
  夕阳
*/

else if(
p<45
){

world.classList.add(
"dusk"
);

world.classList.remove(
"night"
);

}


/*
  45题以后：
  夜晚
*/

else{

world.classList.add(
"night"
);

world.classList.remove(
"dusk"
);

}

}


/* =========================
   森林成长
========================= */

function forestStage(){

let completed=
score/10;

let trees=
[
...forest.children
];


trees.forEach(
(t,i)=>{

let growth=
Math.max(
0,
Math.min(
5,
Math.floor(
(completed-i)/2
)
+
1
)
);


t.className=
"tree t"
+
(i+1)
+
" "
+
(
[
"seed",
"s1",
"s2",
"s3",
"s4",
"s5"
][growth]
);


t.style.setProperty(
"--grow",
getComputedStyle(t).transform
);

}
);

}


/* =========================
   刷新界面
========================= */

function render(){

document
.getElementById("chapter")
.textContent=
"第"
+
group
+
"组："
+
nums[group]
+
"的乘法";


document
.getElementById("kou")
.textContent=
kouText(
group,
index
);


document
.getElementById("question")
.textContent=
group
+
" × "
+
index
+
" = ?";


document
.getElementById("progressText")
.textContent=
"本组进度："
+
done
+
"/9";


document
.getElementById("bar")
.style.width=
(done/9*100)
+
"%";


document
.getElementById("score")
.textContent=
score;


forestStage();

timePhase();

}


/* =========================
   答题音效
========================= */

function sound(
ok=true
){

try{

audioCtx ??=
new(
window.AudioContext
||
window.webkitAudioContext
)();


let o=
audioCtx
.createOscillator();


let g=
audioCtx
.createGain();


o.connect(g);

g.connect(
audioCtx.destination
);


o.frequency.value=
ok
?
880
:
260;


g.gain.value=
.06;


o.start();


o.stop(
audioCtx.currentTime
+
.12
);

}

catch(e){}

}


/* =========================
   浇水
========================= */

function water(){

let d=
document.createElement(
"div"
);


d.className=
"wdrop";


d.textContent=
"💧";


d.style.left=
(
48
+
Math.random()*8
)
+
"%";


scene.appendChild(d);


setTimeout(
()=>d.remove(),
900
);


/* 更新森林 */

forestStage();


/* 让一棵已经成长的树摇摆 */

let grown=
[
...forest.children
]
.find(
t=>
!t.classList.contains(
"seed"
)
);


if(grown){

grown.classList.remove(
"watered"
);


void grown.offsetWidth;


grown.classList.add(
"watered"
);

}

}


/* =========================
   动物事件
========================= */

function animalEvent(){

let r=
Math.random();


/*
  普通兔子
*/

if(
r<.48
){

let rabbit=
document.getElementById(
"rabbit"
);


rabbit.classList.remove(
"run"
);


void rabbit.offsetWidth;


rabbit.classList.add(
"run"
);


showAnimal(
"🐇 小兔子跑过森林！"
);

}


/*
  兔子 + 野狗追逐
*/

else if(
r<.62
&&
(
group>=5
||
world.classList.contains(
"night"
)
)
){

let rabbit=
document.getElementById(
"rabbit"
);


let dog=
document.getElementById(
"dog"
);


rabbit.classList.remove(
"run"
);

dog.classList.remove(
"run"
);


void rabbit.offsetWidth;

void dog.offsetWidth;


rabbit.classList.add(
"run"
);


setTimeout(
()=>dog.classList.add(
"run"
),
450
);


showAnimal(
"🐕 野狗追着小兔子跑过！"
);

}

}


/* =========================
   动物提示
========================= */

function showAnimal(
text
){

let m=
document.getElementById(
"msgAnimal"
);


m.textContent=
text;


m.classList.remove(
"show"
);


void m.offsetWidth;


m.classList.add(
"show"
);

}


/* =========================
   数字输入
========================= */

function add(n){

if(
!locked
&&
answer.value.length<2
){

answer.value+=n;

}

}


function delA(){

if(!locked){

answer.value=
answer.value.slice(
0,
-1
);

}

}


function clearA(){

if(!locked){

answer.value="";

}

}


/* =========================
   提交答案
========================= */

function check(){

if(locked)
return;


if(
answer.value===
""
){

document
.getElementById("msg")
.textContent=
"请输入答案";

return;

}


let user=
Number(
answer.value
);


/* =========================
   答对
========================= */

if(
user===
group*index
){

locked=true;


score+=10;

done++;


sound(true);

water();


/*
  答对以后停留，
  强化口诀
*/

document
.getElementById("kou")
.textContent=
kouText(
group,
index
);


document
.getElementById("question")
.textContent=
group
+
" × "
+
index
+
" = "
+
user;


document
.getElementById("msg")
.textContent=
"🌱 答对了！ "
+
kouText(
group,
index
);


/*
  0.9秒后进入下一题
*/

setTimeout(
()=>{


/* 一组完成 */

if(
done===9
){

sound(true);


document
.getElementById("msg")
.textContent=
"🎉 第"
+
group
+
"组完成！";


group++;

done=0;

index=1;


/* 九组完成 */

if(
group>9
){

group=1;


document
.getElementById("msg")
.textContent=
"🏆 九九乘法全部完成！";

}

}


/* 下一题 */

else{

index++;

}


answer.value="";

locked=false;


render();


/*
  偶尔触发动物
*/

if(
Math.random()<.24
){

animalEvent();

}
