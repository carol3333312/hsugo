<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九成长树 V3.1</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
background:linear-gradient(#9edcff,#fff3b0,#b9e8a0);
}

.app{
height:100vh;
max-width:390px;
margin:auto;
padding:8px;
padding-bottom:env(safe-area-inset-bottom);
}

.world{
height:100%;
background:rgba(255,255,255,.45);
border-radius:25px;
padding:10px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.top{
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:16px;
}

.scene{
height:180px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.sun{
position:absolute;
right:20px;
top:5px;
font-size:35px;
}

.moon{
display:none;
position:absolute;
right:20px;
top:5px;
font-size:35px;
}

.tree{
font-size:110px;
transition:.5s;
}

.tree.grow{
animation:shake .6s;
}

@keyframes shake{
0%{transform:rotate(0)}
25%{transform:rotate(-4deg)}
50%{transform:rotate(4deg)}
100%{transform:rotate(0)}
}

.water{
position:absolute;
top:20px;
font-size:28px;
animation:drop 1s forwards;
}

@keyframes drop{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(90px);
opacity:0;
}
}

.fruits{
position:absolute;
width:150px;
height:120px;
top:25px;
}

.score{
text-align:center;
}

.progress{
height:10px;
background:#ffffffaa;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
background:#43a047;
width:0;
}

.kou{
text-align:center;
font-size:32px;
font-weight:bold;
color:#222;
}

.question{
text-align:center;
font-size:32px;
font-weight:bold;
}

input{
display:block;
width:110px;
height:42px;
margin:3px auto;
font-size:25px;
text-align:center;
border-radius:12px;
border:1px solid #aaa;
}

.keys{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
}

button{
border:0;
border-radius:14px;
font-size:16px;
}

.key{
height:34px;
background:white;
}

.submit{
height:50px;
width:100%;
margin-top:8px;
background:#43a047;
color:white;
font-size:18px;
}

.restart{
height:40px;
width:100%;
margin-top:6px;
}

.msg{
height:18px;
text-align:center;
color:#388e3c;
}

</style>
</head>
