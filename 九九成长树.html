<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>九九成长树 V4.0</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
}


body{

background:#9edcff;

transition:background 3s;

}



body.night{

background:linear-gradient(
#101a40,
#263b66
);

}



.app{

height:100dvh;

max-width:390px;

margin:auto;

padding:8px;

padding-bottom:env(safe-area-inset-bottom);

}



.world{

height:100%;

background:rgba(255,255,255,.35);

border-radius:28px;

padding:10px;

overflow:hidden;

display:flex;

flex-direction:column;

}



.top{

display:flex;

justify-content:space-between;

font-weight:bold;

font-size:16px;

}



.scene{

height:190px;

position:relative;

overflow:hidden;

border-radius:20px;

}



.sky{

position:absolute;

width:100%;

height:100%;

}



.sun{

position:absolute;

right:25px;

top:15px;

font-size:40px;

transition:2s;

}



.moon{

display:none;

position:absolute;

right:25px;

top:15px;

font-size:38px;

}



.cloud{

position:absolute;

font-size:35px;

animation:cloudMove 15s linear infinite;

}



.cloud.one{

top:25px;

left:20px;

}



.cloud.two{

top:55px;

left:180px;

}



@keyframes cloudMove{

from{
transform:translateX(0);
}

to{
transform:translateX(120px);
}

}



.mountain{

position:absolute;

bottom:35px;

font-size:65px;

}



.mountain.one{

left:10px;

}



.mountain.two{

right:10px;

}



.river{

position:absolute;

bottom:0;

width:100%;

height:35px;

background:#72c8ee;

border-radius:50%;

}



.tree-area{

position:absolute;

bottom:25px;

left:50%;

transform:translateX(-50%);

}



.tree{

font-size:120px;

transition:.5s;

}



.tree.shake{

animation:shake .6s;

}



@keyframes shake{

25%{
transform:rotate(-4deg);
}

50%{
transform:rotate(4deg);
}

}



.fruit{

position:absolute;

font-size:22px;

}



.water{

position:absolute;

font-size:28px;

animation:waterDown 1s forwards;

}



@keyframes waterDown{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(90px);

opacity:0;

}

}



.score{

text-align:center;

margin-top:4px;

}



.progress{

height:10px;

background:#ffffffaa;

border-radius:20px;

overflow:hidden;

}



.bar{

height:100%;

width:0;

background:#43a047;

}



.kou{

text-align:center;

font-size:32px;

font-weight:bold;

}



.question{

text-align:center;

font-size:32px;

font-weight:bold;

}



input{

width:110px;

height:42px;

margin:4px auto;

display:block;

font-size:25px;

text-align:center;

border-radius:12px;

border:1px solid #aaa;

}



.keys{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:6px;

}



button{

border:0;

border-radius:15px;

font-size:17px;

transition:.15s;

}



button:active{

transform:scale(.94);

}



.key{

height:36px;

background:white;

}



.submit{

height:52px;

width:100%;

margin-top:10px;

background:#43a047;

color:white;

font-size:19px;

}



.restart{

height:42px;

width:100%;

margin-top:20px;

background:white;

}



.msg{

height:20px;

text-align:center;

color:#388e3c;

}



.flower{

position:absolute;

font-size:25px;

animation:fall 2s linear;

}



@keyframes fall{

from{

transform:translateY(-20px);

opacity:1;

}

to{

transform:translateY(180px);

opacity:0;

}

}


</style>
</head>
<body>


<div class="app">


<div class="world">



<div class="top">

<div>🌱 九九成长树</div>

<div id="chapter">
一的乘法村
</div>

</div>



<div class="scene" id="scene">



<div class="sky">


<div class="sun" id="sun">
☀️
</div>


<div class="moon" id="moon">
🌙
</div>



<div class="cloud one">
☁️
</div>


<div class="cloud two">
☁️
</div>



<div class="mountain one">
⛰️
</div>


<div class="mountain two">
🏔️
</div>



<div class="river">

</div>



<div class="tree-area">

<div class="tree" id="tree">

🌱

</div>


<div id="fruits">

</div>


</div>


</div>


</div>




<div class="score">

⭐成长值

<span id="score">
0
</span>

</div>



<div id="progressText">

第1组 0/9

</div>



<div class="progress">

<div class="bar" id="bar">

</div>

</div>




<div style="text-align:center">

📖口诀

</div>



<div class="kou" id="kou">

一一得一

</div>




<button onclick="startVoice()">

🌱开始学习

</button>




<div class="question" id="question">

1 × 1 = ?

</div>




<input id="answer" readonly>




<div class="keys">


<button class="key" onclick="add(1)">
1
</button>

<button class="key" onclick="add(2)">
2
</button>

<button class="key" onclick="add(3)">
3
</button>



<button class="key" onclick="add(4)">
4
</button>

<button class="key" onclick="add(5)">
5
</button>

<button class="key" onclick="add(6)">
6
</button>



<button class="key" onclick="add(7)">
7
</button>

<button class="key" onclick="add(8)">
8
</button>

<button class="key" onclick="add(9)">
9
</button>



<button class="key" onclick="add(0)">
0
</button>


<button class="key" onclick="delA()">
⌫
</button>


</div>




<button class="submit" onclick="check()">

✅提交答案

</button>




<button class="restart" onclick="restart()">

🔄重新开始

</button>




<div class="msg" id="msg">

</div>




</div>

</div>



<script>
  const nums=[
"",
"一",
"二",
"三",
"四",
"五",
"六",
"七",
"八",
"九"
];


let group=1;
let index=1;
let done=0;
let score=0;
let fruit=0;

let voiceEnable=false;



function cnNum(n){

if(n<=9){

return nums[n];

}

if(n==10){

return "十";

}

if(n<20){

return "十"+nums[n%10];

}

if(n%10==0){

return nums[n/10]+"十";

}

return nums[Math.floor(n/10)]
+"十"
+nums[n%10];

}



function kouText(a,b){

let r=a*b;


if(r<10){

return nums[a]+nums[b]+"得"+nums[r];

}


return nums[a]+nums[b]+cnNum(r);

}




function render(){


chapter.innerHTML=
"第"+group+"组："+nums[group]+"的乘法村";



kou.innerHTML=
kouText(group,index);



question.innerHTML=
group+" × "+index+" = ?";



progressText.innerHTML=
"第"+group+"组 "+done+"/9";



bar.style.width=
(done/9*100)+"%";



score.innerHTML=score;



if(score<30){

tree.innerHTML="🌱";

}

else if(score<80){

tree.innerHTML="🌿";

}

else if(score<160){

tree.innerHTML="🌳";

}

else{

tree.innerHTML="🌳🌸";

}



fruits.innerHTML="";



let fruitPos=[

"left:35px;top:35px",

"left:85px;top:20px",

"left:120px;top:55px",

"left:55px;top:70px",

"left:100px;top:80px"

];



for(let i=0;i<fruit;i++){


let f=document.createElement("div");

f.className="fruit";

f.innerHTML="🍎";

f.style.cssText=fruitPos[i];


fruits.appendChild(f);


}




}






// iPhone 音频

function sound(type){


try{


let ctx=new(window.AudioContext||window.webkitAudioContext)();


let osc=ctx.createOscillator();

let gain=ctx.createGain();


osc.connect(gain);

gain.connect(ctx.destination);



if(type=="ok"){

osc.frequency.value=880;

}

else if(type=="win"){

osc.frequency.value=1200;

}

else{

osc.frequency.value=300;

}



gain.gain.value=.08;


osc.start();


osc.stop(ctx.currentTime+.18);



}catch(e){}


}






function waterEffect(){



let w=document.createElement("div");

w.className="water";

w.innerHTML="💧";


scene.appendChild(w);


setTimeout(()=>{

w.remove();

},1000);



tree.classList.remove("shake");

void tree.offsetWidth;

tree.classList.add("shake");



}





function flowerEffect(){



for(let i=0;i<12;i++){


let f=document.createElement("div");


f.className="flower";


f.innerHTML="🌸";


f.style.left=Math.random()*300+"px";


f.style.top="0px";


scene.appendChild(f);



setTimeout(()=>{

f.remove();

},2000);



}



}






function add(n){


answer.value+=n;


}




function delA(){


answer.value=
answer.value.slice(0,-1);


}







function check(){



let value=
Number(answer.value);



if(value===group*index){



score+=10;


done++;


if(score%30===0 && fruit<5){

fruit++;

}



sound("ok");


waterEffect();



msg.innerHTML=
"🌱小树成长啦";





if(done>=9){


sound("win");


flowerEffect();


msg.innerHTML=
"🎉通关成功 👏";


group++;


done=0;


index=1;



if(group>9){

group=1;

}



}


else{


index++;

}




if(voiceEnable){


setTimeout(()=>{


voice();


},500);


}



}

else{


if(fruit>0){

fruit--;

}



sound("bad");


msg.innerHTML=
"🍎果实掉下来啦";



}



answer.value="";


render();



}







function startVoice(){


voiceEnable=true;


voice();


}







function voice(){


let u=

new SpeechSynthesisUtterance(
kouText(group,index)
);



u.lang="zh-CN";


u.rate=.8;


speechSynthesis.cancel();


speechSynthesis.speak(u);



}







function restart(){



if(confirm("确定重新开始吗？")){


group=1;

index=1;

done=0;

score=0;

fruit=0;


render();


}



}







// 白天夜晚循环

let night=false;


setInterval(()=>{


night=!night;



if(night){


document.body.classList.add("night");


sun.style.display="none";


moon.style.display="block";


}

else{


document.body.classList.remove("night");


sun.style.display="block";


moon.style.display="none";


}



},60000);







render();


</script>


</body>

</html>
