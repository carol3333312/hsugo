<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九成长树 V1.2</title>
<style>
*{box-sizing:border-box}
body{
margin:0;height:100dvh;overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
background:linear-gradient(#9edcff,#eaffd5);
}
.app{
height:100dvh;max-width:390px;margin:auto;
padding:8px;padding-bottom:env(safe-area-inset-bottom);
display:flex;
}
.world{
width:100%;height:100%;
background:#ffffff55;border-radius:25px;
padding:10px;display:flex;flex-direction:column;
overflow:hidden;
}
.top{display:flex;justify-content:space-between;font-weight:bold}
.treeBox{
height:190px;position:relative;
display:flex;align-items:center;justify-content:center;
}
.tree{font-size:120px;transition:.5s}
.fruits{position:absolute;font-size:30px;top:25px}
.hero{position:absolute;left:35px;top:115px;font-size:35px}
.score{text-align:center}
.progress{height:10px;background:#ffffffaa;border-radius:10px}
.bar{height:100%;background:#43a047;width:0}
.kou{text-align:center;font-size:32px;font-weight:bold;color:#222}
.question{text-align:center;font-size:32px;font-weight:bold}
input{
width:100px;height:38px;margin:3px auto;
display:block;text-align:center;font-size:24px;
border-radius:12px;border:1px solid #aaa;
}
.keys{
display:grid;grid-template-columns:repeat(3,1fr);
gap:5px;
}
button{
height:34px;border:0;border-radius:12px;font-size:16px;
}
.key{background:white}
.main{background:#4caf50;color:white}
.msg{text-align:center;color:#388e3c;height:22px}
</style>
</head>
<body>
<div class="app">
<div class="world">
<div class="top"><div>🌱 九九成长树</div><div id="chapter"></div></div>

<div class="treeBox">
<div class="hero">👦💧</div>
<div class="tree" id="tree">🌱</div>
<div class="fruits" id="fruits"></div>
</div>

<div class="score">⭐成长值 <span id="score">0</span></div>
<div id="progressText"></div>
<div class="progress"><div id="bar" class="bar"></div></div>

<div style="text-align:center">📖口诀</div>
<div id="kou" class="kou"></div>
<button onclick="voice()">🔊听口诀</button>

<div id="question" class="question"></div>
<input id="answer" readonly>

<div class="keys">
<button class="key" onclick="add(1)">1</button>
<button class="key" onclick="add(2)">2</button>
<button class="key" onclick="add(3)">3</button>
<button class="key" onclick="add(4)">4</button>
<button class="key" onclick="add(5)">5</button>
<button class="key" onclick="add(6)">6</button>
<button class="key" onclick="add(7)">7</button>
<button class="key" onclick="add(8)">8</button>
<button class="key" onclick="add(9)">9</button>
<button class="key" onclick="add(0)">0</button>
<button class="key" onclick="delA()">⌫</button>
</div>

<button class="main" onclick="check()">💧浇水成长</button>
<button onclick="restart()">🔄重新开始</button>
<div id="msg" class="msg"></div>
</div>
</div>

<script>
const nums=["","一","二","三","四","五","六","七","八","九"];
let group=1,index=1,done=0,score=0,fruit=0;

function kou(a,b){
let r=a*b;
return r<10?nums[a]+nums[b]+"得"+nums[r]:nums[a]+nums[b]+r;
}

function render(){
chapter.innerHTML="第"+group+"组："+nums[group]+"的乘法村";
document.getElementById("kou").innerHTML=kou(group,index);
question.innerHTML=group+" × "+index+" = ?";
progressText.innerHTML="第"+group+"组 "+done+"/9";
bar.style.width=(done/9*100)+"%";
scoreEl.innerHTML=score;

if(score<30)tree.innerHTML="🌱";
else if(score<80)tree.innerHTML="🌿";
else tree.innerHTML="🌳";

fruits.innerHTML="🍎".repeat(fruit);
}

function sound(freq=700){
let c=new AudioContext();
let o=c.createOscillator();
let g=c.createGain();
o.connect(g);g.connect(c.destination);
o.frequency.value=freq;
g.gain.value=.08;
o.start();o.stop(c.currentTime+.15);
}

function add(n){answer.value+=n}
function delA(){answer.value=answer.value.slice(0,-1)}

function check(){
if(Number(answer.value)==group*index){
score+=10;done++;
if(score>=50&&fruit<9)fruit++;
sound(900);
msg.innerHTML="🎵 答对啦，小树喝饱水！";

if(done>=9){
sound(1200);
msg.innerHTML="🎉 通关进入下一组";
group++;done=0;index=1;
if(group>9)group=1;
}else index++;

}else{
if(fruit>0)fruit--;
score=Math.max(0,score-5);
sound(300);
msg.innerHTML="🍎 果实掉下来啦，再看看口诀";
}
answer.value="";
render();
}

function voice(){
let u=new SpeechSynthesisUtterance(kou(group,index));
u.lang="zh-CN";
speechSynthesis.cancel();
speechSynthesis.speak(u);
}

function restart(){
group=1;index=1;done=0;score=0;fruit=0;
render();
}

let scoreEl=document.getElementById("score");
render();
</script>
</body>
</html>
