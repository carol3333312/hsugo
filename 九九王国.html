
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九成长树 V1.3</title>
<style>
*{box-sizing:border-box}
body{
margin:0;height:100dvh;overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
background:linear-gradient(#8ed8ff,#fff3b0,#b8e994);
}
.app{
height:100dvh;max-width:390px;margin:auto;
padding:8px;padding-bottom:env(safe-area-inset-bottom);
}
.world{
height:100%;border-radius:25px;
background:#ffffff66;padding:10px;
display:flex;flex-direction:column;
}
.top{display:flex;justify-content:space-between;font-weight:bold}
.scene{
height:185px;position:relative;
display:flex;justify-content:center;align-items:center;
overflow:hidden;
}
.sun{position:absolute;right:20px;top:10px;font-size:35px}
.moon{display:none;position:absolute;right:20px;top:10px;font-size:35px}
.tree{font-size:100px;transition:.5s}
.hero{position:absolute;left:25px;bottom:10px;font-size:38px}
.fruits{position:absolute;top:70px;font-size:24px}
.score{text-align:center}
.progress{height:10px;background:#fff8;border-radius:10px}
.bar{height:100%;background:#43a047;width:0}
.kou{text-align:center;font-size:32px;font-weight:bold;color:#222}
.question{text-align:center;font-size:32px;font-weight:bold}
input{
width:110px;height:38px;margin:3px auto;
display:block;font-size:25px;text-align:center;
border-radius:12px;border:1px solid #999;
}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button{
height:34px;border:0;border-radius:12px;font-size:16px
}
.key{background:white}
.submit{background:#4caf50;color:white}
.msg{text-align:center;height:22px;color:#388e3c}
</style>
</head>
<body>
<div class="app">
<div class="world">

<div class="top">
<div>🌱 九九成长树</div>
<div id="chapter"></div>
</div>

<div class="scene">
<div class="sun" id="sun">☀️</div>
<div class="moon" id="moon">🌙</div>
<div class="hero">👦💧</div>
<div class="tree" id="tree">🌱</div>
<div class="fruits" id="fruits"></div>
</div>

<div class="score">⭐成长值 <span id="score">0</span></div>
<div id="progressText"></div>
<div class="progress"><div id="bar" class="bar"></div></div>

<div style="text-align:center">📖口诀</div>
<div id="kou" class="kou"></div>

<button onclick="voice()">🔊听口诀</button>

<div id="question" class="question"></div>
<input id="answer" readonly>

<div class="keys">
<button class="key" onclick="add(1)">1</button>
<button class="key" onclick="add(2)">2</button>
<button class="key" onclick="add(3)">3</button>
<button class="key" onclick="add(4)">4</button>
<button class="key" onclick="add(5)">5</button>
<button class="key" onclick="add(6)">6</button>
<button class="key" onclick="add(7)">7</button>
<button class="key" onclick="add(8)">8</button>
<button class="key" onclick="add(9)">9</button>
<button class="key" onclick="add(0)">0</button>
<button class="key" onclick="delA()">⌫</button>
</div>

<button class="submit" onclick="check()">✅提交答案</button>
<button onclick="restart()">🔄重新开始</button>

<div id="msg" class="msg"></div>

</div>
</div>

<script>
const nums=["","一","二","三","四","五","六","七","八","九"];
let group=1,index=1,done=0,score=0,fruit=0;

function getKou(a,b){
let r=a*b;
return r<10?nums[a]+nums[b]+"得"+nums[r]:nums[a]+nums[b]+r;
}

function render(){
chapter.innerHTML="第"+group+"组："+nums[group]+"的乘法村";
kou.innerHTML=getKou(group,index);
question.innerHTML=group+" × "+index+" = ?";
progressText.innerHTML="第"+group+"组 "+done+"/9";
bar.style.width=done/9*100+"%";
scoreEl.innerHTML=score;

if(score<30)tree.innerHTML="🌱";
else if(score<80)tree.innerHTML="🌿";
else if(score<160)tree.innerHTML="🌳";
else tree.innerHTML="🌳🌸";

fruits.innerHTML="🍎".repeat(fruit);

if(score>200){
sun.style.display="none";
moon.style.display="block";
}else{
sun.style.display="block";
moon.style.display="none";
}
}

let audioReady=false;
function beep(type="ok"){
try{
let ctx=new(window.AudioContext||window.webkitAudioContext)();
let o=ctx.createOscillator();
let g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
o.frequency.value=type==="ok"?880:300;
g.gain.value=.08;
o.start();
o.stop(ctx.currentTime+.15);
}catch(e){}
}

function add(n){answer.value+=n}
function delA(){answer.value=answer.value.slice(0,-1)}

function check(){
if(answer.value==="")return;

if(Number(answer.value)==group*index){
score+=10;
done++;
if(fruit<10&&score%30===0)fruit++;
beep("ok");
msg.innerHTML="💧浇水成功，小树长大啦";

if(done>=9){
beep("ok");
msg.innerHTML="🎉 这一组完成，进入下一片森林";
group++;
done=0;
index=1;
if(group>9)group=1;
}else index++;

}else{
if(fruit>0)fruit--;
beep("bad");
msg.innerHTML="🍎果实掉下来啦，再想想口诀";
}
answer.value="";
render();
}

function voice(){
let u=new SpeechSynthesisUtterance(getKou(group,index));
u.lang="zh-CN";
speechSynthesis.cancel();
speechSynthesis.speak(u);
}

function restart(){
group=1;index=1;done=0;score=0;fruit=0;
render();
}

let scoreEl=document.getElementById("score");
render();
</script>
</body>
</html>
