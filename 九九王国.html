<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>九九成长树 V1.1</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
overflow:hidden;
font-family:"Microsoft YaHei",sans-serif;
background:linear-gradient(#9edcff,#eaffd5);
}
.app{
max-width:390px;
height:100vh;
margin:auto;
padding:8px;
display:flex;
flex-direction:column;
}
.world{
flex:1;
background:rgba(255,255,255,.35);
border-radius:25px;
position:relative;
overflow:hidden;
padding:10px;
}
.top{
display:flex;
justify-content:space-between;
font-weight:bold;
}
.hero{
position:absolute;
left:45px;
top:130px;
font-size:45px;
}
.treeBox{
height:250px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}
.tree{
font-size:130px;
}
.fruits{
position:absolute;
top:50px;
font-size:35px;
}
.progress{
height:12px;
background:#ffffffaa;
border-radius:20px;
overflow:hidden;
}
.bar{
height:100%;
background:#43a047;
width:0;
}
.kou{
text-align:center;
font-size:34px;
font-weight:bold;
color:#222;
}
.question{
text-align:center;
font-size:35px;
font-weight:bold;
}
input{
display:block;
margin:auto;
width:110px;
height:42px;
font-size:25px;
text-align:center;
border-radius:12px;
border:1px solid #aaa;
}
.keys{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
margin-top:8px;
}
button{
border:0;
height:38px;
border-radius:12px;
font-size:16px;
}
.key{background:white}
.main{background:#4caf50;color:white}
.msg{text-align:center;color:#388e3c;height:22px}
</style>
</head>
<body>
<div class="app">
<div class="world">

<div class="top">
<div>🌱 九九成长树</div>
<div id="chapter">一的乘法村</div>
</div>

<div class="treeBox">
<div class="tree" id="tree">🌱</div>
<div class="fruits" id="fruits"></div>
</div>

<div class="hero">👦💧</div>

<div style="text-align:center">
⭐成长值 <span id="score">0</span>
</div>

<div id="progressText">第1组 0/9</div>
<div class="progress"><div id="bar" class="bar"></div></div>

<div style="text-align:center">📖口诀</div>
<div id="kou" class="kou">一一得一</div>

<button onclick="voice()">🔊听口诀</button>

<div id="question" class="question">1 × 1 = ?</div>

<input id="answer" readonly>

<div class="keys">
<button class="key" onclick="add(1)">1</button>
<button class="key" onclick="add(2)">2</button>
<button class="key" onclick="add(3)">3</button>
<button class="key" onclick="add(4)">4</button>
<button class="key" onclick="add(5)">5</button>
<button class="key" onclick="add(6)">6</button>
<button class="key" onclick="add(7)">7</button>
<button class="key" onclick="add(8)">8</button>
<button class="key" onclick="add(9)">9</button>
<button class="key" onclick="add(0)">0</button>
<button class="key" onclick="delA()">⌫</button>
</div>

<button class="main" onclick="check()">💧浇水成长</button>
<button onclick="restart()">🔄重新开始</button>

<div id="msg" class="msg"></div>

</div>
</div>

<script>
const nums=["","一","二","三","四","五","六","七","八","九"];
let group=1,index=1,done=0,score=0;

function cn(n){
if(n<=9)return nums[n];
if(n==10)return"十";
return nums[Math.floor(n/10)]+"十"+(n%10?nums[n%10]:"");
}

function kou(a,b){
let r=a*b;
if(r<10)return nums[a]+nums[b]+"得"+nums[r];
return nums[a]+nums[b]+cn(r);
}

function render(){
chapter.innerText="第"+group+"组："+nums[group]+"的乘法村";
kouEl.innerText=kou(group,index);
question.innerText=group+" × "+index+" = ?";
progressText.innerText="第"+group+"组 "+done+"/9";
bar.style.width=done/9*100+"%";
scoreEl.innerText=score;

if(score<30)tree.innerText="🌱";
else if(score<80)tree.innerText="🌿";
else if(score<150){tree.innerText="🌳";fruits.innerText="🌸";}
else if(score<300){tree.innerText="🌳";fruits.innerText="🍎🍎";}
else{tree.innerText="🌳";fruits.innerText="🍎🍊";}
}

function add(n){
answer.value+=n;
}
function delA(){
answer.value=answer.value.slice(0,-1);
}

function check(){
if(Number(answer.value)==group*index){
score+=10;
done++;
msg.innerText="🎵 叮！答对啦，小树喝到水了";

if(done>=9){
msg.innerText="🎉 通关！进入下一片森林";
group++;
done=0;
index=1;
if(group>9)group=1;
}else{
index++;
}

answer.value="";
render();

}else{
msg.innerText="😊 再看看口诀";
}
}

function voice(){
let u=new SpeechSynthesisUtterance(kou(group,index));
u.lang="zh-CN";
speechSynthesis.cancel();
speechSynthesis.speak(u);
}

function restart(){
group=1;index=1;done=0;score=0;
render();
}

let chapter=document.getElementById("chapter");
let kouEl=document.getElementById("kou");
let question=document.getElementById("question");
let answer=document.getElementById("answer");
let scoreEl=document.getElementById("score");
let tree=document.getElementById("tree");
let fruits=document.getElementById("fruits");
let bar=document.getElementById("bar");
let progressText=document.getElementById("progressText");
let msg=document.getElementById("msg");

render();
</script>
</body>
</html>
