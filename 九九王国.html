<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>九九成长树 V1.4</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(#8ed8ff,#fff3b0,#b8e994)}
.app{height:100dvh;max-width:390px;margin:auto;padding:8px;padding-bottom:env(safe-area-inset-bottom)}
.world{height:100%;border-radius:25px;background:#ffffff66;padding:10px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-weight:bold}
.scene{height:185px;position:relative;display:flex;justify-content:center;align-items:center}
.tree{font-size:100px}
.fruits{position:absolute;top:65px;font-size:24px}
.hero{position:absolute;left:25px;bottom:10px;font-size:38px}
.kou{text-align:center;font-size:32px;font-weight:bold}
.question{text-align:center;font-size:32px;font-weight:bold}
input{width:110px;height:40px;margin:3px auto;display:block;font-size:25px;text-align:center;border-radius:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
button{border:0;border-radius:14px;font-size:16px}
.key{height:34px;background:white}
.submit{width:100%;height:46px;margin-top:8px;background:#4caf50;color:white;font-size:18px}
.restart{width:100%;height:40px;margin-top:6px;background:white}
.progress{height:10px;background:#fff8;border-radius:10px}
.bar{height:100%;background:#43a047;width:0}
.msg{text-align:center;height:22px;color:#388e3c}
</style>
</head>
<body>
<div class="app"><div class="world">
<div class="top"><div>🌱 九九成长树</div><div id="chapter"></div></div>
<div class="scene"><div class="hero">👦💧</div><div id="tree" class="tree">🌱</div><div id="fruits" class="fruits"></div></div>
<div style="text-align:center">⭐成长值 <span id="score">0</span></div>
<div id="progressText"></div><div class="progress"><div id="bar" class="bar"></div></div>
<div style="text-align:center">📖口诀</div><div id="kou" class="kou"></div>
<button onclick="voice()">🔊听口诀</button>
<div id="question" class="question"></div>
<input id="answer" readonly>
<div class="keys">
<button class="key" onclick="add(1)">1</button><button class="key" onclick="add(2)">2</button><button class="key" onclick="add(3)">3</button>
<button class="key" onclick="add(4)">4</button><button class="key" onclick="add(5)">5</button><button class="key" onclick="add(6)">6</button>
<button class="key" onclick="add(7)">7</button><button class="key" onclick="add(8)">8</button><button class="key" onclick="add(9)">9</button>
<button class="key" onclick="add(0)">0</button><button class="key" onclick="delA()">⌫</button>
</div>
<button class="submit" onclick="check()">✅提交答案</button>
<button class="restart" onclick="restart()">🔄重新开始</button>
<div id="msg" class="msg"></div>
</div></div>
<script>
const nums=["","一","二","三","四","五","六","七","八","九"];
let group=1,index=1,done=0,score=0,fruit=0;
function getKou(a,b){let r=a*b;return r<10?nums[a]+nums[b]+"得"+nums[r]:nums[a]+nums[b]+r}
function render(){
chapter.innerHTML="第"+group+"组："+nums[group]+"的乘法村";
kou.innerHTML=getKou(group,index);
question.innerHTML=group+" × "+index+" = ?";
progressText.innerHTML="第"+group+"组 "+done+"/9";
bar.style.width=done/9*100+"%";score.innerHTML=score;
tree.innerHTML=score<30?"🌱":score<80?"🌿":score<160?"🌳":"🌳🌸";
fruits.innerHTML="🍎".repeat(fruit);
}
function add(n){answer.value+=n}
function delA(){answer.value=answer.value.slice(0,-1)}
function tone(f){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.08;o.start();o.stop(c.currentTime+.15)}catch(e){}}
function check(){
if(Number(answer.value)==group*index){score+=10;done++;if(score%30==0)fruit++;tone(880);msg.innerHTML="💧浇水成功，小树长大啦";if(done>=9){group++;done=0;index=1}else index++}
else{if(fruit>0)fruit--;tone(300);msg.innerHTML="🍎果实掉下来啦，再想想口诀"}
answer.value="";render()
}
function voice(){let u=new SpeechSynthesisUtterance(getKou(group,index));u.lang="zh-CN";speechSynthesis.speak(u)}
function restart(){group=1;index=1;done=0;score=0;fruit=0;render()}
render();
</script>
</body>
</html>
