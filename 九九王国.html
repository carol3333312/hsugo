from pathlib import Path

html = """<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>九九王国测试版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#8ed8ff,#dff7c8);font-family:"Microsoft YaHei",sans-serif}

</style>
</head>
<body>
