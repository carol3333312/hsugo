<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>九九成长树 V1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#a9e3ff,#eaffd0);font-family:"Microsoft YaHei",sans-serif}
.app{max-width:390px;height:100vh;margin:auto;padding:8px;display:flex;flex-direction:column;overflow:hidden}
.scene{background:#ffffffaa;border-radius:25px;flex:1;text-align:center;padding:10px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-weight:bold}
.hero{font-size:40px}
.tree{font-size:100px;line-height:110px}
.fruit{font-size:30px;height:35px}
.info{font-size:16px}
.barbg{height:12px;background:#ddd;border-radius:10px}
.bar{height:100%;background:#4caf50;width:0}
.kou{font-size:34px;font-weight:bold;margin:8px;color:#111}
.question{font-size:35px;font-weight:bold}
input{width:110px;height:40px;font-size:25px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px}
button{border:0;border-radius:12px;height:38px;font-size:16px}
.key{background:#eef5ff}
.main{background:#4caf50;color:white}
.msg{color:#2e7d32;height:24px}
</style>
</head>
<body>
<div class="app">
<div class="scene">
<div class="top"><span>🌱九九成长树</span><span id="group"></span></div>
<div>⭐<span id="score">0</span></div>
<div class="hero">👦</div>
<div id="tree" class="tree">🌰</div>
<div id="fruit" class="fruit"></div>

<div id="progress"></div>
<div class="barbg"><div id="bar" class="bar"></div></div>

<div class="kou" id="kou"></div>
<button onclick="voice()">🔊口诀</button>

<div id="q" class="question"></div>
<input id="ans" readonly>

<div class="keys">
<button class="key" onclick="add(1)">1</button>
<button class="key" onclick="add(2)">2</button>
<button class="key" onclick="add(3)">3</button>
<button class="key" onclick="add(4)">4</button>
<button class="key" onclick="add(5)">5</button>
<button class="key" onclick="add(6)">6</button>
<button class="key" onclick="add(7)">7</button>
<button class="key" onclick="add(8)">8</button>
<button class="key" onclick="add(9)">9</button>
<button class="key" onclick="add(0)">0</button>
<button class="key" onclick="del()">⌫</button>
</div>

<button class="main" onclick="check()">💧提交答案</button>
<button onclick="restart()">🔄重新开始</button>
<div class="msg" id="msg"></div>
</div>
</div>

<script>
const nums=["","一","二","三","四","五","六","七","八","九"];
let group=1,index=1,done=0,score=0;

function cn(n){
if(n<=9)return nums[n];
if(n==10)return"十";
return nums[Math.floor(n/10)]+"十"+(n%10?nums[n%10]:"");
}
function kou(a,b){
let r=a*b;
if(r<10)return nums[a]+nums[b]+"得"+nums[r];
return nums[a]+nums[b]+cn(r);
}
function render(){
groupEl.innerText="第"+group+"组："+nums[group]+"的乘法";
kouEl.innerText=kou(group,index);
qEl.innerText=group+" × "+index+" = ?";
progress.innerText=done+"/9";
bar.style.width=(done/9*100)+"%";
scoreEl.innerText=score;
tree.innerText=score<30?"🌰":score<80?"🌱":score<150?"🌿":"🌳";
fruit.innerText=score>=150?"🍎🍊🍉":"";
}
function add(n){ans.value+=n}
function del(){ans.value=ans.value.slice(0,-1)}
function check(){
if(Number(ans.value)==group*index){
score+=10;done++;
msg.innerText="✨答对啦！小树成长";
if(done==9){
msg.innerText="🎉通关！进入下一关";
group++;done=0;
if(group>9)group=1;
index=1;
}else index++;
ans.value="";
render();
}else{
msg.innerText="😊再想想口诀";
}
}
function voice(){
let u=new SpeechSynthesisUtterance(kou(group,index));
u.lang="zh-CN";speechSynthesis.speak(u);
}
function restart(){
group=1;index=1;done=0;score=0;ans.value="";
render();
}
let groupEl=document.getElementById("group"),kouEl=document.getElementById("kou"),qEl=document.getElementById("q"),scoreEl=document.getElementById("score");
let tree=document.getElementById("tree"),fruit=document.getElementById("fruit"),bar=document.getElementById("bar"),progress=document.getElementById("progress"),msg=document.getElementById("msg"),ans=document.getElementById("ans");
render();
</script>
</body>
</html>
